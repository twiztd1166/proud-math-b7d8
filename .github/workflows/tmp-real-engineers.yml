name: Temporary AI Coding for Real Engineers analysis

on:
  push:
    branches:
      - tmp-real-engineers-20260930
    paths:
      - '.github/workflows/tmp-real-engineers.yml'

permissions:
  contents: read

jobs:
  prepare-model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore/cache Whisper model
        id: hf-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: faster-whisper-small-en-v1
      - name: Download model on cache miss
        if: steps.hf-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --quiet faster-whisper
          python - <<'PY'
          from faster_whisper import WhisperModel
          WhisperModel("small.en", device="cpu", compute_type="int8", cpu_threads=2)
          print("model cached")
          PY

  transcribe:
    needs: prepare-model
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 11
      matrix:
        include:
          - { label: '028-035', start: 28, end: 35 }
          - { label: '036-046', start: 36, end: 46 }
          - { label: '047', start: 47, end: 47 }
          - { label: '048', start: 48, end: 48 }
          - { label: '049-058', start: 49, end: 58 }
          - { label: '059-070', start: 59, end: 70 }
          - { label: '071-088', start: 71, end: 88 }
          - { label: '089', start: 89, end: 89 }
          - { label: '090', start: 90, end: 90 }
          - { label: '091', start: 91, end: 91 }
          - { label: '092', start: 92, end: 92 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: faster-whisper-small-en-v1
      - name: Install runtime
        run: python -m pip install --quiet faster-whisper requests
      - name: Transcribe batch
        env:
          BVID: BV16eKb6PEUo
          START_PART: ${{ matrix.start }}
          END_PART: ${{ matrix.end }}
          BATCH_LABEL: ${{ matrix.label }}
        run: python tools/real_engineers/transcribe_batch.py
      - name: Upload encrypted analysis artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-engineers-${{ matrix.label }}
          path: |
            batch_${{ matrix.label }}.tar.gz.enc
            batch_${{ matrix.label }}.key.enc
            batch_manifest_${{ matrix.label }}.json
          if-no-files-found: error
          retention-days: 1
