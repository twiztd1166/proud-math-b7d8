name: Paradise Shows 2026-2027 calendar verifier

on:
  push:
    branches:
      - agent/calendar-2026-2027-20260929
  pull_request:
    branches:
      - verify-stable-notes-20260929
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check frontend JavaScript syntax
        shell: bash
        run: |
          node --check public/app-core.js
          node --check public/app-shows.js
          node --check public/app-bind.js
          node --check public/app-annual-api.js
          node --check public/app-annual-scope.js
          node --check public/app-modals.js

      - name: Verify calendar year controls
        shell: bash
        run: |
          grep -q "calendarYear:2026" public/app-core.js
          grep -q "data-calendar-year=\"2026\"" public/app-shows.js
          grep -q "data-calendar-year=\"2027\"" public/app-shows.js
          grep -q "function render2026Calendar" public/app-shows.js
          grep -q "data-calendar-show" public/app-shows.js
          grep -q "data-calendar-show" public/app-bind.js
          grep -q "20260929-calendar-v1" src/pages/index.astro
          grep -q "paradise-shows-public-v10" public/sw.js

      - name: Verify live 2026 operating calendar source
        shell: bash
        run: |
          curl --retry 4 --retry-delay 2 --retry-all-errors -fsS \
            -H 'Content-Type: application/json' \
            -X POST 'https://taxlrlfsobtnbasjcnuf.supabase.co/functions/v1/shows-api' \
            --data '{"action":"bootstrap"}' -o /tmp/bootstrap.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/bootstrap.json'))
          assert x.get('ok') is True, x
          rows=[r for r in x.get('shows',[]) if str(r.get('event_start') or '').startswith('2026-')]
          assert len(rows)==29, len(rows)
          assert any(r.get('this_year')=='SKIP THIS YEAR' for r in rows)
          print('2026 governed dated rows:',len(rows))
          PY

      - name: Verify published 2027 planning calendar source
        shell: bash
        run: |
          curl --retry 4 --retry-delay 2 --retry-all-errors -fsS \
            'https://taxlrlfsobtnbasjcnuf.supabase.co/functions/v1/shows-annual-plan-api?year=2027' \
            -o /tmp/annual.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/annual.json'))
          assert x.get('ok') is True, x
          assert x.get('published') is True, x
          assert x.get('year') == 2027, x
          assert len(x.get('rows',[])) == 342, len(x.get('rows',[]))
          print('2027 published plan rows:',len(x.get('rows',[])))
          PY
