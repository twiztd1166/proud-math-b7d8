name: Verify Paradise Shows GitHub CDN

on:
  push:
    branches:
      - paradise-shows-public

permissions:
  contents: read

jobs:
  verify:
    if: contains(github.event.head_commit.message, 'Verify Paradise Shows GitHub CDN')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE: https://raw.githack.com/twiztd1166/proud-math-b7d8/paradise-shows-public/public/index-standalone.html
    steps:
      - uses: actions/checkout@v4
      - name: Check static host response
        shell: bash
        run: |
          curl -fsS -D /tmp/headers "$SITE" -o /tmp/index.html
          cat /tmp/headers
          grep -qi '^content-type: text/html' /tmp/headers
          grep -q '<title>Paradise Shows</title>' /tmp/index.html
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Render app and open Notes
        shell: bash
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            const errors=[];
            page.on('pageerror',e=>errors.push('pageerror: '+e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push('console: '+m.text())});
            page.on('requestfailed',r=>errors.push('requestfailed: '+r.url()+' :: '+(r.failure()?.errorText||'')));
            const resp=await page.goto(process.env.SITE,{waitUntil:'networkidle',timeout:60000});
            if((resp?.status()||0)>=400)throw new Error('HTTP '+resp?.status());
            if((await page.title())!=='Paradise Shows')throw new Error('Wrong title: '+await page.title());
            await page.waitForFunction(()=>!document.querySelector('#content')?.textContent?.includes('Loading current control state'),null,{timeout:45000}).catch(()=>{});
            await page.waitForSelector('.card[data-id]',{timeout:45000});
            await page.locator('.card[data-id]').first().click();
            await page.waitForSelector('#detailModal.show',{timeout:15000});
            const detail=await page.locator('#detailBody').innerText();
            console.log(detail.slice(0,4000));
            if(!/Manager notes/i.test(detail))throw new Error('Manager notes not visible');
            if(await page.locator('#showNoteInput').count()!==1)throw new Error('Note composer missing');
            if(await page.locator('#showNoteAddBtn').count()!==1)throw new Error('Add note button missing');
            if(errors.length)throw new Error(errors.join('\n'));
            await page.screenshot({path:'/tmp/githack-notes.png',fullPage:true});
            await browser.close();
          })();
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paradise-shows-githack-render
          path: /tmp/githack-notes.png