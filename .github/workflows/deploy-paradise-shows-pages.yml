name: Deploy Paradise Shows to Cloudflare Pages

on:
  push:
    branches:
      - paradise-shows-public
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paradise-shows-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Build Paradise Shows
        run: |
          npm ci
          npm run build
      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Deploy preview branch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy dist \
            --project-name proud-math-b7d8 \
            --branch paradise-shows-public \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "${{ github.event.head_commit.message || 'Paradise Shows deploy' }}"
      - name: Verify deployed notes bundle
        shell: bash
        run: |
          SITE='https://paradise-shows-public.proud-math-b7d8.pages.dev'
          for i in {1..30}; do
            if curl -fsS "$SITE/" | grep -q '20260929-notes-v2' \
              && curl -fsS "$SITE/app-modals.js?v=20260929-notes-v2" | grep -q 'profileNoteAddBtn' \
              && curl -fsS "$SITE/app-modals.js?v=20260929-notes-v2" | grep -q 'Manager notes'; then
              echo 'Paradise Shows Notes UI is live.'
              exit 0
            fi
            sleep 5
          done
          echo 'Cloudflare deployment completed but Notes UI did not verify.'
          exit 1