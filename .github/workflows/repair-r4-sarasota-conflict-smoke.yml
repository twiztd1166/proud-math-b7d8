name: Temporary R4 Sarasota smoke repair

on:
  push:
    branches:
      - fix-r4-sarasota-conflict-smoke-0910

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix-r4-sarasota-conflict-smoke-0910
      - name: Apply exact workflow-only repair and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          target = Path('.github/workflows/debug-paradise-shows-live.yml')
          old = "assert 'ACS West Palm Beach Home Show' in (sar_fall.get('conflict_notes') or ''), sar_fall"
          new = "assert 'ACS West Palm' in (sar_fall.get('conflict_notes') or ''), sar_fall"
          text = target.read_text()
          assert text.count(old) == 1, f'Expected exactly one stale assertion, found {text.count(old)}'
          target.write_text(text.replace(old, new))
          PY
          rm .github/workflows/repair-r4-sarasota-conflict-smoke.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/debug-paradise-shows-live.yml .github/workflows/repair-r4-sarasota-conflict-smoke.yml
          git diff --cached --check
          git diff --cached
          git commit -m "Fix R4 Sarasota conflict smoke assertion"
          git push origin HEAD:fix-r4-sarasota-conflict-smoke-0910
