# Test-only physical hardware preparation gate; never production activation.
name: Validate Paradise Performance device acceptance

on:
  push:
    branches:
      - agent/paradise-performance-device-acceptance-v1
    paths:
      - 'performance/**'
      - 'scripts/validate-performance-*.mjs'
      - 'scripts/build-performance-device-acceptance.mjs'
      - 'scripts/prepare-performance-android-shell.mjs'
      - 'scripts/prepare-performance-ios-shell.rb'
      - 'capacitor.acceptance.config.json'
      - '.github/workflows/validate-paradise-performance-device-acceptance.yml'
  pull_request:
    paths:
      - 'performance/**'
      - 'scripts/validate-performance-*.mjs'
      - 'scripts/build-performance-device-acceptance.mjs'
      - 'scripts/prepare-performance-android-shell.mjs'
      - 'scripts/prepare-performance-ios-shell.rb'
      - 'capacitor.acceptance.config.json'
      - '.github/workflows/validate-paradise-performance-device-acceptance.yml'

permissions:
  contents: read

concurrency:
  group: paradise-performance-device-acceptance-${{ github.ref }}
  cancel-in-progress: true

env:
  CAPACITOR_VERSION: '8.5.0'
  SUPABASE_JS_VERSION: '2.111.0'
  ESBUILD_VERSION: '0.25.9'

jobs:
  contracts:
    name: Acceptance contracts and isolation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install repository dependencies
        run: npm ci

      - name: Foundation controls
        run: node scripts/validate-performance-foundation.mjs

      - name: Enrollment and stale-session controls
        run: node scripts/validate-performance-enrollment-security.mjs

      - name: Performance contract tests
        run: node --test performance/tests/*.test.mjs

      - name: Device acceptance static controls
        run: node scripts/validate-performance-device-acceptance.mjs

  android-acceptance:
    name: Android physical-acceptance APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install repository dependencies
        run: npm ci

      - name: Install pinned acceptance toolchain
        run: >-
          npm install --no-save --package-lock=false
          @capacitor/core@${CAPACITOR_VERSION}
          @capacitor/cli@${CAPACITOR_VERSION}
          @capacitor/android@${CAPACITOR_VERSION}
          @supabase/supabase-js@${SUPABASE_JS_VERSION}
          esbuild@${ESBUILD_VERSION}

      - name: Build isolated acceptance web bundle
        run: node scripts/build-performance-device-acceptance.mjs

      - name: Activate test-only Capacitor config
        run: cp capacitor.acceptance.config.json capacitor.config.json

      - name: Generate Android acceptance shell
        run: npx cap add android

      - name: Integrate controlled native plugins
        run: node scripts/prepare-performance-android-shell.mjs

      - name: Compile Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Android acceptance APK
        uses: actions/upload-artifact@v4
        with:
          name: paradise-performance-android-acceptance-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  ios-acceptance:
    name: iOS physical-acceptance project
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install repository dependencies
        run: npm ci

      - name: Install pinned acceptance toolchain
        run: >-
          npm install --no-save --package-lock=false
          @capacitor/core@${CAPACITOR_VERSION}
          @capacitor/cli@${CAPACITOR_VERSION}
          @capacitor/ios@${CAPACITOR_VERSION}
          @supabase/supabase-js@${SUPABASE_JS_VERSION}
          esbuild@${ESBUILD_VERSION}

      - name: Build isolated acceptance web bundle
        run: node scripts/build-performance-device-acceptance.mjs

      - name: Activate test-only Capacitor config
        run: cp capacitor.acceptance.config.json capacitor.config.json

      - name: Generate iOS acceptance SPM shell
        run: npx cap add ios --packagemanager SPM

      - name: Install Xcode project helper
        run: gem install xcodeproj --no-document

      - name: Integrate controlled native plugins
        run: ruby scripts/prepare-performance-ios-shell.rb

      - name: Resolve iOS packages
        run: xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App

      - name: Compile unsigned iOS Simulator acceptance shell
        run: >-
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/paradise-performance-acceptance-simulator
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Compile unsigned generic iPhone-device acceptance shell
        run: >-
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Debug
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath build/paradise-performance-acceptance-device
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Package generated Xcode acceptance project
        run: tar -czf paradise-performance-ios-acceptance-project.tar.gz ios/App

      - name: Upload iOS acceptance project
        uses: actions/upload-artifact@v4
        with:
          name: paradise-performance-ios-acceptance-project
          path: paradise-performance-ios-acceptance-project.tar.gz
          if-no-files-found: error
          retention-days: 7
