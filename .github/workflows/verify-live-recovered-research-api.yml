name: Verify live recovered research API

on:
  push:
    branches:
      - paradise-shows-public
      - deploy/recovered-2026-research-calendar-20260930
  pull_request:
    branches:
      - paradise-shows-public
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify live bootstrap v21 research payload
        shell: bash
        run: |
          curl --retry 4 --retry-delay 2 --retry-all-errors -fsS \
            -H 'Content-Type: application/json' \
            -X POST 'https://taxlrlfsobtnbasjcnuf.supabase.co/functions/v1/shows-api' \
            --data '{"action":"bootstrap"}' -o /tmp/bootstrap.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/bootstrap.json'))
          assert x.get('ok') is True, x
          assert x.get('version') == 21, x.get('version')
          research=x.get('researchCalendarControls') or []
          def sort_date(r):
              return str(r.get('event_start') or r.get('estimated_sort_date') or '')
          q4=[r for r in research if '2026-10-01' <= sort_date(r) < '2027-01-01']
          exact=[r for r in research if r.get('event_start')]
          estimated=[r for r in research if not r.get('event_start') and r.get('estimated_sort_date')]
          unsortable=[r for r in research if not r.get('event_start') and not r.get('estimated_sort_date')]
          semantic_bad=[
              r for r in research
              if str(r.get('date_confidence') or '').upper() in {'ESTIMATED','RECURRING_HIGH_CONFIDENCE'}
              and not (not r.get('event_start') and r.get('estimated_sort_date'))
          ]
          assert len(research) == 115, len(research)
          assert len(q4) == 115, len(q4)
          assert len(exact) == 113, len(exact)
          assert len(estimated) == 2, len(estimated)
          assert len(unsortable) == 0, unsortable
          assert not semantic_bad, semantic_bad
          assert all(isinstance(r.get('detail_data'),dict) for r in research), 'detail_data missing'
          assert all((r.get('detail_data') or {}).get('research_summary') for r in research), 'research_summary missing'
          assert all((r.get('detail_data') or {}).get('booking_status') for r in research), 'booking_status missing'
          assert all((r.get('detail_data') or {}).get('next_action') for r in research), 'next_action missing'
          assert all((r.get('detail_data') or {}).get('contact_text') for r in research), 'contact_text missing'
          assert all(str((r.get('detail_data') or {}).get('contact_status') or '').upper() != 'NOT VERIFIED' for r in research), 'contact_status still NOT VERIFIED'
          assert all(str((r.get('detail_data') or {}).get('contact_text') or '').strip().lower() != 'not verified' for r in research), 'contact_text still placeholder'
          def direct_channel(text):
              text=str(text or '')
              digits=''.join(ch for ch in text if ch.isdigit())
              return '@' in text or len(digits) >= 7
          assert all(direct_channel((r.get('detail_data') or {}).get('contact_text')) for r in research), 'research contact missing direct email/phone channel'
          contacts={r.get('event_label'):(r.get('detail_data') or {}).get('contact_text') for r in research}
          assert 'Vendors@BattleBrosEvents.com' in contacts.get('Florida Creatives Market — Port St. Lucie',''), contacts.get('Florida Creatives Market — Port St. Lucie')
          assert 'specialevents@cityofpsl.com' in contacts.get('Port St. Lucie Oktoberfest',''), contacts.get('Port St. Lucie Oktoberfest')
          assert 'sponsorships@cancommunityhealth.org' in contacts.get('World AIDS Day Concert',''), contacts.get('World AIDS Day Concert')
          assert 'jbrito@wellingtonfl.gov' in contacts.get('Wellington Holiday Parade',''), contacts.get('Wellington Holiday Parade')
          assert 'vendorfair@gpbsc.net' in contacts.get('Greater Palm Bay Senior Activity Center Vendor Fair',''), contacts.get('Greater Palm Bay Senior Activity Center Vendor Fair')
          assert 'info.fl11@bluestarmothers.us' in contacts.get("Freedom Isn’t Free Run 5K",''), contacts.get("Freedom Isn’t Free Run 5K")
          assert 'specialevents@cityofpsl.com' in contacts.get('Port St. Lucie International Fest',''), contacts.get('Port St. Lucie International Fest')
          assert len(x.get('shows') or []) == 37, len(x.get('shows') or [])
          assert len(x.get('calendarOpportunities') or []) >= 15, len(x.get('calendarOpportunities') or [])
          wanted={
            'Florida Creatives Market — Port St. Lucie',
            'Space Coast State Fair',
            'Turkey Bash',
            'Christmas on Las Olas',
            'Martin County Winter Fest',
            'NASA MAX POWER / Salute to America in Space',
            'Tradition Neighborhood Market',
          }
          names={r.get('event_label') for r in research}
          missing=wanted-names
          assert not missing, missing
          snow=next(r for r in research if r.get('event_label') == "There’s Snow Place Like Jupiter")
          assert snow.get('event_start') == '2026-12-12', snow
          assert snow.get('date_confidence') == 'CURRENT_VERIFIED', snow
          music=next(r for r in research if r.get('control_id') == 'R2026-101-MUSIC-MANSION')
          assert music.get('event_start') is None, music
          assert music.get('estimated_sort_date') == '2026-12-06', music
          assert music.get('date_confidence') == 'ESTIMATED', music
          hallandale=next(r for r in research if r.get('control_id') == 'R2026-088-HALLANDALE-HOLIDAY')
          assert hallandale.get('event_start') is None, hallandale
          assert hallandale.get('estimated_sort_date') == '2026-12-04', hallandale
          assert hallandale.get('date_confidence') == 'RECURRING_HIGH_CONFIDENCE', hallandale
          by_control={r.get('control_id'):r for r in research}
          expected_deadlines={
            'R2026-013-PUMPKINS-PALMS':'2026-10-01',
            'R2026-046-PALM-BAY-FALL-FEST':'2026-10-23',
            'R2026-061-GRACE-JERK':'2026-10-09',
            'R2026-063-SENIOR-HARDROCK':'2026-10-30',
            'R2026-073-PALM-BAY-FARMERS-NOV':'2026-11-05',
            'R2026-075-LIGHT-UP-DANIA':'2026-10-30',
            'R2026-100-WESTON-RUN':'2026-11-15',
            'R2026-107-PALM-BAY-HOLIDAY-MARKET':'2026-12-03',
          }
          for cid,deadline in expected_deadlines.items():
              assert by_control[cid].get('deadline_date') == deadline, (cid,by_control[cid])
          assert 'R2026-012-PALM-BAY-FARMERS-OCT' not in by_control, 'superseded Oct Palm Bay alias still visible'
          assert 'R2026-113-PALM-BAY-FARMERS-DEC' not in by_control, 'superseded Dec Palm Bay alias still visible'
          pumpkins=by_control['R2026-013-PUMPKINS-PALMS']
          assert pumpkins.get('event_label') == 'Palm Bay Farmers Market - Pumpkins & Palms', pumpkins
          assert pumpkins.get('series_key') == 'PALM-BAY-FARMERS-MARKET', pumpkins
          deadline_text=str((pumpkins.get('detail_data') or {}).get('deadline_text') or '')
          assert 'Oct. 1, 2026' in deadline_text and 'Oct. 10, 2026' in deadline_text, pumpkins
          homegrown=by_control['R2026-073-PALM-BAY-FARMERS-NOV']
          assert homegrown.get('event_label') == 'Palm Bay Farmers Market - Homegrown Harvest', homegrown
          assert homegrown.get('series_key') == 'PALM-BAY-FARMERS-MARKET', homegrown
          holiday=by_control['R2026-107-PALM-BAY-HOLIDAY-MARKET']
          assert holiday.get('series_key') == 'PALM-BAY-FARMERS-MARKET', holiday
          senior=by_control['R2026-063-SENIOR-HARDROCK']
          senior_detail=senior.get('detail_data') or {}
          assert senior.get('deadline_date') == '2026-10-30', senior
          assert senior.get('city') == 'Davie', senior
          assert senior.get('date_confidence') == 'CURRENT_VERIFIED', senior
          assert senior.get('research_status') == 'CURRENT_REVERIFIED', senior
          assert senior_detail.get('official_source_url') == 'https://seniorexpousa.com/expos/florida/fort-lauderdale-hollywood-fall-senior-expo-2026/', senior
          assert 'Evan@SeniorExpoUSA.com' in str(senior_detail.get('contact_text') or ''), senior
          assert 'SOLD OUT' not in str(senior_detail.get('booking_status') or '').upper(), senior
          assert 'RETIREMENT' not in str(senior_detail.get('source_label') or '').upper(), senior
          assert 'DREW' not in str(senior_detail.get('contact_text') or '').upper(), senior
          assert sum(bool(r.get('deadline_date')) for r in research) == 16, [r.get('control_id') for r in research if r.get('deadline_date')]
          source_pairs={}
          duplicate_pairs=[]
          for row in research:
              official=str((row.get('detail_data') or {}).get('official_source_url') or '').strip()
              if not official:
                  continue
              key=(official,str(row.get('event_start') or ''))
              if key in source_pairs:
                  duplicate_pairs.append((key,source_pairs[key],row.get('control_id')))
              else:
                  source_pairs[key]=row.get('control_id')
          assert not duplicate_pairs, duplicate_pairs
          wpb=by_control['R2026-092-WPB-BEER-WINE']
          assert wpb.get('deadline_date') is None, wpb
          assert (wpb.get('detail_data') or {}).get('deadline_text') == 'Not verified', wpb
          print({
            'version':x.get('version'),
            'research':len(research),
            'q4_orderable_research':len(q4),
            'exact_research':len(exact),
            'estimated_research':len(estimated),
            'unsortable_research':len(unsortable),
            'operating':len(x.get('shows') or []),
            'opportunities':len(x.get('calendarOpportunities') or []),
            'representative_controls':'PASS',
          })
          PY
