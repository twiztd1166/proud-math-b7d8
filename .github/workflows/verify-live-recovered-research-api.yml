name: Verify live recovered research API

on:
  push:
    branches:
      - paradise-shows-public
      - deploy/recovered-2026-research-calendar-20260930
  pull_request:
    branches:
      - paradise-shows-public
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify live bootstrap v21 research payload
        shell: bash
        run: |
          grep -Fq "const referenceActionCodes=['REVIEW','HOLD','MONITOR','REVERIFY'];" public/app-shows.js
          grep -Fq '<b>Action guard</b>' public/app-shows.js
          grep -Fq '${referenceButton}' public/app-shows.js
          curl --retry 4 --retry-delay 2 --retry-all-errors -fsS \
            -H 'Content-Type: application/json' \
            -X POST 'https://taxlrlfsobtnbasjcnuf.supabase.co/functions/v1/shows-api' \
            --data '{"action":"bootstrap"}' -o /tmp/bootstrap.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/bootstrap.json'))
          assert x.get('ok') is True, x
          assert x.get('version') == 21, x.get('version')
          research=x.get('researchCalendarControls') or []
          def sort_date(r):
              return str(r.get('event_start') or r.get('estimated_sort_date') or '')
          q4=[r for r in research if '2026-10-01' <= sort_date(r) < '2027-01-01']
          exact=[r for r in research if r.get('event_start')]
          estimated=[r for r in research if not r.get('event_start') and r.get('estimated_sort_date')]
          unsortable=[r for r in research if not r.get('event_start') and not r.get('estimated_sort_date')]
          semantic_bad=[
              r for r in research
              if str(r.get('date_confidence') or '').upper() in {'ESTIMATED','RECURRING_HIGH_CONFIDENCE'}
              and not (not r.get('event_start') and r.get('estimated_sort_date'))
          ]
          assert len(research) == 115, len(research)
          assert len(q4) == 115, len(q4)
          assert len(exact) == 114, len(exact)
          assert len(estimated) == 1, len(estimated)
          assert len(unsortable) == 0, unsortable
          assert not semantic_bad, semantic_bad
          assert all(isinstance(r.get('detail_data'),dict) for r in research), 'detail_data missing'
          assert all((r.get('detail_data') or {}).get('research_summary') for r in research), 'research_summary missing'
          assert all((r.get('detail_data') or {}).get('booking_status') for r in research), 'booking_status missing'
          assert all((r.get('detail_data') or {}).get('next_action') for r in research), 'next_action missing'
          assert all((r.get('detail_data') or {}).get('contact_text') for r in research), 'contact_text missing'
          assert all(str((r.get('detail_data') or {}).get('contact_status') or '').upper() != 'NOT VERIFIED' for r in research), 'contact_status still NOT VERIFIED'
          assert all(str((r.get('detail_data') or {}).get('contact_text') or '').strip().lower() != 'not verified' for r in research), 'contact_text still placeholder'
          def direct_channel(text):
              text=str(text or '')
              digits=''.join(ch for ch in text if ch.isdigit())
              return '@' in text or len(digits) >= 7
          assert all(direct_channel((r.get('detail_data') or {}).get('contact_text')) for r in research), 'research contact missing direct email/phone channel'
          contacts={r.get('event_label'):(r.get('detail_data') or {}).get('contact_text') for r in research}
          assert 'Vendors@BattleBrosEvents.com' in contacts.get('Florida Creatives Market — Port St. Lucie',''), contacts.get('Florida Creatives Market — Port St. Lucie')
          assert 'specialevents@cityofpsl.com' in contacts.get('Port St. Lucie Oktoberfest',''), contacts.get('Port St. Lucie Oktoberfest')
          assert 'sponsorships@cancommunityhealth.org' in contacts.get('World AIDS Day Concert',''), contacts.get('World AIDS Day Concert')
          assert 'jbrito@wellingtonfl.gov' in contacts.get('Wellington Holiday Parade',''), contacts.get('Wellington Holiday Parade')
          assert 'vendorfair@gpbsc.net' in contacts.get('Greater Palm Bay Senior Activity Center Vendor Fair',''), contacts.get('Greater Palm Bay Senior Activity Center Vendor Fair')
          assert 'info.fl11@bluestarmothers.us' in contacts.get("Freedom Isn’t Free Run 5K",''), contacts.get("Freedom Isn’t Free Run 5K")
          assert 'specialevents@cityofpsl.com' in contacts.get('Port St. Lucie International Fest',''), contacts.get('Port St. Lucie International Fest')
          assert len(x.get('shows') or []) == 37, len(x.get('shows') or [])
          assert len(x.get('calendarOpportunities') or []) >= 15, len(x.get('calendarOpportunities') or [])
          wanted={
            'Florida Creatives Market — Port St. Lucie',
            'Space Coast State Fair',
            'Turkey Bash',
            'Christmas on Las Olas',
            'Martin County Winter Fest',
            'NASA MAX POWER / Salute to America in Space',
            'Tradition Neighborhood Market',
          }
          names={r.get('event_label') for r in research}
          missing=wanted-names
          assert not missing, missing
          snow=next(r for r in research if r.get('event_label') == "There’s Snow Place Like Jupiter")
          assert snow.get('event_start') == '2026-12-12', snow
          assert snow.get('date_confidence') == 'CURRENT_VERIFIED', snow
          music=next(r for r in research if r.get('control_id') == 'R2026-101-MUSIC-MANSION')
          assert music.get('event_start') is None, music
          assert music.get('estimated_sort_date') == '2026-12-06', music
          assert music.get('date_confidence') == 'ESTIMATED', music
          hallandale=next(r for r in research if r.get('control_id') == 'R2026-088-HALLANDALE-HOLIDAY')
          assert hallandale.get('event_start') == '2026-12-04', hallandale
          assert hallandale.get('estimated_sort_date') is None, hallandale
          assert hallandale.get('date_confidence') == 'CURRENT_VERIFIED', hallandale
          by_control={r.get('control_id'):r for r in research}
          expected_deadlines={
            'R2026-068-FREEDOM-5K':'2026-09-15',
            'R2026-004-FLORIDA-CREATIVES-PSL':'2026-09-30',
            'R2026-013-PUMPKINS-PALMS':'2026-10-01',
            'R2026-043-BOYNTON-PIRATE':'2026-10-01',
            'R2026-006-GACTC-OKTOBERFEST':'2026-10-08',
            'R2026-019-SFL-PICKLE':'2026-10-09',
            'R2026-061-GRACE-JERK':'2026-10-09',
            'R2026-033-MOOSE-MELBOURNE':'2026-10-17',
            'R2026-045-HALLANDALE-HALLOWEEN':'2026-10-22',
            'R2026-046-PALM-BAY-FALL-FEST':'2026-10-23',
            'R2026-063-SENIOR-HARDROCK':'2026-10-30',
            'R2026-075-LIGHT-UP-DANIA':'2026-10-30',
            'R2026-060-TEQUILA-FEST':'2026-10-31',
            'R2026-083-WORLD-AIDS':'2026-11-01',
            'R2026-073-PALM-BAY-FARMERS-NOV':'2026-11-05',
            'R2026-100-WESTON-RUN':'2026-11-15',
            'R2026-088-HALLANDALE-HOLIDAY':'2026-11-19',
            'R2026-090-SPACE-COAST-HOLIDAY-FOOD':'2026-12-01',
            'R2026-107-PALM-BAY-HOLIDAY-MARKET':'2026-12-03',
            'R2026-105-TC-HOLIDAY-FOOD':'2026-12-04',
          }
          for cid,deadline in expected_deadlines.items():
              assert by_control[cid].get('deadline_date') == deadline, (cid,by_control[cid])
          assert 'R2026-012-PALM-BAY-FARMERS-OCT' not in by_control, 'superseded Oct Palm Bay alias still visible'
          assert 'R2026-113-PALM-BAY-FARMERS-DEC' not in by_control, 'superseded Dec Palm Bay alias still visible'
          pumpkins=by_control['R2026-013-PUMPKINS-PALMS']
          assert pumpkins.get('event_label') == 'Palm Bay Farmers Market - Pumpkins & Palms', pumpkins
          assert pumpkins.get('series_key') == 'PALM-BAY-FARMERS-MARKET', pumpkins
          pumpkins_detail=pumpkins.get('detail_data') or {}
          deadline_text=str(pumpkins_detail.get('deadline_text') or '')
          assert 'Oct. 1, 2026' in deadline_text and 'passed' in deadline_text.lower(), pumpkins
          assert pumpkins_detail.get('operational_action_code') == 'EMAIL_DRAFT', pumpkins
          assert 'APPLICATION DEADLINE PASSED' in str(pumpkins_detail.get('booking_status') or '').upper(), pumpkins
          assert 'late availability' in str(pumpkins_detail.get('next_action') or '').lower(), pumpkins

          q4_apply_missing_url=[
              r.get('control_id') for r in q4
              if (r.get('detail_data') or {}).get('operational_action_code') == 'APPLY'
              and not str((r.get('detail_data') or {}).get('action_url') or '').strip()
          ]
          q4_inquiry_missing_url=[
              r.get('control_id') for r in q4
              if (r.get('detail_data') or {}).get('operational_action_code') == 'OPEN_INQUIRY'
              and not str((r.get('detail_data') or {}).get('action_url') or '').strip()
          ]
          compound_codes={'EMAIL_THEN_APPLY','CALL_THEN_APPLY'}
          q4_compound=[
              r.get('control_id') for r in q4
              if (r.get('detail_data') or {}).get('operational_action_code') in compound_codes
          ]
          q4_compound_missing_url=[
              r.get('control_id') for r in q4
              if (r.get('detail_data') or {}).get('operational_action_code') in compound_codes
              and not str((r.get('detail_data') or {}).get('action_url') or '').strip()
          ]
          stale_generic_direct_labels=[
              r.get('control_id') for r in q4
              if (r.get('detail_data') or {}).get('operational_action_code') in {'APPLY','OPEN_INQUIRY'}
              and str((r.get('detail_data') or {}).get('action_label') or '').strip() in {'Open recovered research source','Open official source'}
          ]
          assert not q4_apply_missing_url, q4_apply_missing_url
          assert not q4_inquiry_missing_url, q4_inquiry_missing_url
          assert not q4_compound_missing_url, q4_compound_missing_url
          assert not stale_generic_direct_labels, stale_generic_direct_labels
          assert set(q4_compound) == {
              'R2026-002-CORAL-SPRINGS-OKTOBERFEST',
              'R2026-003-PSL-OKTOBERFEST',
              'R2026-037-WEST-BOYNTON-SENIOR',
              'R2026-040-VERO-DOWNTOWN-FRIDAY',
              'R2026-057-NORTH-MIAMI-HEALTH',
              'R2026-062-SENIOR-DELRAY',
              'R2026-077-SENIOR-POMPANO',
          }, q4_compound
          inquiry_expectations={
              'R2026-007-MARTIN-FALL-FEST':'https://www.cognitoforms.com/MartinCountyBoardOfCountyCommissioners/SpecialEventSponsorshipPackages',
              'R2026-017-CARS-COFFEE-OCT':'https://www.carsandcoffeepb.com/sponsors',
              'R2026-024-POMPANO-CARIBBEAN':'https://parks.pompanobeachfl.gov/form/parks-rec-event-sponsorship-interest-form',
              'R2026-023-WELLINGTON-FALL':'https://www.wellingtonfl.gov/FormCenter/Parks-Recreation-7/Sponsor-Vendor-Interest-Form-74',
              'R2026-038-FLIBS':'https://app.smartsheet.com/b/form/0197132e30c374e8980a0fcea4e2200e',
              'R2026-058-MIAMI-FOOD-WINE':'https://miamidadefoodwine.com/sponsors',
              'R2026-103-MARTIN-WINTER-FEST':'https://www.cognitoforms.com/MartinCountyBoardOfCountyCommissioners/SpecialEventSponsorshipPackages',
              'R2026-106-WELLINGTON-BOAT':'https://www.wellingtonfl.gov/FormCenter/Parks-Recreation-7/Sponsor-Vendor-Interest-Form-74',
              'R2026-068-FREEDOM-5K':'https://runsignup.com/Race/FreedomIsnTFreeRun5KSPONSORSHIP/Page/ContactUs',
          }
          assert sum(
              1 for r in q4
              if (r.get('detail_data') or {}).get('operational_action_code') == 'OPEN_INQUIRY'
          ) == len(inquiry_expectations), [
              r.get('control_id') for r in q4
              if (r.get('detail_data') or {}).get('operational_action_code') == 'OPEN_INQUIRY'
          ]
          for cid,url in inquiry_expectations.items():
              detail=by_control[cid].get('detail_data') or {}
              assert detail.get('operational_action_code') == 'OPEN_INQUIRY', (cid,detail)
              assert detail.get('action_url') == url, (cid,detail)
              expected_route_date='2026-10-02' if cid in {'R2026-017-CARS-COFFEE-OCT','R2026-068-FREEDOM-5K'} else '2026-10-01'
              assert detail.get('route_verified_at') == expected_route_date, (cid,detail)
          email_route_ids={
              'R2026-025-BOYNTON-FALL',
              'R2026-042-LAGOONFEST',
              'R2026-049-CARS-COFFEE-NOV',
              'R2026-053-DREAM-ASIA',
              'R2026-052-NASCAR-HOMESTEAD',
              'R2026-054-CARIFEST',
              'R2026-056-BARK-TITUSVILLE',
              'R2026-095-HOWARD-ALAN-DELRAY',
              'R2026-099-CARS-COFFEE-DEC',
          }
          for cid in email_route_ids:
              detail=by_control[cid].get('detail_data') or {}
              assert detail.get('operational_action_code') == 'EMAIL_DRAFT', (cid,detail)
              assert detail.get('route_verified_at') == '2026-10-01', (cid,detail)
          route_verified={
              r.get('control_id') for r in q4
              if str((r.get('detail_data') or {}).get('route_verified_at') or '').strip()
          }
          assert len(route_verified) >= 67, route_verified
          hallandale_halloween=by_control['R2026-045-HALLANDALE-HALLOWEEN']
          hallandale_detail=hallandale_halloween.get('detail_data') or {}
          assert hallandale_halloween.get('deadline_date') == '2026-10-22', hallandale_halloween
          assert hallandale_detail.get('action_url') == 'https://hallandalebeachfl.gov/DocumentCenter/View/38248/2026-Halloween-Sponsor-Application-blank-Fillable', hallandale_halloween
          bark=by_control['R2026-056-BARK-TITUSVILLE']
          bark_detail=bark.get('detail_data') or {}
          assert 'VENDOR APPLICATION CLOSED' in str(bark_detail.get('booking_status') or '').upper(), bark
          assert 'SPONSORSHIP ROUTE CURRENT' in str(bark_detail.get('booking_status') or '').upper(), bark
          assert 'ALTERNATE ROUTE ONLY' in str(bark_detail.get('booking_status') or '').upper(), bark
          assert 'spcasunni@gmail.com' in str(bark_detail.get('contact_text') or '').lower(), bark
          assert by_control['R2026-064-PSL-RIVER-NIGHTS-NOV'].get('detail_data',{}).get('action_url') == 'https://form.jotform.com/pslcommunications/special-events-vendor-application'
          assert by_control['R2026-079-TURKEY-BASH'].get('detail_data',{}).get('action_url') == 'https://www.eventeny.com/events/sponsor/application/?a=htpjbnnv-25752'
          assert by_control['R2026-082-RUM-FUZION'].get('detail_data',{}).get('action_url') == 'https://rumfuzion.com/#vendors'
          direct_label_expectations={
              'R2026-006-GACTC-OKTOBERFEST':('https://www.eventeny.com/events/vendor/?id=53541','Open business-services application'),
              'R2026-009-SABOR-FEST':('https://www.miamilakes-fl.gov/sabor-fest-2026-vendor-registration-form/','Open vendor registration form'),
              'R2026-022-JUPITER-SPOOKTACULAR':('https://www.jupiter.fl.us/FormCenter/Town-Manager-7/Town-of-Jupiter-Sponsorship-Agreement-20-570','Open 2026 sponsorship agreement'),
              'R2026-026-PLANTATION-FALL':('https://www.plantation.org/home/showpublisheddocument/8294/639223202279400000','Open Family Fall Festival application'),
              'R2026-029-RPB-ROCK-N-FALL':('https://pci.jotform.com/form/261183235018148','Open vendor application'),
              'R2026-031-MALABAR-FALLFEST':('https://www.townofmalabar.org/DocumentCenter/View/3591/Vendor-Participant-Sign-Up-Form-2026','Open vendor participant sign-up'),
              'R2026-084-CHRISTMAS-LAS-OLAS':('https://www.lasolasboulevard.com/christmas-on-las-olas-application','Open business booth application'),
              'R2026-090-SPACE-COAST-HOLIDAY-FOOD':('https://www.eventeny.com/events/vendor/?id=51168','Open sponsor application'),
              'R2026-100-WESTON-RUN':('https://form.jotform.com/241377280948163','Open sponsorship / booth application'),
              'R2026-105-TC-HOLIDAY-FOOD':('https://www.eventeny.com/events/vendor/?id=51173','Open sponsor application'),
              'R2026-110-COCOA-ROCKLEDGE-PARADE':('https://flbrevardweb.myvscloud.com/webtrac/web/search.html?display=detail&module=global&type=SPEVT','Open commercial parade registration'),
              'R2026-115-SNOW-PLACE-JUPITER':('https://www.jupiter.fl.us/FormCenter/Town-Manager-7/Town-of-Jupiter-Sponsorship-Agreement-20-570','Open 2026 sponsorship agreement'),
          }
          for cid,(url,label) in direct_label_expectations.items():
              detail=by_control[cid].get('detail_data') or {}
              assert detail.get('operational_action_code') == 'APPLY', (cid,detail)
              assert detail.get('action_url') == url, (cid,detail)
              assert detail.get('action_label') == label, (cid,detail)
              expected_route_source='2026_NEXT14_REVERIFICATION' if cid == 'R2026-009-SABOR-FEST' else '2026_Q4_DIRECT_ACTION_LABEL_CLEANUP'
              assert detail.get('route_verification_source') == expected_route_source, (cid,detail)
          do_now_reverified={
              'R2026-001-NMB-CENTENNIAL',
              'R2026-002-CORAL-SPRINGS-OKTOBERFEST',
              'R2026-003-PSL-OKTOBERFEST',
              'R2026-005-GIPA-OKTOBERFEST',
              'R2026-117-TRADITION-NEIGHBORHOOD',
          }
          for cid in do_now_reverified:
              detail=by_control[cid].get('detail_data') or {}
              assert detail.get('current_source_checked_at') == '2026-10-02', (cid,detail)
              assert detail.get('followup_reverified_at') == '2026-10-02', (cid,detail)
              assert detail.get('followup_reverification_source') == '2026_DO_NOW_REVERIFICATION', (cid,detail)

          gipa_detail=by_control['R2026-005-GIPA-OKTOBERFEST'].get('detail_data') or {}
          assert gipa_detail.get('operational_action_code') == 'EMAIL_DRAFT', gipa_detail
          assert not gipa_detail.get('action_url'), gipa_detail
          assert 'FORM INACTIVE' in str(gipa_detail.get('booking_status') or '').upper(), gipa_detail
          assert 'info@gipa.org' in str(gipa_detail.get('contact_text') or '').lower(), gipa_detail

          coral_detail=by_control['R2026-002-CORAL-SPRINGS-OKTOBERFEST'].get('detail_data') or {}
          assert coral_detail.get('operational_action_code') == 'EMAIL_THEN_APPLY', coral_detail
          assert coral_detail.get('action_url') == 'https://forms.coralsprings.gov/241194820975968', coral_detail
          assert coral_detail.get('action_label') == 'Open Oktoberfest vendor application', coral_detail
          assert 'OKTOBERFEST' in str(coral_detail.get('booking_status') or '').upper(), coral_detail
          assert 'SERVICE-BUSINESS FIT' in str(coral_detail.get('booking_status') or '').upper(), coral_detail

          psl_detail=by_control['R2026-003-PSL-OKTOBERFEST'].get('detail_data') or {}
          assert psl_detail.get('operational_action_code') == 'EMAIL_THEN_APPLY', psl_detail
          assert psl_detail.get('action_url') == 'https://form.jotform.com/pslcommunications/special-events-vendor-application', psl_detail
          assert psl_detail.get('action_label') == 'Open City craft/vendor application', psl_detail
          assert psl_detail.get('route_verified_at') == '2026-10-02', psl_detail
          assert psl_detail.get('route_verification_source') == '2026_DO_NOW_PSL_VENDOR_ROUTE_REVERIFICATION', psl_detail
          assert 'GENERAL BUSINESS & COMMERCIAL VENDOR FORM ACTIVE' in str(psl_detail.get('booking_status') or '').upper(), psl_detail
          assert 'OKTOBERFEST-SPECIFIC AVAILABILITY NOT PUBLISHED' in str(psl_detail.get('booking_status') or '').upper(), psl_detail

          nmb_detail=by_control['R2026-001-NMB-CENTENNIAL'].get('detail_data') or {}
          assert nmb_detail.get('operational_action_code') == 'EMAIL_DRAFT', nmb_detail
          assert 'communications@citynmb.com' in str(nmb_detail.get('contact_text') or '').lower(), nmb_detail

          tradition_detail=by_control['R2026-117-TRADITION-NEIGHBORHOOD'].get('detail_data') or {}
          assert tradition_detail.get('operational_action_code') == 'EMAIL_DRAFT', tradition_detail
          assert tradition_detail.get('schedule_status') == 'CURRENT VERIFIED', tradition_detail
          assert 'traditionmarket@hotmail.com' in str(tradition_detail.get('contact_text') or '').lower(), tradition_detail

          late_inventory_reverified={
              'R2026-004-FLORIDA-CREATIVES-PSL',
              'R2026-010-FALL-DOWNTOWN-MELBOURNE',
              'R2026-013-PUMPKINS-PALMS',
              'R2026-043-BOYNTON-PIRATE',
              'R2026-065-NATIVE-RHYTHMS',
              'R2026-068-FREEDOM-5K',
          }
          for cid in late_inventory_reverified:
              detail=by_control[cid].get('detail_data') or {}
              assert detail.get('current_source_checked_at') == '2026-10-02', (cid,detail)
              assert detail.get('followup_reverified_at') == '2026-10-02', (cid,detail)
              assert detail.get('followup_reverification_source') == '2026_LATE_INVENTORY_REVERIFICATION', (cid,detail)
              assert detail.get('route_verified_at') == '2026-10-02', (cid,detail)
              assert detail.get('route_verification_source') == '2026_LATE_INVENTORY_REVERIFICATION', (cid,detail)

          florida_creatives=by_control['R2026-004-FLORIDA-CREATIVES-PSL'].get('detail_data') or {}
          assert florida_creatives.get('operational_action_code') == 'EMAIL_DRAFT', florida_creatives
          assert 'DEADLINE PASSED' in str(florida_creatives.get('booking_status') or '').upper(), florida_creatives
          assert 'Vendors@BattleBrosEvents.com'.lower() in str(florida_creatives.get('contact_text') or '').lower(), florida_creatives

          pumpkins_detail=by_control['R2026-013-PUMPKINS-PALMS'].get('detail_data') or {}
          assert pumpkins_detail.get('operational_action_code') == 'EMAIL_DRAFT', pumpkins_detail
          assert '$60' in str(pumpkins_detail.get('current_cost_text') or ''), pumpkins_detail
          assert '$25' in str(pumpkins_detail.get('current_cost_text') or ''), pumpkins_detail
          assert 'palmbayfarmersmarket@gmail.com' in str(pumpkins_detail.get('contact_text') or '').lower(), pumpkins_detail

          downtown_fall=by_control['R2026-010-FALL-DOWNTOWN-MELBOURNE'].get('detail_data') or {}
          assert downtown_fall.get('operational_action_code') == 'EMAIL_DRAFT', downtown_fall
          assert 'INTEREST FORM CLOSED' in str(downtown_fall.get('booking_status') or '').upper(), downtown_fall
          assert 'events@downtownmelbourne.com' in str(downtown_fall.get('contact_text') or '').lower(), downtown_fall

          boynton_pirate=by_control['R2026-043-BOYNTON-PIRATE'].get('detail_data') or {}
          assert boynton_pirate.get('operational_action_code') == 'EMAIL_DRAFT', boynton_pirate
