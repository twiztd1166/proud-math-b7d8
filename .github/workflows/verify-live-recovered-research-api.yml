name: Verify live recovered research API

on:
  push:
    branches:
      - paradise-shows-public
      - deploy/recovered-2026-research-calendar-20260930
  pull_request:
    branches:
      - paradise-shows-public
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify live bootstrap v21 research payload
        shell: bash
        run: |
          grep -Fq "const referenceActionCodes=['REVIEW','HOLD','MONITOR','REVERIFY'];" public/app-shows.js
          grep -Fq '<b>Action guard</b>' public/app-shows.js
          grep -Fq '${referenceButton}' public/app-shows.js
