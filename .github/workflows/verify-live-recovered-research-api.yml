              'R2026-022-JUPITER-SPOOKTACULAR':('https://www.jupiter.fl.us/FormCenter/Town-Manager-7/Town-of-Jupiter-Sponsorship-Agreement-20-570','Open 2026 sponsorship agreement'),
              'R2026-026-PLANTATION-FALL':('https://www.plantation.org/home/showpublisheddocument/8294/639223202279400000','Open Family Fall Festival application'),
              'R2026-029-RPB-ROCK-N-FALL':('https://pci.jotform.com/form/261183235018148','Open vendor application'),
              'R2026-031-MALABAR-FALLFEST':('https://www.townofmalabar.org/DocumentCenter/View/3591/Vendor-Participant-Sign-Up-Form-2026','Open vendor participant sign-up'),
              'R2026-084-CHRISTMAS-LAS-OLAS':('https://www.lasolasboulevard.com/christmas-on-las-olas-application','Open business booth application'),
              'R2026-090-SPACE-COAST-HOLIDAY-FOOD':('https://www.eventeny.com/events/vendor/?id=51168','Open sponsor application'),
              'R2026-100-WESTON-RUN':('https://form.jotform.com/241377280948163','Open sponsorship / booth application'),
              'R2026-105-TC-HOLIDAY-FOOD':('https://www.eventeny.com/events/vendor/?id=51173','Open sponsor application'),
              'R2026-110-COCOA-ROCKLEDGE-PARADE':('https://flbrevardweb.myvscloud.com/webtrac/web/search.html?display=detail&module=global&type=SPEVT','Open commercial parade registration'),
