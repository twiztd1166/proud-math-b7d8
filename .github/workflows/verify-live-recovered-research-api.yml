              detail=by_control[cid].get('detail_data') or {}
              assert detail.get('operational_action_code') == 'OPEN_INQUIRY', (cid,detail)
              assert detail.get('action_url') == url, (cid,detail)
              assert detail.get('route_verified_at') == '2026-10-01', (cid,detail)
          email_route_ids={
              'R2026-025-BOYNTON-FALL',
              'R2026-042-LAGOONFEST',
              'R2026-049-CARS-COFFEE-NOV',
              'R2026-053-DREAM-ASIA',
              'R2026-052-NASCAR-HOMESTEAD',
              'R2026-054-CARIFEST',
              'R2026-056-BARK-TITUSVILLE',
              'R2026-095-HOWARD-ALAN-DELRAY',
              'R2026-099-CARS-COFFEE-DEC',
          }
          for cid in email_route_ids:
              detail=by_control[cid].get('detail_data') or {}
              assert detail.get('operational_action_code') == 'EMAIL_DRAFT', (cid,detail)
              assert detail.get('route_verified_at') == '2026-10-01', (cid,detail)
          route_verified={
              r.get('control_id') for r in q4
              if (r.get('detail_data') or {}).get('route_verified_at') == '2026-10-01'
          }
          direct_action_cleanup={
              r.get('control_id') for r in q4
              if (r.get('detail_data') or {}).get('route_verification_source') == '2026_Q4_DIRECT_ACTION_LABEL_CLEANUP'
          }
          assert len(route_verified) == 47, route_verified
          assert len(direct_action_cleanup) == 16, direct_action_cleanup
          hallandale_halloween=by_control['R2026-045-HALLANDALE-HALLOWEEN']
          hallandale_detail=hallandale_halloween.get('detail_data') or {}
          assert hallandale_halloween.get('deadline_date') == '2026-10-22', hallandale_halloween
          assert hallandale_detail.get('action_url') == 'https://hallandalebeachfl.gov/DocumentCenter/View/38248/2026-Halloween-Sponsor-Application-blank-Fillable', hallandale_halloween
          bark=by_control['R2026-056-BARK-TITUSVILLE']
          bark_detail=bark.get('detail_data') or {}
          assert 'VENDOR APPLICATION CLOSED' in str(bark_detail.get('booking_status') or '').upper(), bark
          assert 'SPONSORSHIP ROUTE CURRENT' in str(bark_detail.get('booking_status') or '').upper(), bark
          assert 'ALTERNATE ROUTE ONLY' in str(bark_detail.get('booking_status') or '').upper(), bark
          assert 'spcasunni@gmail.com' in str(bark_detail.get('contact_text') or '').lower(), bark
          assert by_control['R2026-064-PSL-RIVER-NIGHTS-NOV'].get('detail_data',{}).get('action_url') == 'https://form.jotform.com/pslcommunications/special-events-vendor-application'
          assert by_control['R2026-079-TURKEY-BASH'].get('detail_data',{}).get('action_url') == 'https://www.eventeny.com/events/sponsor/application/?a=htpjbnnv-25752'
          assert by_control['R2026-082-RUM-FUZION'].get('detail_data',{}).get('action_url') == 'https://rumfuzion.com/#vendors'
          direct_label_expectations={
