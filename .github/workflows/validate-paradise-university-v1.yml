name: Validate Paradise University v1
on:
  push:
    branches: [agent/paradise-university-v1]
concurrency:
  group: paradise-university-v1-validation
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax and controlled-data boundary
        shell: bash
        run: |
          node --check training-content-v1.js
          node --check training-content-sourcefix-v1.js
          node --check training-v1.js
          node --check training-player-v1.js
          node --check boot-v2.js
          node --check core-v2.js
          node --check lookup-v2.js
          node --check sw.js
          node --check scripts/build-canvass-site.mjs
          node --check tests/training-smoke.spec.js
          node --check tests/offline-regression.spec.js
          grep -q "datasetSha256:'a98b8badf4c3df616fb091eb32ff85f70682f226e4fcd55591f3784b37abe200'" provenance-v3-2.js
          grep -q 'records.length!==78' boot-v2.js
          grep -q 'db.meta.goCount!==76' boot-v2.js
          grep -q 'db.meta.noGoCount!==2' boot-v2.js
          grep -q 'training-content-v1.js' index.html
          grep -q 'training-content-sourcefix-v1.js' index.html
          grep -q 'training-v1.js' index.html
          grep -q 'training-v1.css' index.html
          grep -q 'training-player-v1.js' index.html
          grep -q 'training-player-v1.css' index.html
          grep -q 'training-content-sourcefix-v1.js' sw.js
          grep -q 'pcm-field-v3-12-pu-v1-content3-2026-08-16' sw.js
          grep -q '2026.08.16-pu-v1-content-3' training-content-sourcefix-v1.js
          grep -q '2026.08.16-pu-player-v1' training-player-v1.js
          grep -q 'playbackRate' training-player-v1.js
          grep -q 'seekbackward' training-player-v1.js
          grep -q 'puMediaResume' training-player-v1.js
          grep -q 'Do not claim you are handing out notices where the live municipality screen says not to use them' training-content-v1.js
          grep -q '1WNQ6ItT6Ar_HXGKNutWEvEFeHm14RjKn' training-content-v1.js
          grep -q '1GCrveqXP0xgc8n2S9WPlVAd9wd9D2X5Y' training-content-v1.js
          grep -q '1UoiQtvSx-85qJ4sbC2AegpEFF8ZRqGfC' training-content-sourcefix-v1.js
          grep -q '1Z8wIrTrULa1g3In7_ucINtNZTV0eWczk' training-content-sourcefix-v1.js
          grep -q '12hnKxDUE0nOO5kv_FuBb9fahiFGX4wty' training-content-sourcefix-v1.js
          grep -q '1TKWzlPeTf7gxJ-M5gn9_PsEAUxg7QpPD' training-content-sourcefix-v1.js
          grep -q '1fb4c-L2vJQF9isWRyoUDtPd76rvVr9fh' training-content-sourcefix-v1.js
          grep -q '1Au1PhatdFIG84Azy8LiNXh0QLnjLSuIs' training-content-sourcefix-v1.js
          grep -q '100B1iq77BW00sH4HYMO6zPl80ctMsaam' training-content-sourcefix-v1.js
          grep -q 'SALES TRAINING IS NOT AUTHORIZATION TO SELL AT THE DOOR' training-content-sourcefix-v1.js
          if grep -q '19CvExmu1fCyaq3SpLprsn8TVIQq-Bzt0' training-content-sourcefix-v1.js; then echo 'Unverified Tony media ID reintroduced'; exit 1; fi
      - name: Validate training content model
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const ctx={window:{}};vm.createContext(ctx);
          vm.runInContext(fs.readFileSync('training-content-v1.js','utf8'),ctx);
          vm.runInContext(fs.readFileSync('training-content-sourcefix-v1.js','utf8'),ctx);
          const u=ctx.window.PU_CONTENT;
          if(!u||!Array.isArray(u.lessons)||!Array.isArray(u.media)||!Array.isArray(u.drills))throw new Error('Training content model missing');
          if(u.version!=='2026.08.16-pu-v1-content-3')throw new Error(`Unexpected training version ${u.version}`);
          const minimum={foundation:4,'field-ready':7,canvasser:9,senior:6,'sales-apprentice':11};
          for(const [stage,min] of Object.entries(minimum)){const n=u.lessons.filter(x=>x.stage===stage).length;if(n<min)throw new Error(`Insufficient ${stage} curriculum: ${n}/${min}`)}
          if(u.media.length<12)throw new Error('Curated media catalog too small');
          if(!u.lessons.some(x=>/Certified Canvasser Readiness/i.test(x.title)))throw new Error('Certification readiness lesson missing');
          if(!u.lessons.some(x=>x.id==='senior-sales-readiness'))throw new Error('Senior sales-readiness lesson missing');
          if(!u.lessons.some(x=>x.id==='sales-process-map'))throw new Error('Sales process map missing');
          if(!u.lessons.some(x=>x.id==='sales-shadowing'))throw new Error('Sales shadowing lesson missing');
          if(!u.drills.some(x=>x.id==='leave-property'&&/stop immediately and leave/i.test(x.answer)))throw new Error('Clear-refusal drill missing');
          const ids=new Set(u.media.map(x=>x.id));
          for(const lesson of u.lessons)for(const id of lesson.media||[])if(!ids.has(id))throw new Error(`Unknown media ${id} in ${lesson.id}`);
          const urls=u.media.map(x=>x.url);
          for(const id of ['1UoiQtvSx-85qJ4sbC2AegpEFF8ZRqGfC','1Z8wIrTrULa1g3In7_ucINtNZTV0eWczk','12hnKxDUE0nOO5kv_FuBb9fahiFGX4wty','1TKWzlPeTf7gxJ-M5gn9_PsEAUxg7QpPD','1fb4c-L2vJQF9isWRyoUDtPd76rvVr9fh'])if(!urls.some(x=>x.includes(id)))throw new Error(`Verified Tony media missing ${id}`);
          if(!u.sources?.daveFive?.url?.includes('1Au1PhatdFIG84Azy8LiNXh0QLnjLSuIs'))throw new Error('Exact Dave Five Commitments source missing');
          if(!u.sources?.grossoExpanded?.url?.includes('100B1iq77BW00sH4HYMO6zPl80ctMsaam'))throw new Error('Exact Grosso Expanded source missing');
          const five=u.lessons.find(x=>x.id==='canvass-five-commitments');
          if(!five?.sources?.includes('daveFive'))throw new Error('Five Commitments lesson not linked to exact source');
          const apprentice=u.lessons.filter(x=>x.stage==='sales-apprentice').map(x=>`${x.title} ${x.learn} ${x.pass}`).join(' ');
          if(!/not authorization to sell at the door/i.test(apprentice))throw new Error('Sales Apprentice doorstep boundary missing');
          console.log({version:u.version,lessons:u.lessons.length,media:u.media.length,drills:u.drills.length,stages:Object.fromEntries(Object.keys(minimum).map(s=>[s,u.lessons.filter(x=>x.stage===s).length]))});
          NODE
      - name: Recompute controlled dataset hash
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),vm=require('vm');
          const src=fs.readFileSync('plain-data.js','utf8');
          const ctx={window:{}};vm.createContext(ctx);vm.runInContext(src,ctx);
          const obj=ctx.window.PCM_DATA;
          if(!obj||!Array.isArray(obj.records))throw new Error('PCM data missing');
          const hash=crypto.createHash('sha256').update(JSON.stringify(obj)).digest('hex');
          const expected='a98b8badf4c3df616fb091eb32ff85f70682f226e4fcd55591f3784b37abe200';
          const go=obj.records.filter(r=>r.release==='GO').length;
          const noGo=obj.records.filter(r=>r.release==='NO-GO').length;
          const stops=obj.records.filter(r=>r.release==='NO-GO').map(r=>r.name).sort();
          if(hash!==expected)throw new Error(`Dataset hash drift: ${hash}`);
          if(obj.records.length!==78||go!==76||noGo!==2)throw new Error('Controlled count drift');
          if(JSON.stringify(stops)!==JSON.stringify(['Punta Gorda','Tarpon Springs']))throw new Error('NO-GO drift');
          console.log({hash,records:obj.records.length,go,noGo,stops});
          NODE
      - name: Build static production bundle
        run: |
          node scripts/build-canvass-site.mjs
          test -f canvass-dist/training-content-v1.js
          test -f canvass-dist/training-content-sourcefix-v1.js
          test -f canvass-dist/training-v1.js
          test -f canvass-dist/training-v1.css
          test -f canvass-dist/training-player-v1.js
          test -f canvass-dist/training-player-v1.css
      - name: Install isolated Playwright runtime
        shell: bash
        run: |
          PLAYWRIGHT_ROOT="$RUNNER_TEMP/pcm-playwright"
          mkdir -p "$PLAYWRIGHT_ROOT"
          printf '{"private":true,"type":"module"}\n' > "$PLAYWRIGHT_ROOT/package.json"
          npm install --prefix "$PLAYWRIGHT_ROOT" --no-save --ignore-scripts --package-lock=false @playwright/test
          ln -s "$PLAYWRIGHT_ROOT/node_modules" node_modules
          ./node_modules/.bin/playwright install --with-deps webkit chromium
      - name: Start test server
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/pcm-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && break; sleep 1; done
      - name: Run existing iPhone field regression
        run: ./node_modules/.bin/playwright test tests/mobile-regression.spec.js --project=webkit-iphone --reporter=github
      - name: Run existing iPhone offline regression
        run: ./node_modules/.bin/playwright test tests/offline-regression.spec.js --project=webkit-iphone --retries=0 --reporter=github
      - name: Run Paradise University smoke regression
        run: ./node_modules/.bin/playwright test tests/training-smoke.spec.js --project=webkit-iphone --reporter=github
      - name: Run device matrix regression
        run: ./node_modules/.bin/playwright test tests/matrix-smoke.spec.js --reporter=github
