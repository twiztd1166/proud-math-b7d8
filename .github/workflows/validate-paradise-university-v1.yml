name: Validate Paradise University v1
on:
  push:
    branches: [agent/paradise-university-v1]
concurrency:
  group: paradise-university-v1-validation
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax and controlled-data boundary
        shell: bash
        run: |
          node --check training-content-v1.js
          node --check training-content-sourcefix-v1.js
          node --check training-manager-v1-data.js
          node --check training-sales-v1-data.js
          node --check training-v1.js
          node --check training-manager-v1-ui.js
          node --check training-sales-v1-ui.js
          node --check training-readiness-v1.js
          node --check training-practice-v1.js
          node --check training-checks-v1.js
          node --check training-player-v1.js
          node --check training-more-v1.js
          node --check boot-v2.js
          node --check core-v2.js
          node --check lookup-v2.js
          node --check sw.js
          node --check scripts/build-canvass-site.mjs
          node --check tests/training-smoke.spec.js
          node --check tests/readiness-smoke.spec.js
          node --check tests/practice-smoke.spec.js
          node --check tests/checks-smoke.spec.js
          node --check tests/more-search-smoke.spec.js
          node --check tests/offline-regression.spec.js
          grep -q "datasetSha256:'a98b8badf4c3df616fb091eb32ff85f70682f226e4fcd55591f3784b37abe200'" provenance-v3-2.js
          grep -q 'records.length!==78' boot-v2.js
          grep -q 'db.meta.goCount!==76' boot-v2.js
          grep -q 'db.meta.noGoCount!==2' boot-v2.js
          for f in training-content-v1.js training-content-sourcefix-v1.js training-manager-v1-data.js training-sales-v1-data.js training-v1.js training-manager-v1-ui.js training-sales-v1-ui.js training-readiness-v1.js training-practice-v1.js training-checks-v1.js training-player-v1.js training-more-v1.js; do grep -q "$f" index.html; done
          for f in training-readiness-v1.css training-practice-v1.css training-checks-v1.css training-more-v1.css; do grep -q "$f" index.html; done
          grep -q 'training-readiness-v1.js' sw.js
          grep -q 'training-readiness-v1.css' sw.js
          grep -q 'training-practice-v1.js' sw.js
          grep -q 'training-practice-v1.css' sw.js
          grep -q 'training-checks-v1.js' sw.js
          grep -q 'training-checks-v1.css' sw.js
          grep -q 'training-more-v1.js' sw.js
          grep -q 'training-more-v1.css' sw.js
          grep -q 'pcm-field-v3-12-pu-v1-content5-readiness2-practice1-checks2-more1-2026-08-16' sw.js
          grep -q '2026.08.16-pu-v1-content-3' training-content-sourcefix-v1.js
          grep -q '2026.08.16-pu-v1-content-4' training-manager-v1-data.js
          grep -q '2026.08.16-pu-v1-content-5' training-sales-v1-data.js
          grep -q 'CURRENT_POLICY_REQUIRED' training-sales-v1-data.js
          grep -q 'CURRENT POLICY REQUIRED' training-sales-v1-ui.js
          grep -q '2026.08.16-pu-readiness-v2' training-readiness-v1.js
          grep -q 'not an official Paradise certification' training-readiness-v1.js
          grep -q 'manager role-play and field verification required' training-readiness-v1.js
          grep -q 'DEVICE TRAINING COMPLETE' training-readiness-v1.js
          grep -q 'REQUIRED KNOWLEDGE CHECKS' training-readiness-v1.js
          grep -q '2026.08.16-pu-practice-v1' training-practice-v1.js
          grep -q 'not an official certification or manager verification' training-practice-v1.js
          grep -q 'puPracticeStatsV1' training-practice-v1.js
          grep -q 'SHOW COACHING ANSWER' training-practice-v1.js
          grep -q '2026.08.16-pu-checks-v2' training-checks-v1.js
          grep -q 'puQuickChecksV1' training-checks-v1.js
          grep -q 'puLessonTrainingReady' training-checks-v1.js
          grep -q 'The live municipality instructions control the actual route' training-checks-v1.js
          grep -q 'Managers do not override NO-GO' training-checks-v1.js
          grep -q '2026.08.16-pu-player-v1' training-player-v1.js
          grep -q 'playbackRate' training-player-v1.js
          grep -q 'seekbackward' training-player-v1.js
          grep -q 'puMediaResume' training-player-v1.js
          grep -q '2026.08.16-pu-more-v1' training-more-v1.js
          grep -q 'Current Paradise lessons are ranked before legacy/source material' training-more-v1.js
          grep -q 'Training search never replaces the live municipality result' training-more-v1.js
          grep -q 'SOURCE / REFERENCE MATERIAL' training-more-v1.js
          grep -q 'Do not claim you are handing out notices where the live municipality screen says not to use them' training-content-v1.js
          grep -q 'SALES TRAINING IS NOT AUTHORIZATION TO SELL AT THE DOOR' training-content-sourcefix-v1.js
          grep -q 'The manager does not override the live municipality result' training-manager-v1-ui.js
          if grep -q '19CvExmu1fCyaq3SpLprsn8TVIQq-Bzt0' training-content-sourcefix-v1.js; then echo 'Unverified Tony media ID reintroduced'; exit 1; fi
      - name: Validate training content model
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const ctx={window:{}};vm.createContext(ctx);
          for(const f of ['training-content-v1.js','training-content-sourcefix-v1.js','training-manager-v1-data.js','training-sales-v1-data.js'])vm.runInContext(fs.readFileSync(f,'utf8'),ctx);
          const u=ctx.window.PU_CONTENT;
          if(!u||!Array.isArray(u.lessons)||!Array.isArray(u.media)||!Array.isArray(u.drills)||!Array.isArray(u.managerLessons))throw new Error('Training content model missing');
          if(u.version!=='2026.08.16-pu-v1-content-5')throw new Error(`Unexpected training version ${u.version}`);
          const minimum={foundation:4,'field-ready':7,canvasser:9,senior:6,'sales-apprentice':11,'sales-rep':7};
          for(const [stage,min] of Object.entries(minimum)){const n=u.lessons.filter(x=>x.stage===stage).length;if(n<min)throw new Error(`Insufficient ${stage} curriculum: ${n}/${min}`)}
          if(u.lessons.filter(x=>x.stage==='sales-rep').length!==7)throw new Error('Sales Rep Part 1 must contain exactly seven policy-neutral lessons');
          if(u.managerLessons.length<14)throw new Error(`Insufficient manager curriculum: ${u.managerLessons.length}/14`);
          if(u.media.length<12)throw new Error('Curated media catalog too small');
          if(u.salesPolicyGate?.status!=='CURRENT_POLICY_REQUIRED')throw new Error('Sales policy gate missing');
          const requiredDrillCategories=['Opening','Objections','Appointments','Field Rules'];
          for(const cat of requiredDrillCategories)if(!u.drills.some(x=>x.category===cat))throw new Error(`Practice category missing: ${cat}`);
          const forbidden=['Retail Close','Qualification','Major Close','Sub-Step Close','Button-Up','Financing','Contract','Rescission'];
          const salesTitles=u.lessons.filter(x=>x.stage==='sales-rep').map(x=>x.title);
          for(const term of forbidden)if(salesTitles.some(t=>t.toLowerCase().includes(term.toLowerCase())))throw new Error(`Policy-sensitive operational lesson published before current policy verification: ${term}`);
          if(!u.lessons.some(x=>/Certified Canvasser Readiness/i.test(x.title)))throw new Error('Canvasser certification readiness lesson missing');
          if(!u.lessons.some(x=>x.id==='senior-sales-readiness'))throw new Error('Senior sales-readiness lesson missing');
          if(!u.lessons.some(x=>x.id==='sales-process-map'))throw new Error('Sales Apprentice process map missing');
          if(!u.lessons.some(x=>x.id==='sales-shadowing'))throw new Error('Sales Apprentice shadowing lesson missing');
          if(!u.managerLessons.some(x=>x.id==='manager-ridealong'))throw new Error('Manager ride-along lesson missing');
          if(!u.managerLessons.some(x=>x.id==='manager-future-sales'))throw new Error('Future-sales development lesson missing');
          if(!u.managerLessons.some(x=>x.id==='manager-incidents'))throw new Error('Manager incident lesson missing');
          if(!u.drills.some(x=>x.id==='leave-property'&&/stop immediately and leave/i.test(x.answer)))throw new Error('Clear-refusal drill missing');
          if(!u.drills.some(x=>x.id==='no-go'&&/Do not canvass/i.test(x.answer)))throw new Error('NO-GO practice drill missing');
          const ids=new Set(u.media.map(x=>x.id));
          for(const lesson of [...u.lessons,...u.managerLessons])for(const id of lesson.media||[])if(!ids.has(id))throw new Error(`Unknown media ${id} in ${lesson.id}`);
          const urls=u.media.map(x=>x.url);
          for(const id of ['1UoiQtvSx-85qJ4sbC2AegpEFF8ZRqGfC','1Z8wIrTrULa1g3In7_ucINtNZTV0eWczk','12hnKxDUE0nOO5kv_FuBb9fahiFGX4wty','1TKWzlPeTf7gxJ-M5gn9_PsEAUxg7QpPD','1fb4c-L2vJQF9isWRyoUDtPd76rvVr9fh'])if(!urls.some(x=>x.includes(id)))throw new Error(`Verified Tony media missing ${id}`);
          if(!u.sources?.daveFive?.url?.includes('1Au1PhatdFIG84Azy8LiNXh0QLnjLSuIs'))throw new Error('Exact Dave Five Commitments source missing');
          if(!u.sources?.grossoExpanded?.url?.includes('100B1iq77BW00sH4HYMO6zPl80ctMsaam'))throw new Error('Exact Grosso Expanded source missing');
          if(!u.sources?.grossoRideAlong?.url?.includes('1cm2QPzwPRFPITk68fJmT8wc_z_OEPyTl'))throw new Error('Exact ride-along source missing');
          if(!u.sources?.grossoManagement?.url?.includes('1yMpnMW-9pwKt_g4jCzR_SBLMe4FRK3RU7-ZPYYc0wHo'))throw new Error('Exact management source missing');
          const five=u.lessons.find(x=>x.id==='canvass-five-commitments');
          if(!five?.sources?.includes('daveFive'))throw new Error('Five Commitments lesson not linked to exact source');
          const apprentice=u.lessons.filter(x=>x.stage==='sales-apprentice').map(x=>`${x.title} ${x.learn} ${x.pass}`).join(' ');
          if(!/not authorization to sell at the door/i.test(apprentice))throw new Error('Sales Apprentice doorstep boundary missing');
          const coreSales=u.lessons.filter(x=>x.stage==='sales-rep').map(x=>`${x.title} ${x.learn} ${x.pass}`).join(' ');
          if(!/current Paradise|current approved|current product/i.test(coreSales))throw new Error('Sales Rep current-source accuracy boundary missing');
          const mg=u.managerLessons.map(x=>`${x.title} ${x.learn} ${x.pass}`).join(' ');
          if(!/do not improvise law|does not override the live municipality|NO-GO/i.test(mg))throw new Error('Manager compliance boundary missing');
          console.log({version:u.version,lessons:u.lessons.length,managerLessons:u.managerLessons.length,media:u.media.length,drills:u.drills.length,salesRep:salesTitles,policyGate:u.salesPolicyGate.status});
          NODE
      - name: Recompute controlled dataset hash
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),vm=require('vm');
          const src=fs.readFileSync('plain-data.js','utf8');
          const ctx={window:{}};vm.createContext(ctx);vm.runInContext(src,ctx);
          const obj=ctx.window.PCM_DATA;
          if(!obj||!Array.isArray(obj.records))throw new Error('PCM data missing');
          const hash=crypto.createHash('sha256').update(JSON.stringify(obj)).digest('hex');
          const expected='a98b8badf4c3df616fb091eb32ff85f70682f226e4fcd55591f3784b37abe200';
          const go=obj.records.filter(r=>r.release==='GO').length;
          const noGo=obj.records.filter(r=>r.release==='NO-GO').length;
          const stops=obj.records.filter(r=>r.release==='NO-GO').map(r=>r.name).sort();
          if(hash!==expected)throw new Error(`Dataset hash drift: ${hash}`);
          if(obj.records.length!==78||go!==76||noGo!==2)throw new Error('Controlled count drift');
          if(JSON.stringify(stops)!==JSON.stringify(['Punta Gorda','Tarpon Springs']))throw new Error('NO-GO drift');
          console.log({hash,records:obj.records.length,go,noGo,stops});
          NODE
      - name: Build static production bundle
        run: |
          node scripts/build-canvass-site.mjs
          for f in training-content-v1.js training-content-sourcefix-v1.js training-manager-v1-data.js training-sales-v1-data.js training-v1.js training-manager-v1-ui.js training-sales-v1-ui.js training-readiness-v1.js training-readiness-v1.css training-practice-v1.js training-practice-v1.css training-checks-v1.js training-checks-v1.css training-player-v1.js training-more-v1.js training-more-v1.css; do test -f "canvass-dist/$f"; done
      - name: Install isolated Playwright runtime
        shell: bash
        run: |
          PLAYWRIGHT_ROOT="$RUNNER_TEMP/pcm-playwright"
          mkdir -p "$PLAYWRIGHT_ROOT"
          printf '{"private":true,"type":"module"}\n' > "$PLAYWRIGHT_ROOT/package.json"
          npm install --prefix "$PLAYWRIGHT_ROOT" --no-save --ignore-scripts --package-lock=false @playwright/test
          ln -s "$PLAYWRIGHT_ROOT/node_modules" node_modules
          ./node_modules/.bin/playwright install --with-deps webkit chromium
      - name: Start test server
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/pcm-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && break; sleep 1; done
      - name: Run existing iPhone field regression
        run: ./node_modules/.bin/playwright test tests/mobile-regression.spec.js --project=webkit-iphone --reporter=github
      - name: Run existing iPhone offline regression
        run: ./node_modules/.bin/playwright test tests/offline-regression.spec.js --project=webkit-iphone --retries=0 --reporter=github
      - name: Run Paradise University smoke regression
        run: ./node_modules/.bin/playwright test tests/training-smoke.spec.js tests/readiness-smoke.spec.js tests/practice-smoke.spec.js tests/checks-smoke.spec.js tests/more-search-smoke.spec.js --project=webkit-iphone --reporter=github
      - name: Run device matrix regression
        run: ./node_modules/.bin/playwright test tests/matrix-smoke.spec.js --reporter=github
