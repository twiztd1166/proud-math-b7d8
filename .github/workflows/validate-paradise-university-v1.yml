name: Validate Paradise University v1
on:
  push:
    branches: [agent/paradise-university-v1]
concurrency:
  group: paradise-university-v1-validation
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Syntax and build-boundary checks
        shell: bash
        run: |
          for f in training-content-v1.js training-content-sourcefix-v1.js training-manager-v1-data.js training-sales-v1-data.js training-media-expanded-v1.js training-media-reconciliation-v1.js training-governance-v1.js training-v1.js training-media-rights-v1.js training-media-ui-v1.js training-manager-v1-ui.js training-currentness-v1.js training-sales-v1-ui.js training-sales-closing-v1.js training-readiness-v1.js training-practice-data-v2.js training-practice-v1.js training-checks-v1.js training-progress-state-v1.js training-player-v1.js training-media-player-gate-v1.js training-more-v1.js training-more-rights-gate-v1.js training-deep-audit-fixes-v1.js training-experience-v2.js training-ux-polish-v1.js training-experience-v3.js boot-v2.js core-v2.js lookup-v2.js sw.js scripts/build-canvass-site.mjs scripts/validate-training-model-v1.mjs scripts/validate-practice-model-v2.mjs scripts/validate-field-baseline-v1.mjs scripts/validate-training-hardening.mjs scripts/validate-training-reconciliation.mjs scripts/validate-deep-audit-controls.mjs scripts/validate-training-experience-v2.mjs scripts/validate-training-experience-v3.mjs scripts/validate-training-release-isolation.mjs tests/training-smoke.spec.js tests/currentness-smoke.spec.js tests/readiness-smoke.spec.js tests/practice-smoke.spec.js tests/checks-smoke.spec.js tests/more-search-smoke.spec.js tests/media-library-smoke.spec.js tests/player-progress-smoke.spec.js tests/manager-home-smoke.spec.js tests/lesson-flow-acceptance.spec.js tests/release-readiness-smoke.spec.js tests/sales-closing-smoke.spec.js tests/deep-audit-regression.spec.js tests/training-experience-v2.spec.js tests/training-experience-v3.spec.js tests/offline-regression.spec.js; do node --check "$f"; done
          for f in training-content-v1.js training-content-sourcefix-v1.js training-manager-v1-data.js training-sales-v1-data.js training-media-expanded-v1.js training-media-reconciliation-v1.js training-governance-v1.js training-v1.js training-media-rights-v1.js training-media-ui-v1.js training-manager-v1-ui.js training-currentness-v1.js training-sales-v1-ui.js training-sales-closing-v1.js training-readiness-v1.js training-practice-data-v2.js training-practice-v1.js training-checks-v1.js training-progress-state-v1.js training-player-v1.js training-media-player-gate-v1.js training-more-v1.js training-more-rights-gate-v1.js training-deep-audit-fixes-v1.js training-experience-v2.js training-ux-polish-v1.js training-experience-v3.js; do grep -q "$f" index.html; done
          for f in training-media-expanded-v1.js training-media-reconciliation-v1.js training-governance-v1.js training-media-rights-v1.js training-media-ui-v1.js training-currentness-v1.js training-sales-closing-v1.js training-readiness-v1.js training-practice-data-v2.js training-practice-v1.js training-checks-v1.js training-progress-state-v1.js training-player-v1.js training-media-player-gate-v1.js training-more-v1.js training-more-rights-gate-v1.js training-deep-audit-fixes-v1.js training-experience-v2.js training-ux-polish-v1.js training-experience-v3.js; do grep -q "$f" sw.js; done
          grep -q 'training-experience-v3.css' index.html
          grep -q 'training-experience-v3.css' sw.js
          grep -q 'pcm-field-v3-12-pu-v1-content5-readiness2-practice1-checks2-more1-media1-mediaui2-player3-progress1-managerhome1-governance1-2026-08-17' sw.js
          grep -q 'deepaudit1' sw.js
          grep -q 'trainingux5-experience3' sw.js
          grep -q '2026.08.16-pu-media-expanded-v1' training-media-expanded-v1.js
          grep -q '2026.08.16-pu-trainer-library-reconciliation-v1' training-media-reconciliation-v1.js
          grep -q '2026.08.16-pu-governance-v1' training-governance-v1.js
          grep -q '2026.08.16-pu-media-internal-v2' training-media-rights-v1.js
          grep -q 'INTERNAL_USE_NON_BLOCKING' training-media-rights-v1.js
          grep -q '2026.08.16-pu-media-ui-v5' training-media-ui-v1.js
          grep -q '2026.08.16-pu-manager-ui-v2' training-manager-v1-ui.js
          grep -q '2026.08.16-pu-currentness-v1' training-currentness-v1.js
          grep -q 'SUPPORTED_BY_2026_PARADISE_POLICY' training-currentness-v1.js
          grep -q 'PENDING_CURRENT_HUMAN_APPROVAL' training-currentness-v1.js
          grep -q 'CURRENT APPROVAL PENDING' training-currentness-v1.js
          grep -q 'blanket “spouse must be present”' training-currentness-v1.js
          grep -q '2026.08.16-pu-progress-state-v1' training-progress-state-v1.js
          grep -q '2026.08.17-pu-player-v3-drive-top-level' training-player-v1.js
          grep -q 'data-provider="drive-top-level"' training-player-v1.js
          grep -q 'PLAY IN GOOGLE DRIVE' training-player-v1.js
          if grep -q '<iframe' training-player-v1.js; then echo 'Embedded training iframe reintroduced'; exit 1; fi
          grep -q '2026.08.16-pu-media-player-rights-v1' training-media-player-gate-v1.js
          grep -q '2026.08.16-pu-more-rights-v1' training-more-rights-gate-v1.js
          grep -q '2026.08.16-pu-practice-data-v2' training-practice-data-v2.js
          grep -q '2026.08.17-pu-practice-v3-adaptive' training-practice-v1.js
          grep -q 'Practice My Weak Areas' training-practice-v1.js
          grep -q '2026.08.17-pu-checks-v3-versioned' training-checks-v1.js
          grep -q '2026.08.17-pu-deep-audit-fixes-v1' training-deep-audit-fixes-v1.js
          grep -q '2026.08.17-pu-training-experience-v2' training-experience-v2.js
          grep -q 'CANVASSER_CORE' training-experience-v2.js
          grep -q 'PASS QUICK CHECK FIRST' training-experience-v2.js
          grep -q '||checkRequired))nextBtn.disabled=!(done&&passed)' training-experience-v2.js
          grep -q '2026.08.17-pu-training-ux-polish-v1' training-ux-polish-v1.js
          grep -q 'NEXT MILESTONE' training-ux-polish-v1.js
          grep -q 'puTrainingNavV1' training-ux-polish-v1.js
          grep -q '2026.08.17-pu-training-experience-v3' training-experience-v3.js
          grep -q 'PARADISE_UNIVERSITY_PROGRESS_TRANSFER' training-experience-v3.js
          grep -q 'PRACTICE THIS SKILL' training-experience-v3.js
          grep -q 'Lesson complete ✓' training-experience-v3.js
          if grep -Eqi 'manager-assigned|assigned training|due date' training-experience-v3.js training-ux-polish-v1.js; then echo 'Manager-assigned training reintroduced'; exit 1; fi
          grep -q '2026.08.16-pu-sales-closing-v2' training-sales-closing-v1.js
          grep -q 'puMediaProgressV2' training-player-v1.js
          grep -q 'CURRENT_POLICY_REQUIRED' training-sales-v1-data.js
          grep -q 'SALES TRAINING IS NOT AUTHORIZATION TO SELL AT THE DOOR' training-content-sourcefix-v1.js
          grep -q 'Training search never replaces the live municipality result' training-more-v1.js
          grep -q 'SOURCE / REFERENCE MATERIAL' training-more-v1.js
          if grep -q '19CvExmu1fCyaq3SpLprsn8TVIQq-Bzt0' training-content-sourcefix-v1.js training-media-expanded-v1.js training-media-reconciliation-v1.js; then echo 'Unverified Tony media ID reintroduced'; exit 1; fi

      - name: Validate training content and hardening
        run: |
          node scripts/validate-training-model-v1.mjs
          node scripts/validate-practice-model-v2.mjs
          node scripts/validate-training-hardening.mjs
          node scripts/validate-training-reconciliation.mjs
          node scripts/validate-deep-audit-controls.mjs
          node scripts/validate-training-experience-v2.mjs
          node scripts/validate-training-experience-v3.mjs

      - name: Reconfirm controlled field baseline
        run: node scripts/validate-field-baseline-v1.mjs

      - name: Prove training release isolation from validated field engine
        run: node scripts/validate-training-release-isolation.mjs

      - name: Build static production bundle
        run: |
          node scripts/build-canvass-site.mjs
          for f in training-content-v1.js training-content-sourcefix-v1.js training-manager-v1-data.js training-sales-v1-data.js training-media-expanded-v1.js training-media-reconciliation-v1.js training-governance-v1.js training-v1.js training-media-rights-v1.js training-media-ui-v1.js training-manager-v1-ui.js training-currentness-v1.js training-sales-v1-ui.js training-sales-closing-v1.js training-readiness-v1.js training-readiness-v1.css training-practice-data-v2.js training-practice-v1.js training-practice-v1.css training-checks-v1.js training-checks-v1.css training-progress-state-v1.js training-player-v1.js training-media-player-gate-v1.js training-player-v1.css training-more-v1.js training-more-rights-gate-v1.js training-more-v1.css training-deep-audit-fixes-v1.js training-experience-v2.js training-ux-polish-v1.js training-experience-v3.js training-experience-v3.css; do test -f "canvass-dist/$f"; done

      - name: Install isolated Playwright runtime
        shell: bash
        run: |
          PLAYWRIGHT_ROOT="$RUNNER_TEMP/pcm-playwright"
          mkdir -p "$PLAYWRIGHT_ROOT"
          printf '{"private":true,"type":"module"}\n' > "$PLAYWRIGHT_ROOT/package.json"
          npm install --prefix "$PLAYWRIGHT_ROOT" --no-save --ignore-scripts --package-lock=false @playwright/test
          ln -s "$PLAYWRIGHT_ROOT/node_modules" node_modules
          ./node_modules/.bin/playwright install --with-deps webkit chromium

      - name: Start test server
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/pcm-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && break; sleep 1; done

      - name: Run existing iPhone field regression
        run: ./node_modules/.bin/playwright test tests/mobile-regression.spec.js --project=webkit-iphone --reporter=github

      - name: Run existing iPhone offline regression
        run: ./node_modules/.bin/playwright test tests/offline-regression.spec.js --project=webkit-iphone --retries=0 --reporter=github

      - name: Run Training Experience v2 red-team regression
        run: ./node_modules/.bin/playwright test tests/training-experience-v2.spec.js --project=webkit-iphone --reporter=github

      - name: Run Training Experience v3 experience regression
        run: ./node_modules/.bin/playwright test tests/training-experience-v3.spec.js --project=webkit-iphone --reporter=github

      - name: Run Paradise University iPhone regression
        run: ./node_modules/.bin/playwright test tests/training-smoke.spec.js tests/currentness-smoke.spec.js tests/readiness-smoke.spec.js tests/practice-smoke.spec.js tests/checks-smoke.spec.js tests/more-search-smoke.spec.js tests/media-library-smoke.spec.js tests/player-progress-smoke.spec.js tests/manager-home-smoke.spec.js tests/lesson-flow-acceptance.spec.js tests/release-readiness-smoke.spec.js tests/sales-closing-smoke.spec.js tests/deep-audit-regression.spec.js --project=webkit-iphone --reporter=github

      - name: Run device matrix regression
        run: ./node_modules/.bin/playwright test tests/matrix-smoke.spec.js --reporter=github
