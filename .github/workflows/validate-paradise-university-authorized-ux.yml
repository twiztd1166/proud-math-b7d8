name: Validate authorized Paradise University UX polish
on:
  push:
    branches: [agent/paradise-university-ux-polish-authorized]
concurrency:
  group: paradise-university-authorized-ux
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Static and controlled-model validation
        shell: bash
        run: |
          for f in training-content-v1.js training-content-sourcefix-v1.js training-manager-v1-data.js training-sales-v1-data.js training-media-expanded-v1.js training-media-reconciliation-v1.js training-governance-v1.js training-v1.js training-media-rights-v1.js training-media-ui-v1.js training-manager-v1-ui.js training-currentness-v1.js training-sales-v1-ui.js training-sales-closing-v1.js training-readiness-v1.js training-practice-data-v2.js training-practice-v1.js training-checks-v1.js training-progress-state-v1.js training-player-v1.js training-media-player-gate-v1.js training-more-v1.js training-more-rights-gate-v1.js training-deep-audit-fixes-v1.js training-experience-v2.js training-ux-polish-v1.js boot-v2.js core-v2.js lookup-v2.js sw.js scripts/build-canvass-site.mjs scripts/validate-training-model-v1.mjs scripts/validate-practice-model-v2.mjs scripts/validate-field-baseline-v1.mjs scripts/validate-training-hardening.mjs scripts/validate-training-reconciliation.mjs scripts/validate-deep-audit-controls.mjs scripts/validate-training-experience-v2.mjs scripts/validate-training-release-isolation.mjs tests/training-ux-polish.spec.js tests/practice-smoke.spec.js tests/offline-regression.spec.js; do node --check "$f"; done
          node scripts/validate-training-model-v1.mjs
          node scripts/validate-practice-model-v2.mjs
          node scripts/validate-training-hardening.mjs
          node scripts/validate-training-reconciliation.mjs
          node scripts/validate-deep-audit-controls.mjs
          node scripts/validate-training-experience-v2.mjs
          node scripts/validate-field-baseline-v1.mjs
          node scripts/validate-training-release-isolation.mjs
          grep -q '2026.08.17-pu-training-ux-polish-v1' training-ux-polish-v1.js
          grep -q '2026.08.17-pu-practice-v3-adaptive' training-practice-v1.js
          grep -q 'trainingux4-adaptive1-nav1' sw.js
          if grep -q 'training-experience-v3' index.html; then echo 'Dormant v3 layer was activated outside authorized scope'; exit 1; fi
      - name: Build controlled static bundle
        run: |
          node scripts/build-canvass-site.mjs
          test -f canvass-dist/training-ux-polish-v1.js
          if grep -q 'training-experience-v3' canvass-dist/index.html; then echo 'Dormant v3 layer entered production bundle'; exit 1; fi
      - name: Install isolated Playwright runtime
        shell: bash
        run: |
          PLAYWRIGHT_ROOT="$RUNNER_TEMP/pcm-playwright"
          mkdir -p "$PLAYWRIGHT_ROOT"
          printf '{"private":true,"type":"module"}\n' > "$PLAYWRIGHT_ROOT/package.json"
          npm install --prefix "$PLAYWRIGHT_ROOT" --no-save --ignore-scripts --package-lock=false @playwright/test
          ln -s "$PLAYWRIGHT_ROOT/node_modules" node_modules
          ./node_modules/.bin/playwright install --with-deps webkit chromium
      - name: Start test server
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/pcm-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && break; sleep 1; done
      - name: iPhone field regression
        run: ./node_modules/.bin/playwright test tests/mobile-regression.spec.js --project=webkit-iphone --reporter=github
      - name: iPhone offline regression
        run: ./node_modules/.bin/playwright test tests/offline-regression.spec.js --project=webkit-iphone --retries=0 --reporter=github
      - name: Training Experience v2 red-team regression
        run: ./node_modules/.bin/playwright test tests/training-experience-v2.spec.js --project=webkit-iphone --reporter=github
      - name: Authorized UX polish regression
        run: ./node_modules/.bin/playwright test tests/training-ux-polish.spec.js tests/practice-smoke.spec.js --project=webkit-iphone --reporter=github
      - name: Full Paradise University iPhone regression
        run: ./node_modules/.bin/playwright test tests/training-smoke.spec.js tests/currentness-smoke.spec.js tests/readiness-smoke.spec.js tests/checks-smoke.spec.js tests/more-search-smoke.spec.js tests/media-library-smoke.spec.js tests/player-progress-smoke.spec.js tests/manager-home-smoke.spec.js tests/lesson-flow-acceptance.spec.js tests/release-readiness-smoke.spec.js tests/sales-closing-smoke.spec.js tests/deep-audit-regression.spec.js --project=webkit-iphone --reporter=github
      - name: Device matrix regression
        run: ./node_modules/.bin/playwright test tests/matrix-smoke.spec.js --reporter=github
