name: Validate Paradise native store distribution

on:
  push:
    branches:
      - agent/paradise-native-store-distribution-v1
      - agent/paradise-store-submission-package-v1
      - agent/paradise-native-performance-integration-v1
      - agent/paradise-store-assets-v1
    paths:
      - 'capacitor.config.json'
      - 'performance/client/**'
      - 'performance/native/**'
      - 'performance/tests/**'
      - 'scripts/build-canvass-site.mjs'
      - 'scripts/build-performance-native-site.mjs'
      - 'scripts/prepare-performance-android-shell.mjs'
      - 'scripts/prepare-performance-android-store.mjs'
      - 'scripts/prepare-performance-ios-shell.rb'
      - 'scripts/prepare-performance-ios-store.rb'
      - 'scripts/prepare-performance-store-assets.mjs'
      - 'scripts/validate-paradise-native-performance-integration.mjs'
      - 'scripts/validate-paradise-store-distribution.mjs'
      - 'scripts/validate-paradise-store-submission-package.mjs'
      - 'store/paradise-performance/**'
      - 'docs/PARADISE_NATIVE_STORE_DISTRIBUTION_V1.md'
      - 'docs/PARADISE_NATIVE_STORE_SUBMISSION_RUNBOOK_V1.md'
      - 'docs/PARADISE_PERFORMANCE_EMPLOYEE_APP_PRIVACY_NOTICE_DRAFT_2026-08-19.md'
      - 'docs/PARADISE_STORE_ASSETS_V1.md'
      - '.github/workflows/validate-paradise-native-store-distribution.yml'
  pull_request:
    paths:
      - 'capacitor.config.json'
      - 'performance/client/**'
      - 'performance/native/**'
      - 'performance/tests/**'
      - 'scripts/build-canvass-site.mjs'
      - 'scripts/build-performance-native-site.mjs'
      - 'scripts/prepare-performance-android-shell.mjs'
      - 'scripts/prepare-performance-android-store.mjs'
      - 'scripts/prepare-performance-ios-shell.rb'
      - 'scripts/prepare-performance-ios-store.rb'
      - 'scripts/prepare-performance-store-assets.mjs'
      - 'scripts/validate-paradise-native-performance-integration.mjs'
      - 'scripts/validate-paradise-store-distribution.mjs'
      - 'scripts/validate-paradise-store-submission-package.mjs'
      - 'store/paradise-performance/**'
      - 'docs/PARADISE_NATIVE_STORE_DISTRIBUTION_V1.md'
      - 'docs/PARADISE_NATIVE_STORE_SUBMISSION_RUNBOOK_V1.md'
      - 'docs/PARADISE_PERFORMANCE_EMPLOYEE_APP_PRIVACY_NOTICE_DRAFT_2026-08-19.md'
      - 'docs/PARADISE_STORE_ASSETS_V1.md'
      - '.github/workflows/validate-paradise-native-store-distribution.yml'

permissions:
  contents: read

concurrency:
  group: paradise-native-store-distribution-${{ github.ref }}
  cancel-in-progress: true

env:
  CAPACITOR_VERSION: '8.5.0'
  SUPABASE_JS_VERSION: '2.112.3'
  ESBUILD_VERSION: '0.28.2'
  SHARP_VERSION: '0.35.3'
  PARADISE_STORE_VERSION: '1.0.0'
  PARADISE_STORE_BUILD: '1'

jobs:
  controls:
    name: Store distribution controls
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install repository dependencies
        run: npm ci

      - name: Install pinned native web-build dependencies
        run: >-
          npm install --no-save --package-lock=false
          @capacitor/core@${CAPACITOR_VERSION}
          @supabase/supabase-js@${SUPABASE_JS_VERSION}
          esbuild@${ESBUILD_VERSION}
          sharp@${SHARP_VERSION}

      - name: Validate controlled Paradise brand source
        run: node scripts/prepare-performance-store-assets.mjs --source

      - name: Build controlled public Canvass bundle
        run: node scripts/build-canvass-site.mjs

      - name: Build controlled native Performance bundle
        run: node scripts/build-performance-native-site.mjs

      - name: Validate native Performance integration
        run: node scripts/validate-paradise-native-performance-integration.mjs --built

      - name: Validate Performance foundation
        run: node scripts/validate-performance-foundation.mjs

      - name: Validate enrollment and stale-session controls
        run: node scripts/validate-performance-enrollment-security.mjs

      - name: Run Performance contract tests
        run: node --test performance/tests/*.test.mjs

      - name: Validate store distribution controls
        run: node scripts/validate-paradise-store-distribution.mjs

      - name: Validate store submission package controls
        run: node scripts/validate-paradise-store-submission-package.mjs

  android-store:
    name: Android unsigned Play candidate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install repository dependencies
        run: npm ci

      - name: Install pinned native Android toolchain and web dependencies
        run: >-
          npm install --no-save --package-lock=false
          @capacitor/core@${CAPACITOR_VERSION}
          @capacitor/cli@${CAPACITOR_VERSION}
          @capacitor/android@${CAPACITOR_VERSION}
          @supabase/supabase-js@${SUPABASE_JS_VERSION}
          esbuild@${ESBUILD_VERSION}
          sharp@${SHARP_VERSION}

      - name: Build controlled public Canvass bundle
        run: node scripts/build-canvass-site.mjs

      - name: Build controlled native Performance bundle
        run: node scripts/build-performance-native-site.mjs

      - name: Validate built native Performance integration
        run: node scripts/validate-paradise-native-performance-integration.mjs --built

      - name: Generate Android shell
        run: npx cap add android

      - name: Integrate controlled Android native plugins
        run: node scripts/prepare-performance-android-shell.mjs

      - name: Apply Google Play store controls
        run: node scripts/prepare-performance-android-store.mjs

      - name: Apply controlled Paradise Android launcher assets
        run: node scripts/prepare-performance-store-assets.mjs --android

      - name: Compile unsigned Android Release AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Verify Android AAB
        run: test -f android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload Android brand review evidence
        uses: actions/upload-artifact@v4
        with:
          name: paradise-performance-android-brand-review-NOT-FOR-SUBMISSION
          path: |
            store-build/paradise-performance/brand/review/google-play-icon-512.png
            store-build/paradise-performance/brand/store-brand-assets-report.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload Android unsigned candidate
        uses: actions/upload-artifact@v4
        with:
          name: paradise-performance-android-store-candidate-UNSIGNED-NOT-FOR-DISTRIBUTION
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

  ios-store:
    name: iOS unsigned App Store candidate
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install repository dependencies
        run: npm ci

      - name: Install pinned native iOS toolchain and web dependencies
        run: >-
          npm install --no-save --package-lock=false
          @capacitor/core@${CAPACITOR_VERSION}
          @capacitor/cli@${CAPACITOR_VERSION}
          @capacitor/ios@${CAPACITOR_VERSION}
          @supabase/supabase-js@${SUPABASE_JS_VERSION}
          esbuild@${ESBUILD_VERSION}
          sharp@${SHARP_VERSION}

      - name: Build controlled public Canvass bundle
        run: node scripts/build-canvass-site.mjs

      - name: Build controlled native Performance bundle
        run: node scripts/build-performance-native-site.mjs

      - name: Validate built native Performance integration
        run: node scripts/validate-paradise-native-performance-integration.mjs --built

      - name: Generate iOS SPM shell
        run: npx cap add ios --packagemanager SPM

      - name: Install Xcode project helper
        run: gem install xcodeproj --no-document

      - name: Integrate controlled iOS native plugins and privacy manifest
        run: ruby scripts/prepare-performance-ios-shell.rb

      - name: Apply App Store identity and version controls
        run: ruby scripts/prepare-performance-ios-store.rb

      - name: Apply controlled Paradise iOS AppIcon
        run: node scripts/prepare-performance-store-assets.mjs --ios

      - name: Validate iOS 26+ SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          SDK_MAJOR="${SDK_VERSION%%.*}"
          echo "iPhoneOS SDK: ${SDK_VERSION}"
          if [[ ! "${SDK_MAJOR}" =~ ^[0-9]+$ ]] || (( SDK_MAJOR < 26 )); then
            echo "App Store candidate requires iOS SDK 26 or later; found ${SDK_VERSION}" >&2
            exit 1
          fi

      - name: Resolve iOS package dependencies
        run: xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App

      - name: Compile unsigned generic iPhone Release shell
        run: >-
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Release
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath build/paradise-performance-store-ios
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Upload iOS brand review evidence
        uses: actions/upload-artifact@v4
        with:
          name: paradise-performance-ios-brand-review-NOT-FOR-SUBMISSION
          path: |
            store-build/paradise-performance/brand/review/apple-app-icon-1024.png
            store-build/paradise-performance/brand/store-brand-assets-report.json
          if-no-files-found: error
          retention-days: 7

      - name: Package unsigned Xcode store candidate
        run: tar -czf paradise-performance-ios-store-candidate-UNSIGNED-NOT-FOR-DISTRIBUTION.tar.gz ios/App

      - name: Upload iOS unsigned candidate
        uses: actions/upload-artifact@v4
        with:
          name: paradise-performance-ios-store-candidate-UNSIGNED-NOT-FOR-DISTRIBUTION
          path: paradise-performance-ios-store-candidate-UNSIGNED-NOT-FOR-DISTRIBUTION.tar.gz
          if-no-files-found: error
          retention-days: 7
