name: Paradise Shows public live smoke

on:
  push:
    branches:
      - paradise-shows-public
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paradise-shows-public-live-smoke
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SITE: https://paradise-shows-public.proud-math-b7d8.pages.dev
      API: https://taxlrlfsobtnbasjcnuf.supabase.co/functions/v1/shows-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Wait for exact public asset convergence
        shell: bash
        run: |
          set -euo pipefail
          assets=(app.css app-core.js app-shows.js app-control.js app-bind.js app-modals.js manifest.webmanifest sw.js)
          for attempt in $(seq 1 24); do
            ok=1
            for asset in "${assets[@]}"; do
              if ! curl -fsS "$SITE/$asset" -o "/tmp/$asset"; then
                ok=0
                break
              fi
              expected="$(sha256sum "public/$asset" | awk '{print $1}')"
              actual="$(sha256sum "/tmp/$asset" | awk '{print $1}')"
              if [[ "$expected" != "$actual" ]]; then
                echo "Attempt $attempt: $asset not converged"
                ok=0
                break
              fi
            done
            if [[ "$ok" -eq 1 ]]; then
              echo "Public assets match this exact GitHub commit."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Stable branch URL did not converge to this commit."
          exit 1

      - name: Verify live CORS and operating population
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -D /tmp/options.headers -o /tmp/options.body \
            -X OPTIONS "$API" \
            -H "Origin: $SITE" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: content-type"
          grep -Fi "access-control-allow-origin: $SITE" /tmp/options.headers

          curl -sS -D /tmp/bootstrap.headers -o /tmp/bootstrap.json \
            -X POST "$API" \
            -H "Origin: $SITE" \
            -H "Content-Type: application/json" \
            --data '{"action":"bootstrap"}'
          grep -Fi "access-control-allow-origin: $SITE" /tmp/bootstrap.headers
          python - <<'PY'
          import json
          x=json.load(open('/tmp/bootstrap.json'))
          assert x.get('ok') is True, x
          assert len(x.get('shows') or []) == 36, len(x.get('shows') or [])
          assert len(x.get('payments') or []) == 3, len(x.get('payments') or [])
          print({'shows':36,'payments':3})
          PY

          curl -sS -o /tmp/catalog.json \
            -X POST "$API" \
            -H "Origin: $SITE" \
            -H "Content-Type: application/json" \
            --data '{"action":"catalog"}'
          python - <<'PY'
          import json
          x=json.load(open('/tmp/catalog.json'))
          s=x.get('summary') or {}
          assert x.get('ok') is True, x
          assert s.get('profile_count') == 655, s
          assert s.get('occurrence_count') == 1086, s
          assert len(x.get('profiles') or []) == 655
          print({'profiles':655,'evidence_records':1086})
          PY

          curl -sS -o /tmp/sff.json \
            -X POST "$API" \
            -H "Origin: $SITE" \
            -H "Content-Type: application/json" \
            --data '{"action":"catalogHistory","profileId":"LIFE-002"}'
          curl -sS -o /tmp/acs.json \
            -X POST "$API" \
            -H "Origin: $SITE" \
            -H "Content-Type: application/json" \
            --data '{"action":"catalogHistory","profileId":"LIFE-004"}'

          curl -sS -o /tmp/broward.json \
            -X POST "$API" \
            -H "Origin: $SITE" \
            -H "Content-Type: application/json" \
            --data '{"action":"catalogHistory","profileId":"LIFE-010"}'

          curl -sS -o /tmp/palm17.json \
            -X POST "$API" \
            -H "Origin: $SITE" \
            -H "Content-Type: application/json" \
            --data '{"action":"catalogHistory","profileId":"LIFE-016"}'

          curl -sS -o /tmp/wpb14.json \
            -X POST "$API" \
            -H "Origin: $SITE" \
            -H "Content-Type: application/json" \
            --data '{"action":"catalogHistory","profileId":"HIST-152"}'

          curl -sS -o /tmp/delray14.json \
            -X POST "$API" \
            -H "Origin: $SITE" \
            -H "Content-Type: application/json" \
            --data '{"action":"catalogHistory","profileId":"HIST-122"}'
          python - <<'PY'
          import json
          sff=json.load(open('/tmp/sff.json'))
          acs=json.load(open('/tmp/acs.json'))
          broward=json.load(open('/tmp/broward.json'))
          assert sff.get('ok') is True, sff
          assert acs.get('ok') is True, acs
          assert broward.get('ok') is True, broward
          sff19=[h for h in sff.get('history') or [] if h.get('source_year') == 2019 and h.get('source_kind') == 'ARCHIVED_SCHEDULE']
          assert sff19, sff

          annual_broward=next((x for x in broward.get('performance') or [] if x.get('evidence_id') == 'LP2015-007'), None)
          cumulative_broward=next((x for x in broward.get('cumulativePerformance') or [] if x.get('evidence_id') == 'LPCUM-2015-0007'), None)
          assert annual_broward, broward
          assert cumulative_broward, broward
          assert annual_broward.get('close_sales_count') == 1 and float(annual_broward.get('close_sales_volume')) == 2420, annual_broward
          assert cumulative_broward.get('raw_count') == 91, cumulative_broward
          assert cumulative_broward.get('gross_close_count') == 12 and float(cumulative_broward.get('gross_close_volume')) == 125738, cumulative_broward
          assert cumulative_broward.get('net_close_count') == 10 and float(cumulative_broward.get('net_close_volume')) == 92473, cumulative_broward
          assert cumulative_broward.get('comparison_status') == 'MATURED', cumulative_broward
          years={h.get('source_year') for h in acs.get('history') or [] if h.get('source_kind') in ('ARCHIVED_SCHEDULE','SHOW_COST_REGISTER')}
          assert {2018,2019,2020}.issubset(years), years

          catalog=json.load(open('/tmp/catalog.json'))
          summary=(catalog.get('summary') or {})
          source_summary=summary.get('source_summary') or {}
          cumulative=source_summary.get('cumulative_lifetime_layer') or {}
          assert cumulative.get('rows') == 1251, cumulative
          assert cumulative.get('unresolved') == 0, cumulative
          assert cumulative.get('exact_unchanged') == 1095, cumulative
          assert cumulative.get('matured') == 143, cumulative
          assert cumulative.get('cumulative_only') == 13, cumulative
          assert cumulative.get('gross_close_delta') == 108, cumulative
          assert cumulative.get('gross_volume_delta') == 1850586, cumulative
          assert cumulative.get('net_close_delta') == 82, cumulative
          assert cumulative.get('net_volume_delta') == 1362328, cumulative
          assert cumulative.get('annual_values_overwritten') is False, cumulative
          assert cumulative.get('validation') == 'PASS', cumulative
          y20=source_summary.get('year_2020') or {}
          assert y20.get('source_files') == 19, y20
          assert y20.get('preserved_occurrence_groups') == 55, y20
          assert y20.get('staffed_groups') == 35, y20
          assert y20.get('setup_only_groups') == 20, y20

          y14=source_summary.get('2014') or {}
          y15=source_summary.get('2015') or {}
          y16=source_summary.get('2016') or {}
          y17=source_summary.get('2017') or {}
          assert y14.get('records') == 6, y14
          assert y14.get('profiles') == 4, y14
          assert y14.get('performance_backed') == 5, y14
          assert y14.get('schedule_only') == 1, y14
          assert (y14.get('annual_control') or {}).get('number_of_shows') == 23, y14
          assert y15.get('records') == 75, y15
          assert y15.get('profiles') == 63, y15
          assert y15.get('performance_backed') == 55, y15
          assert y15.get('schedule_only') == 20, y15
          assert y15.get('undated_source_rows') == 4, y15
          assert (y15.get('annual_control') or {}).get('number_of_shows') == 48, y15
          assert y16.get('records') == 53, y16
          assert y16.get('profiles') == 45, y16
          assert (y16.get('main_source_totals') or {}).get('gross_sales') == 1621842, y16
          assert y17.get('records') == 82, y17
          assert y17.get('profiles') == 74, y17
          assert y17.get('worked_or_tracked') == 80, y17
          assert y17.get('booking_only') == 2, y17

          sff15=next((h for h in sff.get('history') or [] if h.get('history_id') == '2015-ARCH-PERF-0001'), None)
          assert sff15 and sff15.get('dates_text') == '2015-01-16 – 2015-02-02', sff15
          assert float(sff15.get('gross_sales_value')) == 389899, sff15
          assert (sff15.get('source_fields') or {}).get('sets') == 205, sff15
          assert (sff15.get('source_fields') or {}).get('sales') == 39, sff15
          assert sff15.get('payment_status_text') == 'Paid In Full', sff15
          assert 'WORKED/TRACKED' in str(sff15.get('participation_status','')), sff15

          sff16=next((h for h in sff.get('history') or [] if h.get('history_id') == '2016-ARCH-PERF-0001'), None)
          assert sff16 and sff16.get('dates_text') == '2016-01-15 – 2016-01-31', sff16
          assert sff16.get('issued_appts') == 131, sff16
          assert float(sff16.get('gross_sales_value')) == 526809, sff16
          assert (sff16.get('source_fields') or {}).get('appts') == 107, sff16
          assert (sff16.get('source_fields') or {}).get('contacts') == 164, sff16

          sff17=next((h for h in sff.get('history') or [] if h.get('history_id') == '2017-ARCH-PERF-0044'), None)
          assert sff17 and sff17.get('dates_text') == '2017-01-13 – 2017-01-29', sff17
          assert sff17.get('issued_appts') == 81, sff17
          assert sff17.get('payment_status_text') == 'PAID IN FULL', sff17

          acs15=next((h for h in acs.get('history') or [] if h.get('history_id') == '2015-ARCH-PERF-0010'), None)
          assert acs15 and acs15.get('dates_text') == '2015-02-20 – 2015-02-22', acs15
          assert float(acs15.get('gross_sales_value')) == 68629, acs15
          assert (acs15.get('source_fields') or {}).get('sets') == 103, acs15
          assert (acs15.get('source_fields') or {}).get('sales') == 9, acs15

          acs16=next((h for h in acs.get('history') or [] if h.get('history_id') == '2016-ARCH-PERF-0008'), None)
          assert acs16 and acs16.get('issued_appts') == 52, acs16
          assert float(acs16.get('gross_sales_value')) == 154426, acs16

          acs17=next((h for h in acs.get('history') or [] if h.get('history_id') == '2017-ARCH-PERF-0036'), None)
          assert acs17 and acs17.get('issued_appts') == 31, acs17
          assert acs17.get('payment_status_text') == 'OWE $3290; DUE 1/10', acs17

          sff20=[h for h in sff.get('history') or [] if h.get('source_year') == 2020 and h.get('dates_text') == '2020-01-16 – 2020-02-02']
          assert sff20, sff
          assert all('NOT PROOF OF SHOW COMPLETION' in str(h.get('participation_status','')) for h in sff20), sff20

          palm17=json.load(open('/tmp/palm17.json'))
          assert palm17.get('ok') is True, palm17
          palm17_booking=next((h for h in palm17.get('history') or [] if h.get('history_id') == '2017-ARCH-SCHED-0081'), None)
          assert palm17_booking and palm17_booking.get('source_kind') == 'ARCHIVED_SCHEDULE', palm17_booking
          assert 'NOT PROOF OF COMPLETED PARTICIPATION' in str(palm17_booking.get('participation_status','')), palm17_booking
          assert palm17_booking.get('payment_status_text') == 'PAID IN FULL', palm17_booking


          wpb14=json.load(open('/tmp/wpb14.json'))
          assert wpb14.get('ok') is True, wpb14
          wpb14_rows=[h for h in wpb14.get('history') or [] if h.get('source_year') == 2014]
          assert len(wpb14_rows) == 2, wpb14_rows
          assert any(h.get('history_id') == '2014-ARCH-SCHED-0001' and 'NOT PROOF OF COMPLETED PARTICIPATION' in str(h.get('participation_status','')) for h in wpb14_rows), wpb14_rows
          assert any(h.get('history_id') == '2014-ARCH-PERF-0005' and float(h.get('gross_sales_value')) == 9385 for h in wpb14_rows), wpb14_rows

          delray14=json.load(open('/tmp/delray14.json'))
          assert delray14.get('ok') is True, delray14
          affair14=next((h for h in delray14.get('history') or [] if h.get('history_id') == '2014-ARCH-PERF-0002'), None)
          assert affair14 and affair14.get('dates_text') == '2014-04-04 – 2014-04-05', affair14
          assert float(affair14.get('gross_sales_value')) == 49950, affair14

          catalog=json.load(open('/tmp/catalog.json'))
          profiles=catalog.get('profiles') or []
          ids={p.get('profile_id') for p in profiles}
          for removed in ('HIST-243','HIST-244','HIST-246','HIST-353','HIST-377','HIST-389'):
              assert removed not in ids, removed
          names={str(p.get('canonical_event','')).strip().lower() for p in profiles}
          assert 'add 14 hrs' not in names
          assert 'training in office' not in names
          print({'south_florida_fair_2019_records':len(sff19),'acs_archive_years':sorted(years),'cleanup':'PASS'})
          PY

      - name: Execute live page in fresh headless Chrome
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome" || { echo "Chrome not found"; exit 1; }
          profile="$(mktemp -d)"
          "$chrome" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --user-data-dir="$profile" \
            --virtual-time-budget=20000 \
            --enable-logging=stderr \
            --log-level=0 \
            --dump-dom "$SITE/" >/tmp/dom.html 2>/tmp/chrome.log

          if grep -q 'Loading shows…' /tmp/dom.html; then
            echo "::error::Rendered DOM remained stuck on Loading shows."
            grep -Ei 'uncaught|typeerror|referenceerror|cors|blocked|refused|content security' /tmp/chrome.log | tail -80 || true
            exit 1
          fi
          grep -q 'Work today / this week' /tmp/dom.html
          if grep -Ei 'INFO:CONSOLE:.*(Uncaught|TypeError|ReferenceError|SyntaxError)' /tmp/chrome.log; then
            echo "::error::Browser console contains an uncaught JavaScript error."
            exit 1
          fi
          echo "Live browser rendered the operating view without uncaught JavaScript errors."
