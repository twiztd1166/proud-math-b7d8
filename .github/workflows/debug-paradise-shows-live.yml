name: Paradise Shows public live smoke

on:
  push:
    branches:
      - paradise-shows-public
  pull_request:
    branches:
      - paradise-shows-public
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paradise-shows-public-live-smoke-${{ github.sha }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SITE: https://paradise-shows-public.proud-math-b7d8.pages.dev
      API: https://taxlrlfsobtnbasjcnuf.supabase.co/functions/v1/shows-api
      ANNUAL_API: https://taxlrlfsobtnbasjcnuf.supabase.co/functions/v1/shows-annual-plan-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate R19 mature-smoke adapter
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/run-paradise-shows-live-smoke.py scripts/run-paradise-shows-live-smoke-r19.py
          grep -q '83a90da8-d460-413f-8ca4-7735bcbe0f88' scripts/run-paradise-shows-live-smoke-r19.py
          grep -q 'ANNUAL_API' scripts/run-paradise-shows-live-smoke-r19.py
          echo 'R19 mature-smoke adapter source: PASS'

      - name: Execute preserved mature smoke suite
        if: github.event_name != 'pull_request'
        shell: bash
        run: python scripts/run-paradise-shows-live-smoke-r19.py
