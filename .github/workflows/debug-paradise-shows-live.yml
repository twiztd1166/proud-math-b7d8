name: Paradise Shows public live smoke

on:
  push:
    branches:
      - paradise-shows-public
  pull_request:
    branches:
      - paradise-shows-public
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paradise-shows-public-live-smoke-${{ github.sha }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SITE: https://paradise-shows-public.proud-math-b7d8.pages.dev
      API: https://taxlrlfsobtnbasjcnuf.supabase.co/functions/v1/shows-api
      ANNUAL_API: https://taxlrlfsobtnbasjcnuf.supabase.co/functions/v1/shows-annual-plan-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Authenticate CI app session
        shell: bash
        env:
          PARADISE_SHOWS_CI_ACCESS_CODE: ${{ secrets.PARADISE_SHOWS_CI_ACCESS_CODE }}
        run: |
          set -euo pipefail
          test -n "$PARADISE_SHOWS_CI_ACCESS_CODE" || {
            echo "::error::Missing PARADISE_SHOWS_CI_ACCESS_CODE repository secret."
            exit 1
          }
          response="$(curl --retry 4 --retry-delay 2 --retry-all-errors -fsS \
            -X POST "$API" \
            -H "Origin: $SITE" \
            -H "Content-Type: application/json" \
            --data "$(jq -nc --arg code "$PARADISE_SHOWS_CI_ACCESS_CODE" '{action:"login",accessCode:$code}')")"
          token="$(jq -er '.token' <<<"$response")"
          test -n "$token"
          echo "::add-mask::$token"
          echo "PARADISE_SHOWS_CI_SESSION_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Validate current-publication mature-smoke adapter
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/run-paradise-shows-live-smoke.py scripts/run-paradise-shows-live-smoke-current.py
          grep -q 'CURRENT_RUN' scripts/run-paradise-shows-live-smoke-current.py
          grep -q 'ANNUAL_API' scripts/run-paradise-shows-live-smoke-current.py
          grep -q "assert annual.get('published') is True" scripts/run-paradise-shows-live-smoke-current.py
          if grep -q '83a90da8-d460-413f-8ca4-7735bcbe0f88' scripts/run-paradise-shows-live-smoke-current.py; then
            echo '::error::Current mature-smoke adapter contains an R19 run UUID.'
            exit 1
          fi
          echo 'Current-publication mature-smoke adapter source: PASS'

      - name: Execute preserved mature smoke suite
        shell: bash
        run: python scripts/run-paradise-shows-live-smoke-current.py
