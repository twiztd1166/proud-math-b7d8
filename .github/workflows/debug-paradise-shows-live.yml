          # Cleanup expectations are scoped to each profile's exact year + source family
          # (25%+ family coverage), plus explicit non-participation applicability.
          cleanup_fields=('contact','booth','cost','com','performance','payment','application','coi')
          execution_only={'com','performance','payment','application','coi'}
          def state_for(p,year,field):
              return (((p.get('history_field_states') or {}).get(str(year)) or {}).get(field) or {})
          def supported_fields(p,year):
              raw=((p.get('history_field_support') or {}).get(str(year)) or [])
              return [field for field in cleanup_fields if field in raw]
          def union_supported_fields(year):
              return [field for field in cleanup_fields if any(field in supported_fields(p,year) for p in profiles.values())]
          def all_nonparticipation(p,year):
              n=(((p.get('history_field_states') or {}).get(str(year)) or {}).get('nonparticipation') or {})
              return int(n.get('HAS') or 0)>0 and int(n.get('MISSING') or 0)==0
          def missing_fields(p,year):
              if str(year) not in {str(v) for v in (p.get('history_years') or [])}:
                  return []
              out=[]
              for field in supported_fields(p,year):
                  if all_nonparticipation(p,year) and field in execution_only:
                      continue
                  s=state_for(p,year,field)
                  if int(s.get('VALUE') or 0)==0 and int(s.get('UNKNOWN') or 0)==0 and int(s.get('NA') or 0)==0:
                      out.append(field)
              return out
          def missing_count(p,year):
              return len(missing_fields(p,year))
          expected_union_support={
              2014:['contact','cost','performance'],
              2015:['contact','cost','performance','payment'],
              2016:['performance'],
              2017:['contact','performance','payment'],
              2018:['cost'],
              2019:[],
              2020:[],
              2021:['contact','booth','cost','coi'],
              2022:['contact','booth','cost','coi'],
              2023:['contact','cost','payment'],
              2024:['cost','payment','application'],
              2025:['contact','booth','cost','com','performance'],
              2026:['contact','payment'],
          }
          expected_queue={2014:0,2015:0,2016:0,2017:0,2018:0,2019:0,2020:0,2021:0,2022:0,2023:0,2024:0,2025:0,2026:0}
          for year,expected in expected_union_support.items():
              actual=union_supported_fields(year)
              assert actual == expected, (year,actual,expected)
              queue=sum(1 for p in profiles.values() if missing_count(p,year)>0)
              assert queue == expected_queue[year], (year,queue,expected_queue[year])
