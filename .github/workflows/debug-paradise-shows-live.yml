name: Paradise Shows public live smoke

on:
  push:
    branches:
      - paradise-shows-public
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paradise-shows-public-live-smoke
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SITE: https://paradise-shows-public.proud-math-b7d8.pages.dev
      API: https://taxlrlfsobtnbasjcnuf.supabase.co/functions/v1/shows-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Guard selector collection calls
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib,re
          bad=[]
          for path in sorted(pathlib.Path('public').glob('app-*.js')):
              for number,line in enumerate(path.read_text().splitlines(),1):
                  if re.search(r'(?<!\$)\$\([^)]*\)\.forEach',line):
                      bad.append(f'{path}:{number}: {line.strip()}')
          assert not bad, 'Single-element $() used as a collection:\n'+'\n'.join(bad)
          print('Selector collection guard: PASS')
          PY

      - name: Wait for exact public asset convergence
        shell: bash
        run: |
          set -euo pipefail
          assets=(app.css app-core.js app-shows.js app-control.js app-bind.js app-modals.js manifest.webmanifest sw.js)
          for attempt in $(seq 1 24); do
            ok=1
            for asset in "${assets[@]}"; do
              if ! curl -fsS "$SITE/$asset" -o "/tmp/$asset"; then
                ok=0
                break
              fi
              expected="$(sha256sum "public/$asset" | awk '{print $1}')"
              actual="$(sha256sum "/tmp/$asset" | awk '{print $1}')"
              if [[ "$expected" != "$actual" ]]; then
                echo "Attempt $attempt: $asset not converged"
                ok=0
                break
              fi
            done
            if [[ "$ok" -eq 1 ]]; then
              grep -q 'COI on file' /tmp/app-shows.js
              grep -q 'Explicit no COI' /tmp/app-shows.js
              grep -q 'Explicit unknown' /tmp/app-shows.js
              grep -q 'N/A' /tmp/app-shows.js
              grep -q 'Missing in preserved source' /tmp/app-shows.js
              grep -q 'Historical field availability' /tmp/app-shows.js
              grep -q 'Payment status' /tmp/app-shows.js
              grep -q 'Application status' /tmp/app-shows.js
              grep -q 'Historical field availability follows the Historical Year filter' /tmp/app-shows.js
              grep -q 'Missing fields · choose year' /tmp/app-shows.js
              grep -q 'cleanupSupportedFieldsForYear' /tmp/app-shows.js
              grep -q 'cleanupQueueLine' /tmp/app-shows.js
              grep -q 'cleanup queue' /tmp/app-shows.js
              grep -q '25%+ family coverage' /tmp/app-shows.js
              grep -q 'execution-only fields for explicit non-participation do not count as missing' /tmp/app-shows.js
              grep -q 'data-focus-year' /tmp/app-shows.js
              grep -q 'deepLinkedYear' /tmp/app-core.js
              grep -q "'/year/'" /tmp/app-core.js
              grep -q 'Cleanup checklist' /tmp/app-modals.js
              grep -q 'cleanup year opened first' /tmp/app-modals.js
              grep -q 'The checklist is at the top' /tmp/app-modals.js
              grep -q 'No actionable missing fields' /tmp/app-modals.js
              grep -q '25%+ family coverage' /tmp/app-modals.js
              grep -q 'historyPerformanceStateValue' /tmp/app-modals.js
              grep -q 'Source-labeled performance (not reclassified)' /tmp/app-modals.js
              grep -q 'sourceLabeledPerformanceValue' /tmp/app-modals.js
              grep -q 'historyComStateValue' /tmp/app-modals.js
              grep -q 'historyCostStateValue' /tmp/app-modals.js
              grep -q 'bookingSignal' /tmp/app-shows.js
              grep -q 'CONTRACT SIGNED' /tmp/app-shows.js
              grep -q 'rebookCandidate' /tmp/app-shows.js
              grep -q 'rebookOpportunityCard' /tmp/app-shows.js
              grep -q 'ALL_LIVE_REBOOK' /tmp/app-shows.js
              grep -q 'Verified current / watch' /tmp/app-shows.js
              grep -q 'NEXT_OPPORTUNITY' /tmp/app-shows.js
              grep -q 'Verified current opportunity' /tmp/app-shows.js
              grep -q 'Verified current watch' /tmp/app-shows.js
              grep -q 'Verified current exhibitor listing' /tmp/app-shows.js
              grep -q 'EXHIBITOR LISTED' /tmp/app-shows.js
              grep -q 'CURRENT WATCH' /tmp/app-shows.js
              grep -q 'NEXT-CYCLE WATCH' /tmp/app-shows.js
              grep -q 'current_rebook_opportunity' /tmp/app-shows.js
              grep -q 'related_current_profile_id' /tmp/app-shows.js
              grep -q 'SAME SERIES' /tmp/app-shows.js
              grep -q 'rebookSeries' /tmp/app.css
              grep -q 'profileRelations' /tmp/app-modals.js
              grep -q 'Same organizer series' /tmp/app-modals.js
              grep -q 'Series decision target is tracked under' /tmp/app-shows.js
              grep -q 'Open current series profile' /tmp/app-modals.js
              grep -q 'rebookOpportunityHtml' /tmp/app-modals.js
              grep -q 'Historical booking context' /tmp/app-shows.js
              grep -q 'Next booking step' /tmp/app-shows.js
              grep -q 'latest_preserved_contact' /tmp/app-shows.js
              grep -q 'latest_preserved_cost' /tmp/app-shows.js
              grep -q 'latest_preserved_dates' /tmp/app-shows.js
              grep -q 'Rebook candidates 2013+' /tmp/app-shows.js
              grep -q 'Pursue now' /tmp/app-shows.js
              grep -q 'Watch / next cycle' /tmp/app-shows.js
              grep -q 'ALL_REBOOK_PURSUE' /tmp/app-shows.js
              grep -q 'ALL_REBOOK_WATCH' /tmp/app-shows.js
              grep -q 'ALL_REBOOK_PURSUE' /tmp/app-core.js
              grep -q 'ALL_REBOOK_WATCH' /tmp/app-core.js
              grep -q 'Hold / do not book' /tmp/app-shows.js
              grep -q 'rebookReviewCard' /tmp/app-shows.js
              grep -q 'current_rebook_review' /tmp/app-shows.js
              grep -q 'Current booking review' /tmp/app-shows.js
              grep -q 'rebookReviewHtml' /tmp/app-modals.js
              grep -q 'rebookReview' /tmp/app.css
              grep -q 'Positive-net history 2013+' /tmp/app-shows.js
              grep -q 'historicalReviewCandidate2013' /tmp/app-shows.js
              grep -q 'latest>=2013' /tmp/app-shows.js
              grep -q 'Older historical evidence' /tmp/app-shows.js
              grep -q 'rebookAge' /tmp/app.css
              grep -q 'best specific booth' /tmp/app-shows.js
              grep -q "currentSort:'BOOKING'" /tmp/app-core.js
              grep -q 'Priority to book / review' /tmp/app-shows.js
              grep -q 'Booking recommendation uses the governed Decision/Tier' /tmp/app-shows.js
              grep -q 'boothGuidanceHtml' /tmp/app-modals.js
              grep -q 'Best observed performance placement' /tmp/app-modals.js
              grep -q 'Best observed specific booth' /tmp/app-modals.js
              grep -q 'bookingTiming' /tmp/app-shows.js
              grep -q 'When to act' /tmp/app-shows.js
              grep -q 'best_observed_specific_booth' /tmp/app-shows.js
              grep -q 'correlation only' /tmp/app-modals.js
              grep -Fq "row?.[field]" /tmp/app-modals.js
              grep -Fq "value!==null&&value!==undefined&&String(value).trim()!==''" /tmp/app-modals.js
              grep -Fq "fields.booking_evidence" /tmp/app-modals.js
              grep -Fq "historyBoothValue(x)" /tmp/app-modals.js
              grep -q 'cleanupQueueProfilesForYear' /tmp/app-shows.js
              grep -q 'cleanupQueueProgress' /tmp/app-modals.js
              grep -q 'Back to queue' /tmp/app-modals.js
              grep -q 'cleanupQueueMove' /tmp/app-modals.js
              grep -q 'state.showQuickView=.ALL_MISSING.' /tmp/app-modals.js
              grep -q 'cleanupSupportedFieldsForProfileYear' /tmp/app-shows.js
              grep -q 'exact year + preserved source family' /tmp/app-shows.js
              grep -q 'Supplemental merged evidence is scoped only to rows that actually carry that supplemental source' /tmp/app-shows.js
              grep -q 'Supplemental merged evidence creates an expectation only on rows that actually carry that supplemental source' /tmp/app-modals.js
              grep -q 'Investigation link only' /tmp/app-modals.js
              grep -q 'Check preserved source' /tmp/app-modals.js
              grep -q 'Check annual LP source' /tmp/app-modals.js
              grep -q 'No direct preserved source URL is captured' /tmp/app-modals.js
              grep -q 'Most verified worked years' /tmp/app-shows.js
              grep -q 'Verified worked evidence' /tmp/app-shows.js
              grep -q 'Has verified worked evidence' /tmp/app-shows.js
              grep -q 'Show-history performance' /tmp/app-shows.js
              grep -q 'Has show-history performance' /tmp/app-shows.js
              grep -q 'Annual LP year' /tmp/app-shows.js
              grep -q 'Cumulative LP year' /tmp/app-shows.js
              grep -q 'All history years' /tmp/app-shows.js
              grep -q 'All annual LP years' /tmp/app-shows.js
              grep -q 'All cumulative LP years' /tmp/app-shows.js
              grep -q 'Annual LeadPerfection' /tmp/app-shows.js
              grep -q 'Cumulative LeadPerfection' /tmp/app-shows.js
              grep -q 'Year-by-year evidence' /tmp/app-modals.js
              grep -q 'Active year filter' /tmp/app-modals.js
              grep -q 'selectedEvidenceYears' /tmp/app-modals.js
              grep -q 'Selected evidence years shown first' /tmp/app-modals.js
              echo "Public assets match this exact GitHub commit."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Stable branch URL did not converge to this commit."
          exit 1

      - name: Verify live CORS and operating population
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 4 --retry-delay 2 --retry-all-errors -sS -D /tmp/options.headers -o /tmp/options.body \
            -X OPTIONS "$API" \
            -H "Origin: $SITE" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: content-type"
          grep -Fi "access-control-allow-origin: $SITE" /tmp/options.headers

          curl --retry 4 --retry-delay 2 --retry-all-errors -sS -D /tmp/bootstrap.headers -o /tmp/bootstrap.json \
            -X POST "$API" \
            -H "Origin: $SITE" \
            -H "Content-Type: application/json" \
            --data '{"action":"bootstrap"}'
          grep -Fi "access-control-allow-origin: $SITE" /tmp/bootstrap.headers
          python - <<'PY'
          import json
          x=json.load(open('/tmp/bootstrap.json'))
          assert x.get('ok') is True, x
          assert x.get('version') == 17, x.get('version')
          assert len(x.get('shows') or []) == 36, len(x.get('shows') or [])
          assert len(x.get('payments') or []) == 4, len(x.get('payments') or [])
          current={row.get('mfc_id'):row for row in x.get('shows') or []}
          acs=current['MFC-063']
          assert acs.get('show_status') == 'RECONCILE', acs
          assert acs.get('max_booking_cost') == 2110.5, acs
          assert acs.get('booking_status') == 'CONTRACT SIGNED 2026-09-04 — BOOTH 815 ASSIGNED — $2,110.50 PIF AUTHORIZED; CLEARING UNVERIFIED', acs
          assert acs.get('confirmation') == 'VERIFIED', acs
          assert 'Signed 10x10 contract total $2,110.50' in (acs.get('payment_terms') or ''), acs
          sd=acs.get('source_detail') or {}
          assert sd.get('needs_evidence') == 'PAYMENT PROOF', sd
          assert sd.get('payment_status') == 'AUTHORIZED — CLEARING UNVERIFIED', sd
          assert sd.get('booth_assignment') == '815', sd
          assert sd.get('booth_size') == '10x10', sd
          assert sd.get('contract_total') == 2110.5, sd
          assert sd.get('multi_year_accepted') is True, sd
          assert sd.get('payment_receipt_found') is False, sd
          assert sd.get('payment_clearing') == 'UNVERIFIED', sd
          payments={p.get('payment_id'):p for p in x.get('payments') or []}
          pid='MFC-063|2026|PIF|2026-09-04|2110.50'
          assert pid in payments, payments
          pay=payments[pid]
          assert pay.get('amount') == 2110.5, pay
          assert pay.get('balance') == 2110.5, pay
          assert pay.get('due') == '2026-09-04', pay
          assert pay.get('clearing') == 'UNVERIFIED', pay
          assert pay.get('status') == 'HOLD / REVIEW', pay
          print({'shows':36,'payments':4,'acs_signed_contract':'PASS'})
          PY

          curl --retry 4 --retry-delay 2 --retry-all-errors -sS -o /tmp/catalog.json \
            -X POST "$API" \
            -H "Origin: $SITE" \
            -H "Content-Type: application/json" \
            --data '{"action":"catalog"}'

          curl --retry 4 --retry-delay 2 --retry-all-errors -sS -o /tmp/unlinked.json \
            -X POST "$API" \
            -H "Origin: $SITE" \
            -H "Content-Type: application/json" \
            --data '{"action":"catalogUnlinked"}'

          curl --retry 4 --retry-delay 2 --retry-all-errors -sS -o /tmp/life177.json \
            -X POST "$API" \
            -H "Origin: $SITE" \
            -H "Content-Type: application/json" \
            --data '{"action":"catalogHistory","profileId":"LIFE-177"}'

          curl --retry 4 --retry-delay 2 --retry-all-errors -sS -o /tmp/barrett_review.json \
            -X POST "$API" \
            -H "Origin: $SITE" \
            -H "Content-Type: application/json" \
            --data '{"action":"catalogHistory","profileId":"LIFE-041"}'

          curl --retry 4 --retry-delay 2 --retry-all-errors -sS -o /tmp/ourkids_review.json \
            -X POST "$API" \
            -H "Origin: $SITE" \
            -H "Content-Type: application/json" \
            --data '{"action":"catalogHistory","profileId":"LIFE-029"}'

          curl --retry 4 --retry-delay 2 --retry-all-errors -sS -o /tmp/sarasota_review.json \
            -X POST "$API" \
            -H "Origin: $SITE" \
            -H "Content-Type: application/json" \
            --data '{"action":"catalogHistory","profileId":"LIFE-032"}'

          curl --retry 4 --retry-delay 2 --retry-all-errors -sS -o /tmp/oktoberfest_review.json \
            -X POST "$API" \
            -H "Origin: $SITE" \
            -H "Content-Type: application/json" \
            --data '{"action":"catalogHistory","profileId":"LIFE-061"}'

          curl --retry 4 --retry-delay 2 --retry-all-errors -sS -o /tmp/vero_oktoberfest.json \
            -X POST "$API" \
            -H "Origin: $SITE" \
            -H "Content-Type: application/json" \
            --data '{"action":"catalogHistory","profileId":"HIST-234"}'

          curl --retry 4 --retry-delay 2 --retry-all-errors -sS -o /tmp/2023_brevard.json \
            -X POST "$API" \
            -H "Origin: $SITE" \
            -H "Content-Type: application/json" \
            --data '{"action":"catalogHistory","profileId":"LIFE-084"}'

          curl --retry 4 --retry-delay 2 --retry-all-errors -sS -o /tmp/2023_jumpjam.json \
            -X POST "$API" \
            -H "Origin: $SITE" \
            -H "Content-Type: application/json" \
            --data '{"action":"catalogHistory","profileId":"HIST-217"}'

          curl --retry 4 --retry-delay 2 --retry-all-errors -sS -o /tmp/2023_boca_holiday.json \
            -X POST "$API" \
            -H "Origin: $SITE" \
            -H "Content-Type: application/json" \
            --data '{"action":"catalogHistory","profileId":"HIST-206"}'
          python - <<'PY'
          import json
          x=json.load(open('/tmp/catalog.json'))
          s=x.get('summary') or {}
          assert x.get('ok') is True, x
          assert s.get('profile_count') == 665, s
          assert s.get('occurrence_count') == 1086, s
          assert len(x.get('profiles') or []) == 665
          coverage=x.get('coverage') or {}
          assert coverage.get('profile_rows') == 665, coverage
          assert coverage.get('history_rows') == 1086, coverage
          assert coverage.get('annual_lp_profiled_rows') == 1219, coverage
          assert coverage.get('cumulative_lp_profiled_rows') == 1234, coverage
          u=json.load(open('/tmp/unlinked.json'))
          us=u.get('summary') or {}
          assert coverage.get('annual_lp_profiled_rows') + us.get('annual_rows',0) == 1235, (coverage,us)
          assert coverage.get('cumulative_lp_profiled_rows') + us.get('cumulative_rows',0) == 1251, (coverage,us)
          profiles={p.get('profile_id'):p for p in x.get('profiles') or []}
          boot=json.load(open('/tmp/bootstrap.json'))
          current_ids={row.get('mfc_id') for row in boot.get('shows') or []}
          def has_current_control(p):
              return any(mfc in current_ids for mfc in (p.get('matched_mfc_ids') or []))
          def related_series_current(p):
              return bool(str(p.get('related_current_profile_id') or '').strip())
          def positive_net_2013(p):
              try:
                  net=float(p.get('lifetime_net_volume') or 0)
                  latest=int(p.get('latest_history_year') or 0)
              except (TypeError,ValueError):
                  return False
              return (
                  not has_current_control(p)
                  and not related_series_current(p)
                  and not p.get('current_rebook_opportunity')
                  and net>0
                  and latest>=2013
              )
          historical_2013=[p for p in profiles.values() if positive_net_2013(p)]
          strong_history_2013=[p for p in historical_2013 if p.get('tier') in ('Platinum','Gold')]
          hold_dispositions={'HOLD','RETIRED'}
          strong_2013=[p for p in strong_history_2013 if str((p.get('current_rebook_review') or {}).get('disposition') or '').upper() not in hold_dispositions]
          assert len(historical_2013)==75, len(historical_2013)
          assert len(strong_history_2013)==13, len(strong_history_2013)
          assert len(strong_2013)==9, len(strong_2013)
          reviews={pid:p.get('current_rebook_review') for pid,p in profiles.items() if p.get('current_rebook_review')}
          expected_reviews={
              'LIFE-028':'PURSUE',
              'LIFE-038':'PURSUE',
              'LIFE-039':'WATCH',
              'LIFE-041':'HOLD',
              'LIFE-044':'WATCH',
              'LIFE-056':'WATCH',
              'LIFE-057':'PURSUE',
              'LIFE-071':'WATCH',
              'LIFE-073':'PURSUE',
              'LIFE-075':'WATCH',
              'LIFE-029':'HOLD',
              'LIFE-032':'HOLD',
              'LIFE-061':'HOLD',
          }
          actual_reviews={pid:(review or {}).get('disposition') for pid,review in reviews.items()}
          assert actual_reviews==expected_reviews, actual_reviews
          assert sum(1 for v in actual_reviews.values() if v=='PURSUE')==4, actual_reviews
          assert sum(1 for v in actual_reviews.values() if v=='WATCH')==5, actual_reviews
          assert sum(1 for v in actual_reviews.values() if v=='HOLD')==4, actual_reviews
          held_profiles={pid for pid,disposition in expected_reviews.items() if disposition in hold_dispositions}
          for held in held_profiles:
              assert any(p.get('profile_id')==held for p in strong_history_2013), held
              assert not any(p.get('profile_id')==held for p in strong_2013), held
          for actionable_review in {pid for pid,disposition in expected_reviews.items() if disposition in {'PURSUE','WATCH'}}:
              assert any(p.get('profile_id')==actionable_review for p in strong_2013), actionable_review
          assert '561-330-4777' in reviews['LIFE-028'].get('next_step',''), reviews['LIFE-028']
          assert '$75/day' in reviews['LIFE-028'].get('next_step',''), reviews['LIFE-028']
          assert 'does not list a Bradenton/Palmetto occurrence' in reviews['LIFE-044'].get('rationale',''), reviews['LIFE-044']
          assert '2027 cycle' in reviews['LIFE-039'].get('next_step',''), reviews['LIFE-039']
          assert '$200/$225' in reviews['LIFE-039'].get('next_step',''), reviews['LIFE-039']
          assert '$5,000 2024 paid reference' in reviews['LIFE-071'].get('next_step',''), reviews['LIFE-071']
          assert 'November 2026' in reviews['LIFE-073'].get('next_step',''), reviews['LIFE-073']
          assert '772-337-0049' in reviews['LIFE-073'].get('next_step',''), reviews['LIFE-073']
          assert any(p.get('profile_id')=='LIFE-118' for p in historical_2013), [p.get('profile_id') for p in historical_2013]
          assert next(p for p in historical_2013 if p.get('profile_id')=='LIFE-118').get('latest_history_year')==2015
          expected_series_links={
              'LIFE-005':'LIFE-009',
              'LIFE-010':'LIFE-011',
              'LIFE-035':'LIFE-011',
              'LIFE-016':'LIFE-066',
              'LIFE-020':'LIFE-066',
              'LIFE-047':'LIFE-066',
              'LIFE-049':'LIFE-033',
              'LIFE-043':'LIFE-004',
              'LIFE-069':'LIFE-028',
              'LIFE-053':'LIFE-003',
              'LIFE-045':'LIFE-112',
          }
          for legacy,canonical in expected_series_links.items():
              assert profiles[legacy].get('related_current_profile_id')==canonical, (legacy,profiles[legacy])
              assert profiles[legacy].get('canonical_series_profile_id')==canonical, (legacy,profiles[legacy])
              assert not any(p.get('profile_id')==legacy for p in historical_2013), legacy
          live={pid:p.get('current_rebook_opportunity') for pid,p in profiles.items() if p.get('current_rebook_opportunity')}
          expected_live={'HIST-234','LIFE-007','LIFE-009','LIFE-013','LIFE-014','LIFE-017','LIFE-018','LIFE-030','LIFE-033','LIFE-046','LIFE-054','LIFE-060','LIFE-076','LIFE-077'}
          assert set(live)==expected_live, (set(live),expected_live)
          assert profiles['HIST-234']['current_rebook_opportunity']['opportunity_status']=='SPONSORSHIP_OPEN'
          assert profiles['HIST-234']['current_rebook_opportunity']['event_start']=='2026-10-16'
          assert profiles['HIST-234']['current_rebook_opportunity']['event_end']=='2026-10-18'
          assert '10x10 inline $200' in profiles['HIST-234']['current_rebook_opportunity']['price_text']
          assert 'sold out/waitlist' in profiles['HIST-234']['current_rebook_opportunity']['price_text']
          assert 'commercial & retail businesses should use the Sponsor path' in profiles['HIST-234']['current_rebook_opportunity']['booking_window_text']
          assert 'Latitude-88' in profiles['HIST-234']['current_rebook_opportunity']['contact_text']
          assert profiles['LIFE-007']['current_rebook_opportunity']['opportunity_status']=='APPLICATION_OPEN'
          assert profiles['LIFE-007']['current_rebook_opportunity']['event_start']=='2026-10-17'
          assert profiles['LIFE-009']['current_rebook_opportunity']['opportunity_status']=='APPLICATION_OPEN'
          assert profiles['LIFE-009']['current_rebook_opportunity']['event_start']=='2027-01-02'
          assert profiles['LIFE-009']['current_rebook_opportunity']['event_end']=='2027-01-03'
          assert 'Standard 10x10 $475' in profiles['LIFE-009']['current_rebook_opportunity']['price_text']
          assert 'Premium 10x10 $535' in profiles['LIFE-009']['current_rebook_opportunity']['price_text']
          assert 'Premium Corner 10x10 $635' in profiles['LIFE-009']['current_rebook_opportunity']['price_text']
          assert '25% deposit' in profiles['LIFE-009']['current_rebook_opportunity']['booking_window_text']
          assert profiles['LIFE-009'].get('canonical_series_profile_id')=='LIFE-009', profiles['LIFE-009']
          assert not profiles['LIFE-009'].get('related_current_profile_id'), profiles['LIFE-009']
