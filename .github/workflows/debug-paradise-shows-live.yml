name: Paradise Shows public live smoke

on:
  push:
    branches:
      - paradise-shows-public
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paradise-shows-public-live-smoke
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SITE: https://paradise-shows-public.proud-math-b7d8.pages.dev
      API: https://taxlrlfsobtnbasjcnuf.supabase.co/functions/v1/shows-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Guard selector collection calls
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib,re
          bad=[]
          for path in sorted(pathlib.Path('public').glob('app-*.js')):
              for number,line in enumerate(path.read_text().splitlines(),1):
                  if re.search(r'(?<!\$)\$\([^)]*\)\.forEach',line):
                      bad.append(f'{path}:{number}: {line.strip()}')
          assert not bad, 'Single-element $() used as a collection:\n'+'\n'.join(bad)
          print('Selector collection guard: PASS')
          PY

      - name: Wait for exact public asset convergence
        shell: bash
        run: |
          set -euo pipefail
          assets=(app.css app-core.js app-shows.js app-control.js app-bind.js app-modals.js manifest.webmanifest sw.js)
          for attempt in $(seq 1 24); do
            ok=1
            for asset in "${assets[@]}"; do
              if ! curl -fsS "$SITE/$asset" -o "/tmp/$asset"; then
                ok=0
                break
              fi
              expected="$(sha256sum "public/$asset" | awk '{print $1}')"
              actual="$(sha256sum "/tmp/$asset" | awk '{print $1}')"
              if [[ "$expected" != "$actual" ]]; then
                echo "Attempt $attempt: $asset not converged"
                ok=0
                break
              fi
            done
            if [[ "$ok" -eq 1 ]]; then
              grep -q 'COI on file' /tmp/app-shows.js
              grep -q 'Explicit no COI' /tmp/app-shows.js
              grep -q 'Explicit unknown' /tmp/app-shows.js
              grep -q 'N/A' /tmp/app-shows.js
              grep -q 'Missing in preserved source' /tmp/app-shows.js
              grep -q 'Historical field availability' /tmp/app-shows.js
              grep -q 'Payment status' /tmp/app-shows.js
              grep -q 'Application status' /tmp/app-shows.js
              grep -q 'Historical field availability follows the Historical Year filter' /tmp/app-shows.js
              grep -q 'Missing fields · choose year' /tmp/app-shows.js
              grep -q 'cleanupSupportedFieldsForYear' /tmp/app-shows.js
              grep -q 'cleanupQueueLine' /tmp/app-shows.js
              grep -q 'cleanup queue' /tmp/app-shows.js
              grep -q 'Explicit unknown and N/A are preserved separately and do not count as missing' /tmp/app-shows.js
              grep -q 'Most verified worked years' /tmp/app-shows.js
              grep -q 'Verified worked evidence' /tmp/app-shows.js
              grep -q 'Has verified worked evidence' /tmp/app-shows.js
              grep -q 'Show-history performance' /tmp/app-shows.js
              grep -q 'Has show-history performance' /tmp/app-shows.js
              grep -q 'Annual LP year' /tmp/app-shows.js
              grep -q 'Cumulative LP year' /tmp/app-shows.js
              grep -q 'All history years' /tmp/app-shows.js
              grep -q 'All annual LP years' /tmp/app-shows.js
              grep -q 'All cumulative LP years' /tmp/app-shows.js
              grep -q 'Annual LeadPerfection' /tmp/app-shows.js
              grep -q 'Cumulative LeadPerfection' /tmp/app-shows.js
              grep -q 'Year-by-year evidence' /tmp/app-modals.js
              grep -q 'Active year filter' /tmp/app-modals.js
              grep -q 'selectedEvidenceYears' /tmp/app-modals.js
              grep -q 'Selected evidence years shown first' /tmp/app-modals.js
              echo "Public assets match this exact GitHub commit."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Stable branch URL did not converge to this commit."
          exit 1

      - name: Verify live CORS and operating population
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 4 --retry-delay 2 --retry-all-errors -sS -D /tmp/options.headers -o /tmp/options.body \
            -X OPTIONS "$API" \
            -H "Origin: $SITE" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: content-type"
          grep -Fi "access-control-allow-origin: $SITE" /tmp/options.headers

          curl --retry 4 --retry-delay 2 --retry-all-errors -sS -D /tmp/bootstrap.headers -o /tmp/bootstrap.json \
            -X POST "$API" \
            -H "Origin: $SITE" \
            -H "Content-Type: application/json" \
            --data '{"action":"bootstrap"}'
          grep -Fi "access-control-allow-origin: $SITE" /tmp/bootstrap.headers
          python - <<'PY'
          import json
          x=json.load(open('/tmp/bootstrap.json'))
          assert x.get('ok') is True, x
          assert len(x.get('shows') or []) == 36, len(x.get('shows') or [])
          assert len(x.get('payments') or []) == 3, len(x.get('payments') or [])
          print({'shows':36,'payments':3})
          PY

          curl --retry 4 --retry-delay 2 --retry-all-errors -sS -o /tmp/catalog.json \
            -X POST "$API" \
            -H "Origin: $SITE" \
            -H "Content-Type: application/json" \
            --data '{"action":"catalog"}'

          curl --retry 4 --retry-delay 2 --retry-all-errors -sS -o /tmp/unlinked.json \
            -X POST "$API" \
            -H "Origin: $SITE" \
            -H "Content-Type: application/json" \
            --data '{"action":"catalogUnlinked"}'
          python - <<'PY'
          import json
          x=json.load(open('/tmp/catalog.json'))
          s=x.get('summary') or {}
          assert x.get('ok') is True, x
          assert s.get('profile_count') == 665, s
          assert s.get('occurrence_count') == 1086, s
          assert len(x.get('profiles') or []) == 665
          coverage=x.get('coverage') or {}
          assert coverage.get('profile_rows') == 665, coverage
          assert coverage.get('history_rows') == 1086, coverage
          assert coverage.get('annual_lp_profiled_rows') == 1219, coverage
          assert coverage.get('cumulative_lp_profiled_rows') == 1234, coverage
          u=json.load(open('/tmp/unlinked.json'))
          us=u.get('summary') or {}
          assert coverage.get('annual_lp_profiled_rows') + us.get('annual_rows',0) == 1235, (coverage,us)
          assert coverage.get('cumulative_lp_profiled_rows') + us.get('cumulative_rows',0) == 1251, (coverage,us)
          profiles={p.get('profile_id'):p for p in x.get('profiles') or []}
          # Year cleanup queue semantics: only source-supported fields count as required.
          cleanup_fields=('contact','booth','cost','com','performance','payment','application','coi')
          def state_for(p,year,field):
              return (((p.get('history_field_states') or {}).get(str(year)) or {}).get(field) or {})
          def supported_fields(year):
              out=[]
              for field in cleanup_fields:
                  supported=any(
                      int(state_for(p,year,field).get('VALUE') or 0)
                      + int(state_for(p,year,field).get('UNKNOWN') or 0)
                      + int(state_for(p,year,field).get('NA') or 0) > 0
                      for p in profiles.values()
                  )
                  if supported:
                      out.append(field)
              return out
          def missing_count(p,year,supported):
              if str(year) not in {str(v) for v in (p.get('history_years') or [])}:
                  return 0
              missing=0
              for field in supported:
                  s=state_for(p,year,field)
                  if int(s.get('VALUE') or 0)==0 and int(s.get('UNKNOWN') or 0)==0 and int(s.get('NA') or 0)==0:
                      missing+=1
              return missing
          expected_support={
              2019:[],
              2022:['contact','booth','cost','coi'],
              2024:['cost','payment','application'],
              2025:['contact','booth','cost','com','performance'],
              2026:['contact','booth','payment'],
          }
          expected_queue={2019:0,2022:48,2024:0,2025:19,2026:5}
          for year,expected in expected_support.items():
              actual=supported_fields(year)
              assert actual == expected, (year,actual,expected)
              queue=sum(1 for p in profiles.values() if missing_count(p,year,actual)>0)
              assert queue == expected_queue[year], (year,queue,expected_queue[year])
          # Year-scoped historical completeness semantics.
          assert x.get('version') == 31, x.get('version')
          for p in profiles.values():
              assert isinstance(p.get('history_field_states'), dict), p.get('profile_id')
              assert isinstance(p.get('history_field_totals'), dict), p.get('profile_id')
              assert isinstance(p.get('history_coi_summary'), dict), p.get('profile_id')
          booth_2022=profiles['HIST-015']['history_field_states']['2022']['booth']
          assert booth_2022.get('NA') == 1 and booth_2022.get('VALUE') == 0, booth_2022
          cost_2024=profiles['LIFE-043']['history_field_states']['2024']['cost']
          assert cost_2024.get('UNKNOWN') == 1 and cost_2024.get('VALUE') == 0, cost_2024
          app_2024=profiles['LIFE-081']['history_field_states']['2024']['application']
          assert app_2024.get('NA') == 1 and app_2024.get('VALUE') == 0, app_2024
          com_2025_value=profiles['HIST-052']['history_field_states']['2025']['com']
          com_2025_missing=profiles['HIST-055']['history_field_states']['2025']['com']
          assert com_2025_value.get('VALUE') == 1, com_2025_value
          assert com_2025_missing.get('VALUE') == 0 and com_2025_missing.get('MISSING') == 1, com_2025_missing
          for removed in ('HIST-247','HIST-259','HIST-277','HIST-300','HIST-333','HIST-348','LIFE-098','HIST-369','HIST-132','HIST-014','LIFE-082','HIST-003','HIST-001','HIST-400','LIFE-022','LIFE-042','LIFE-072','LIFE-193','HIST-021','HIST-335','HIST-375','HIST-365','HIST-376','LIFE-113','LIFE-125','HIST-407','HIST-031','HIST-296','HIST-298','HIST-332','HIST-311','HIST-312','HIST-313','HIST-171','HIST-005','HIST-049','LIFE-150','LIFE-078','LIFE-094','HIST-289','HIST-016','HIST-213','LIFE-095','HIST-170','HIST-130','HIST-159','LIFE-026','LIFE-034','LIFE-037','LIFE-051','LIFE-213','HIST-086','LIFE-059','CURRENT-001','CURRENT-002','CURRENT-005','CURRENT-006','HIST-093','HIST-260','HIST-261','HIST-262','HIST-324'):
              assert removed not in profiles, removed
          assert profiles['LIFE-166'].get('history_count') == 2, profiles['LIFE-166']
          assert profiles['LIFE-147'].get('history_count') == 5, profiles['LIFE-147']
          assert profiles['HIST-299'].get('history_count') == 5, profiles['HIST-299']
