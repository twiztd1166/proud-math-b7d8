          fi
          echo "Live browser rendered the operating view without uncaught JavaScript errors."


      - name: Execute show database deep links in fresh headless Chrome
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome" || { echo "Chrome not found"; exit 1; }

          render_view() {
            name="$1"
            url="$2"
            profile="$(mktemp -d)"
            "$chrome" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --user-data-dir="$profile" \
              --virtual-time-budget=25000 \
              --enable-logging=stderr \
              --log-level=0 \
              --dump-dom "$url" >"/tmp/${name}.html" 2>"/tmp/${name}.log"
            if grep -q 'Loading shows…' "/tmp/${name}.html"; then
              echo "::error::$name remained stuck on Loading shows."
              grep -Ei 'uncaught|typeerror|referenceerror|cors|blocked|refused|content security' "/tmp/${name}.log" | tail -80 || true
              exit 1
            fi
            if grep -Ei 'INFO:CONSOLE:.*(Uncaught|TypeError|ReferenceError|SyntaxError)' "/tmp/${name}.log"; then
              echo "::error::$name browser console contains an uncaught JavaScript error."
