      - name: Execute live page in fresh headless Chrome
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome" || { echo "Chrome not found"; exit 1; }
          profile="$(mktemp -d)"
          "$chrome" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --user-data-dir="$profile" \
            --virtual-time-budget=20000 \
            --enable-logging=stderr \
            --log-level=0 \
            --dump-dom "$SITE/" >/tmp/dom.html 2>/tmp/chrome.log

          if grep -q 'Loading shows…' /tmp/dom.html; then
            echo "::error::Rendered DOM remained stuck on Loading shows."
