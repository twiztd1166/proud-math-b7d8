          # Cost semantics: numeric/Free are known cost; DND/admin-only text is not.
          assert profiles['HIST-064'].get('has_cost') is True, profiles['HIST-064']
          assert profiles['HIST-125'].get('has_cost') is False, profiles['HIST-125']
          assert profiles['HIST-148'].get('has_cost') is False, profiles['HIST-148']
          assert profiles['LIFE-043'].get('has_cost') is False, profiles['LIFE-043']
          assert profiles['HIST-015'].get('has_cost') is True, profiles['HIST-015']
          # Verified-worked semantics: only explicit WORKED/ATTENDED evidence counts.
          assert profiles['LIFE-002'].get('worked_year_count') == 4, profiles['LIFE-002']
          assert profiles['HIST-182'].get('worked_year_count') == 1, profiles['HIST-182']
          assert profiles['LIFE-005'].get('worked_year_count') == 0, profiles['LIFE-005']
