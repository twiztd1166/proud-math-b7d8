name: Paradise Shows public live smoke

on:
  push:
    branches:
      - paradise-shows-public
      - hotfix/r6-scope-smoke-contract
      - release/r7-preflight
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paradise-shows-public-live-smoke-${{ github.sha }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SITE: https://paradise-shows-public.proud-math-b7d8.pages.dev
      API: https://taxlrlfsobtnbasjcnuf.supabase.co/functions/v1/shows-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Execute preserved mature smoke suite
        shell: bash
        run: python scripts/run-paradise-shows-live-smoke.py
