          assert profiles['LIFE-009'].get('has_coi') is False, profiles['LIFE-009']
          assert profiles['LIFE-009'].get('has_coi_status') is True, profiles['LIFE-009']
          assert profiles['LIFE-092'].get('has_coi') is False, profiles['LIFE-092']
