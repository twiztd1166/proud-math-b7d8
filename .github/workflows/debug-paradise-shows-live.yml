name: Paradise Shows public live smoke

on:
  push:
    branches:
      - paradise-shows-public
  pull_request:
    branches:
      - paradise-shows-public
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: paradise-shows-public-live-smoke-${{ github.sha }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SITE: https://paradise-shows-public.proud-math-b7d8.pages.dev
      API: https://taxlrlfsobtnbasjcnuf.supabase.co/functions/v1/shows-api
      ANNUAL_API: https://taxlrlfsobtnbasjcnuf.supabase.co/functions/v1/shows-annual-plan-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate current-publication mature-smoke adapter
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/run-paradise-shows-live-smoke.py scripts/run-paradise-shows-live-smoke-current.py
          grep -q 'CURRENT_RUN' scripts/run-paradise-shows-live-smoke-current.py
          grep -q 'ANNUAL_API' scripts/run-paradise-shows-live-smoke-current.py
          grep -q "assert annual.get('published') is True" scripts/run-paradise-shows-live-smoke-current.py
          if grep -q '83a90da8-d460-413f-8ca4-7735bcbe0f88' scripts/run-paradise-shows-live-smoke-current.py; then
            echo '::error::Current mature-smoke adapter contains an R19 run UUID.'
            exit 1
          fi
          echo 'Current-publication mature-smoke adapter source: PASS'

      - name: Mint short-lived GitHub OIDC identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          oidc_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=paradise-shows-ci"
          response="$(curl --retry 4 --retry-delay 2 --retry-all-errors -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$oidc_url")"
          token="$(jq -er '.value' <<<"$response")"
          test -n "$token"
          echo "::add-mask::$token"
          OIDC_TOKEN="$token" python3 - <<'PY'
          import base64,json,os,re
          token=os.environ['OIDC_TOKEN']
          part=token.split('.')[1]
          part += '='*((4-len(part)%4)%4)
          claims=json.loads(base64.urlsafe_b64decode(part))
          assert claims.get('iss')=='https://token.actions.githubusercontent.com', claims
          aud=claims.get('aud')
          assert aud=='paradise-shows-ci' or (isinstance(aud,list) and 'paradise-shows-ci' in aud), claims
          assert claims.get('repository')=='twiztd1166/proud-math-b7d8', claims
          assert str(claims.get('repository_id'))=='950980051', claims
          assert claims.get('runner_environment')=='github-hosted', claims
          assert claims.get('event_name') in {'push','pull_request','workflow_dispatch'}, claims
          workflow_ref=str(claims.get('workflow_ref') or '')
          assert re.match(r'^twiztd1166/proud-math-b7d8/\.github/workflows/(debug-paradise-shows-live|verify-paradise-shows-annual-read)\.yml@refs/',workflow_ref), workflow_ref
          print({'github_oidc_claims':'PASS','repository_id':claims.get('repository_id'),'workflow_ref':workflow_ref,'event_name':claims.get('event_name')})
          PY
          echo "PARADISE_SHOWS_CI_OIDC=$token" >> "$GITHUB_ENV"

      - name: Execute preserved mature smoke suite
        shell: bash
        run: python scripts/run-paradise-shows-live-smoke-current.py
