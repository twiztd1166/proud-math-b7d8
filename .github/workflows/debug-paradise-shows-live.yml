          set -Eeuo pipefail
          trap 'rc=$?; echo "DEEP_LINK_FAILURE line=$LINENO command=$BASH_COMMAND rc=$rc" >&2; exit $rc' ERR
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome" || { echo "Chrome not found"; exit 1; }

          render_view() {
            name="$1"
            url="$2"
            window_size="${3:-1280,900}"
