name: Paradise Shows public live smoke

on:
  push:
    branches:
      - paradise-shows-public
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paradise-shows-public-live-smoke
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SITE: https://paradise-shows-public.proud-math-b7d8.pages.dev
      API: https://taxlrlfsobtnbasjcnuf.supabase.co/functions/v1/shows-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Wait for exact public asset convergence
        shell: bash
        run: |
          set -euo pipefail
          assets=(app.css app-core.js app-shows.js app-control.js app-bind.js app-modals.js manifest.webmanifest sw.js)
          for attempt in $(seq 1 24); do
            ok=1
            for asset in "${assets[@]}"; do
              if ! curl -fsS "$SITE/$asset" -o "/tmp/$asset"; then
                ok=0
                break
              fi
              expected="$(sha256sum "public/$asset" | awk '{print $1}')"
              actual="$(sha256sum "/tmp/$asset" | awk '{print $1}')"
              if [[ "$expected" != "$actual" ]]; then
                echo "Attempt $attempt: $asset not converged"
                ok=0
                break
              fi
            done
            if [[ "$ok" -eq 1 ]]; then
              echo "Public assets match this exact GitHub commit."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Stable branch URL did not converge to this commit."
          exit 1

      - name: Verify live CORS and operating population
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -D /tmp/options.headers -o /tmp/options.body \
            -X OPTIONS "$API" \
            -H "Origin: $SITE" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: content-type"
          grep -Fi "access-control-allow-origin: $SITE" /tmp/options.headers

          curl -sS -D /tmp/bootstrap.headers -o /tmp/bootstrap.json \
            -X POST "$API" \
            -H "Origin: $SITE" \
            -H "Content-Type: application/json" \
            --data '{"action":"bootstrap"}'
          grep -Fi "access-control-allow-origin: $SITE" /tmp/bootstrap.headers
          python - <<'PY'
          import json
          x=json.load(open('/tmp/bootstrap.json'))
          assert x.get('ok') is True, x
          assert len(x.get('shows') or []) == 36, len(x.get('shows') or [])
          assert len(x.get('payments') or []) == 3, len(x.get('payments') or [])
          print({'shows':36,'payments':3})
          PY

          curl -sS -o /tmp/catalog.json \
            -X POST "$API" \
            -H "Origin: $SITE" \
            -H "Content-Type: application/json" \
            --data '{"action":"catalog"}'
          python - <<'PY'
          import json
          x=json.load(open('/tmp/catalog.json'))
          s=x.get('summary') or {}
          assert x.get('ok') is True, x
          assert s.get('profile_count') == 612, s
          assert s.get('occurrence_count') == 810, s
          assert len(x.get('profiles') or []) == 612
          print({'profiles':612,'evidence_records':810})
          PY

          curl -sS -o /tmp/sff.json \
            -X POST "$API" \
            -H "Origin: $SITE" \
            -H "Content-Type: application/json" \
            --data '{"action":"catalogHistory","profileId":"LIFE-002"}'
          curl -sS -o /tmp/acs.json \
            -X POST "$API" \
            -H "Origin: $SITE" \
            -H "Content-Type: application/json" \
            --data '{"action":"catalogHistory","profileId":"LIFE-004"}'
          python - <<'PY'
          import json
          sff=json.load(open('/tmp/sff.json'))
          acs=json.load(open('/tmp/acs.json'))
          assert sff.get('ok') is True, sff
          assert acs.get('ok') is True, acs
          sff19=[h for h in sff.get('history') or [] if h.get('source_year') == 2019 and h.get('source_kind') == 'ARCHIVED_SCHEDULE']
          assert sff19, sff
          years={h.get('source_year') for h in acs.get('history') or [] if h.get('source_kind') in ('ARCHIVED_SCHEDULE','SHOW_COST_REGISTER')}
          assert {2018,2019}.issubset(years), years
          print({'south_florida_fair_2019_records':len(sff19),'acs_archive_years':sorted(years)})
          PY

      - name: Execute live page in fresh headless Chrome
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome" || { echo "Chrome not found"; exit 1; }
          profile="$(mktemp -d)"
          "$chrome" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --user-data-dir="$profile" \
            --virtual-time-budget=20000 \
            --enable-logging=stderr \
            --log-level=0 \
            --dump-dom "$SITE/" >/tmp/dom.html 2>/tmp/chrome.log

          if grep -q 'Loading shows…' /tmp/dom.html; then
            echo "::error::Rendered DOM remained stuck on Loading shows."
            grep -Ei 'uncaught|typeerror|referenceerror|cors|blocked|refused|content security' /tmp/chrome.log | tail -80 || true
            exit 1
          fi
          grep -q 'Work today / this week' /tmp/dom.html
          if grep -Ei 'INFO:CONSOLE:.*(Uncaught|TypeError|ReferenceError)' /tmp/chrome.log; then
            echo "::error::Browser console contains an uncaught JavaScript error."
            exit 1
          fi
          echo "Live browser rendered the operating view without uncaught JavaScript errors."
