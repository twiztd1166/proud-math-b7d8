name: Paradise Shows cumulative LP PR proof

on:
  pull_request:
    branches:
      - paradise-shows-public
    paths:
      - public/app-modals.js
      - .github/workflows/debug-paradise-shows-live.yml
      - .github/workflows/verify-paradise-shows-cumulative-pr.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SITE: https://paradise-shows-public.proud-math-b7d8.pages.dev
      API: https://taxlrlfsobtnbasjcnuf.supabase.co/functions/v1/shows-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Syntax-check cumulative UI
        shell: bash
        run: |
          set -euo pipefail
          node --check public/app-modals.js
          grep -Fq 'LeadPerfection annual-period performance' public/app-modals.js
          grep -Fq 'LeadPerfection cumulative / lifetime attribution' public/app-modals.js
          grep -Fq 'cumulativePerformance' public/app-modals.js
          grep -Fq 'annual_values_overwritten' .github/workflows/debug-paradise-shows-live.yml

      - name: Verify READY cumulative data through live API
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -o /tmp/catalog.json \
            -X POST "$API" \
            -H "Origin: $SITE" \
            -H "Content-Type: application/json" \
            --data '{"action":"catalog"}'

          curl -fsS -o /tmp/broward.json \
            -X POST "$API" \
            -H "Origin: $SITE" \
            -H "Content-Type: application/json" \
            --data '{"action":"catalogHistory","profileId":"LIFE-010"}'

          python - <<'PY'
          import json

          catalog=json.load(open('/tmp/catalog.json'))
          assert catalog.get('ok') is True, catalog
          summary=catalog.get('summary') or {}
          assert summary.get('id') == '7aec048e-f0ba-49af-9313-e1ed0bf159dc', summary
          assert summary.get('profile_count') == 655, summary
          assert summary.get('occurrence_count') == 1086, summary
          cumulative=(summary.get('source_summary') or {}).get('cumulative_lifetime_layer') or {}
          expected={
              'rows':1251,
              'unresolved':0,
              'exact_unchanged':1147,
              'matured':84,
              'cumulative_only':20,
              'gross_close_delta':108,
              'gross_volume_delta':1850586,
              'net_close_delta':82,
              'net_volume_delta':1362328,
          }
          for key,value in expected.items():
              assert cumulative.get(key) == value, (key,cumulative)
          assert cumulative.get('annual_values_overwritten') is False, cumulative
          assert cumulative.get('annual_clone_integrity') == 'PASS', cumulative
          assert cumulative.get('validation') == 'PASS', cumulative

          broward=json.load(open('/tmp/broward.json'))
          assert broward.get('ok') is True, broward
          annual=next((x for x in broward.get('performance') or [] if x.get('evidence_id') == 'LP2015-007'), None)
          lifetime=next((x for x in broward.get('cumulativePerformance') or [] if x.get('evidence_id') == 'LPCUM-2015-0007'), None)
          assert annual and lifetime, broward
          assert annual.get('close_sales_count') == 1
          assert float(annual.get('close_sales_volume')) == 2420
          assert lifetime.get('raw_count') == 91
          assert lifetime.get('gross_close_count') == 12
          assert float(lifetime.get('gross_close_volume')) == 125738
          assert lifetime.get('net_close_count') == 10
          assert float(lifetime.get('net_close_volume')) == 92473
          assert lifetime.get('comparison_status') == 'MATURED'
          assert lifetime.get('annual_evidence_id') == 'LP2015-007'
          print({'catalog':'PASS','broward_dual_layer':'PASS'})
          PY
