name: Paradise Shows iOS native verifier

on:
  pull_request:
    paths:
      - 'ios/**'
      - 'public/**'
      - 'src/**'
      - 'scripts/prepare-ios-app.mjs'
      - 'scripts/generate-ios-assets.py'
      - 'package.json'
      - '.github/workflows/verify-paradise-shows-ios.yml'
  push:
    branches:
      - paradise-shows-public
    paths:
      - 'ios/**'
      - 'public/**'
      - 'src/**'
      - 'scripts/prepare-ios-app.mjs'
      - 'scripts/generate-ios-assets.py'
      - 'package.json'
      - '.github/workflows/verify-paradise-shows-ios.yml'

jobs:
  verify-ios:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify Apple toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -version | grep -Eq '^Xcode 26\.'
          node --version
          python3 --version

      - name: Build web bundle and native assets
        run: |
          set -euo pipefail
          npm ci
          npm run ios:prepare
          test -f ios/App/App/public/index.html
          test -f ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png

      - name: Validate native metadata
        run: |
          set -euo pipefail
          plutil -lint ios/App/App/Info.plist
          plutil -lint ios/App/App/PrivacyInfo.xcprivacy
          grep -q 'com.paradiseexteriors.shows' ios/App/App.xcodeproj/project.pbxproj
          grep -q 'paradiseshows' ios/App/App/Info.plist
          grep -q 'PrivacyInfo.xcprivacy' ios/App/App.xcodeproj/project.pbxproj
          grep -q 'NativeBridgeViewController.swift' ios/App/App.xcodeproj/project.pbxproj

      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App

      - name: Compile iPhone simulator build
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
