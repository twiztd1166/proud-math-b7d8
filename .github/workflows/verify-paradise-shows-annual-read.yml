      - name: Validate native metadata
        run: |
          set -euo pipefail
          plutil -lint ios/App/App/Info.plist
          plutil -lint ios/App/App/PrivacyInfo.xcprivacy
          grep -q 'com.paradiseexteriors.shows' ios/App/App.xcodeproj/project.pbxproj
