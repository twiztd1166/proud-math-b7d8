name: Paradise Shows governed annual-read verifier

on:
  push:
    branches:
      - paradise-shows-public
  pull_request:
    branches:
      - paradise-shows-public
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-governed-annual-read:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SITE: https://paradise-shows-public.proud-math-b7d8.pages.dev
      API: https://taxlrlfsobtnbasjcnuf.supabase.co/functions/v1/shows-api
      ANNUAL_API: https://taxlrlfsobtnbasjcnuf.supabase.co/functions/v1/shows-annual-plan-api
      HISTORY_API: https://taxlrlfsobtnbasjcnuf.supabase.co/functions/v1/shows-history-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify revision-neutral release source contract
        shell: bash
        run: |
          set -euo pipefail
          node --check public/app-annual-api.js
          node --check public/app-annual-scope.js
          node --check scripts/verify-annual-operational-actions.mjs
          node scripts/verify-annual-operational-actions.mjs
          grep -q 'functions/v1/shows-annual-plan-api' public/app-annual-api.js
          grep -q 'operational_action_code' supabase/functions/shows-annual-plan-api/index.ts
          grep -q 'operational_contact_email' supabase/functions/shows-annual-plan-api/index.ts
          grep -q 'operational_contact_cc' supabase/functions/shows-annual-plan-api/index.ts
          grep -q 'DIRECT_PLAN_PROFILE' public/app-annual-scope.js
          grep -q 'estimated_start' public/app-annual-scope.js
          grep -Eq 'paradise-shows-public-v[0-9]+' public/sw.js
          python -m py_compile scripts/run-paradise-shows-live-smoke.py scripts/run-paradise-shows-live-smoke-current.py
          echo 'Revision-neutral release source contract: PASS'

      - name: Wait for governed annual-read assets and wiring
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            if curl -fsS -H 'Cache-Control: no-cache' "$SITE/app-annual-api.js?release=${GITHUB_SHA}" -o /tmp/app-annual-api.js \
              && curl -fsS -H 'Cache-Control: no-cache' "$SITE/app-annual-scope.js?release=${GITHUB_SHA}" -o /tmp/app-annual-scope.js \
              && curl -fsS -H 'Cache-Control: no-cache' "$SITE/sw.js?release=${GITHUB_SHA}" -o /tmp/sw.js \
              && curl -fsS -H 'Cache-Control: no-cache' "$SITE/?release=${GITHUB_SHA}" -o /tmp/index.html; then
              annual_expected="$(sha256sum public/app-annual-api.js | awk '{print $1}')"
              annual_actual="$(sha256sum /tmp/app-annual-api.js | awk '{print $1}')"
              scope_expected="$(sha256sum public/app-annual-scope.js | awk '{print $1}')"
              scope_actual="$(sha256sum /tmp/app-annual-scope.js | awk '{print $1}')"
              sw_expected="$(sha256sum public/sw.js | awk '{print $1}')"
              sw_actual="$(sha256sum /tmp/sw.js | awk '{print $1}')"
              if [[ "$annual_expected" == "$annual_actual" ]] \
                && [[ "$scope_expected" == "$scope_actual" ]] \
                && [[ "$sw_expected" == "$sw_actual" ]] \
                && grep -q 'app-annual-api.js' /tmp/index.html \
                && grep -q 'app-annual-scope.js' /tmp/index.html \
                && grep -q 'app-annual-api.js' /tmp/sw.js \
                && grep -q 'app-annual-scope.js' /tmp/sw.js; then
                echo 'Governed annual-read assets/wiring: PASS'
                exit 0
              fi
            fi
            echo "Attempt $attempt: governed annual-read deployment not converged"
            sleep 5
          done
          echo '::error::Stable site did not converge to governed annual-read assets.'
          exit 1

      - name: Verify current published annual-plan and historical contracts
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsS -o /tmp/annual.json \
            -X POST "$ANNUAL_API" -H "Origin: $SITE" -H 'Content-Type: application/json' \
            --data '{"action":"annualPlan","year":2027}'
          CURRENT_RUN="$(jq -er '.run.id' /tmp/annual.json)"
          explicit_payload="$(jq -nc --arg runId "$CURRENT_RUN" '{action:"annualPlan",year:2027,runId:$runId}')"
          history_payload="$(jq -nc --arg runId "$CURRENT_RUN" '{year:2027,runId:$runId,allowLatestAuditPreview:true}')"
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsS -o /tmp/explicit.json \
            -X POST "$ANNUAL_API" -H "Origin: $SITE" -H 'Content-Type: application/json' \
            --data "$explicit_payload"
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsS -o /tmp/history.json \
            -X POST "$HISTORY_API" -H "Origin: $SITE" -H 'Content-Type: application/json' \
            --data "$history_payload"
          node <<'NODE'
          const fs=require('fs'),assert=require('assert');
          const annual=JSON.parse(fs.readFileSync('/tmp/annual.json','utf8'));
          const explicit=JSON.parse(fs.readFileSync('/tmp/explicit.json','utf8'));
          const history=JSON.parse(fs.readFileSync('/tmp/history.json','utf8'));

          assert.equal(annual.ok,true,annual);
          assert.equal(annual.version,3,annual);
          assert.equal(annual.year,2027,annual);
          assert.equal(annual.requested_run_id,null,annual);
          assert.equal(annual.published,true,annual);
          assert.ok(annual.publication?.run_id,annual.publication);
          assert.equal(annual.run?.id,annual.publication.run_id,annual);
          assert.equal(annual.run?.status,'READY',annual.run);

          const rows=annual.rows||[];
          assert.ok(rows.length>0,'published plan has no rows');
          assert.equal(rows.length,Number(annual.run?.row_count),annual.run);
          assert.equal(rows.filter(row=>!String(row.geographic_region||'').trim()).length,0,'missing geographic_region');
          assert.equal(rows.filter(row=>!String(row.planning_category||'').trim()).length,0,'missing planning_category');
          assert.equal(rows.filter(row=>row.estimated_start&&(!row.estimated_end||!row.estimate_confidence||!row.estimate_basis)).length,0,'incomplete estimate structure');
          assert.equal(rows.filter(row=>!['PURSUE','WATCH','RESEARCH_IDENTITY'].includes(String(row.plan_decision||''))).length,0,'unknown plan_decision');
          assert.equal(rows.filter(row=>!['HIGH','MEDIUM','LOW'].includes(String(row.priority||''))).length,0,'unknown priority');

          const computed={
            rows:rows.length,
            profiles:new Set(rows.map(row=>row.profile_id)).size,
            pursue:rows.filter(row=>row.plan_decision==='PURSUE').length,
            watch:rows.filter(row=>row.plan_decision==='WATCH').length,
            research:rows.filter(row=>row.plan_decision==='RESEARCH_IDENTITY').length,
            exact:rows.filter(row=>row.event_start).length,
            expected:rows.filter(row=>!row.event_start&&row.expected_month!=null).length,
            estimated:rows.filter(row=>row.estimated_start).length,
            broad_estimated:rows.filter(row=>row.estimated_start&&row.expected_month==null).length,
            conflicts:rows.filter(row=>String(row.conflict_notes||'').trim()).length,
          };
          assert.deepEqual({
            rows:annual.summary?.rows,profiles:annual.summary?.profiles,pursue:annual.summary?.pursue,
            watch:annual.summary?.watch,research:annual.summary?.research,exact:annual.summary?.exact,
            expected:annual.summary?.expected,estimated:annual.summary?.estimated,
            broad_estimated:annual.summary?.broad_estimated,conflicts:annual.summary?.conflicts,
          },computed);

          const planningRows=rows.filter(row=>!String(row.publication_status||'').toUpperCase().includes('DUPLICATE_SUPPRESSED'));
          assert.equal(planningRows.length,330,'canonical planning-row count');
          const byPlanId=Object.fromEntries(rows.map(row=>[row.plan_id,row]));
          const actionCount=code=>planningRows.filter(row=>row.operational_action_code===code).length;
          assert.equal(actionCount('REVIEW_APPLICATION'),5,'visible review-application count');
          assert.equal(actionCount('CONTACT_ORGANIZER'),58,'visible contact-organizer count');
          assert.equal(actionCount('MONITOR_RELEASE'),130,'visible monitor-release count');
          assert.equal(actionCount('VERIFY_TERMS'),47,'visible verify-terms count');
          assert.equal(actionCount('REVIEW_DECIDE'),87,'visible review-decide count');
          assert.equal(actionCount('SIGNER_REVIEW'),2,'visible signer-review count');
          assert.equal(actionCount('VERIFY_PAYMENT'),1,'visible verify-payment count');
          const contactRows=planningRows.filter(row=>row.operational_action_code==='CONTACT_ORGANIZER');
          assert.equal(
            contactRows.filter(row=>!String(row.operational_contact_email||'').trim()&&!String(row.operational_contact_phone||'').trim()).length,
            0,
            'contact-organizer row missing direct channel'
          );
          const maxConfidenceActionLinkAudit=rows.filter(row=>row.operational_action_source==='2027_MAX_CONFIDENCE_ACTION_LINK_AUDIT_2026_10_02');
          assert.equal(maxConfidenceActionLinkAudit.length,8,'max-confidence action-link audit row count');
          const maxConfidenceActionCodes=Object.fromEntries(maxConfidenceActionLinkAudit.map(row=>[row.plan_id,row.operational_action_code]));
          assert.deepEqual(maxConfidenceActionCodes,{
            '2027-PROSPECT-POMPANO-NAUTICAL-FLEA':'CONTACT_ORGANIZER',
            '2027-LIFE-112-PRIMARY':'SIGNER_REVIEW',
            '2027-PROSPECT-MELBOURNE-ART-FEST-PUBWATCH':'CONTACT_ORGANIZER',
            '2027-PROSPECT-THUNDER-COCOA-PUBWATCH':'MONITOR_RELEASE',
            '2027-PROSPECT-RARE-PLANT-MIAMI-PUBWATCH':'CONTACT_ORGANIZER',
            '2027-LIFE-186-PRIMARY':'MONITOR_RELEASE',
            '2027-PROSPECT-TITUSVILLE-JULY4-PUBWATCH':'VERIFY_TERMS',
            '2027-PROSPECT-VERO-PATRIOT-GUN-SHOW':'CONTACT_ORGANIZER',
          });
          assert.equal(maxConfidenceActionLinkAudit.filter(row=>row.operational_cleanup_version!=='2027_ACTION_LINK_AUDIT_V1').length,0,'action-link audit cleanup version drift');
          assert.equal(maxConfidenceActionLinkAudit.filter(row=>!String(row.operational_guard||'').trim()).length,0,'action-link audit guard missing');
          assert.equal(maxConfidenceActionLinkAudit.filter(row=>!Array.isArray(row.source_refs)||row.source_refs.length===0).length,0,'action-link audit source missing');
          const auditedContactRows=maxConfidenceActionLinkAudit.filter(row=>row.operational_action_code==='CONTACT_ORGANIZER');
          assert.equal(auditedContactRows.length,4,'action-link audit contact-row count');
          assert.equal(auditedContactRows.filter(row=>!String(row.operational_contact_email||'').trim()&&!String(row.operational_contact_phone||'').trim()).length,0,'action-link audit contact row missing direct channel');
          assert.equal(byPlanId['2027-PROSPECT-MELBOURNE-ART-FEST-PUBWATCH']?.operational_contact_email,'sponsors@melbournearts.org');
          assert.equal(byPlanId['2027-PROSPECT-POMPANO-NAUTICAL-FLEA']?.operational_contact_email,'info@nauticalfleamarket.com');
          assert.equal(byPlanId['2027-PROSPECT-RARE-PLANT-MIAMI-PUBWATCH']?.operational_contact_email,'info@rareplantfestival.com');
          assert.equal(byPlanId['2027-PROSPECT-VERO-PATRIOT-GUN-SHOW']?.operational_contact_email,'Vendors@PatriotShows.com');
          const rarePlant=byPlanId['2027-PROSPECT-RARE-PLANT-MIAMI-PUBWATCH'];
          assert.equal(rarePlant?.event_start,null,rarePlant);
          assert.equal(rarePlant?.estimated_start,null,rarePlant);
          assert.equal(rarePlant?.estimated_end,null,rarePlant);
          assert.equal(rarePlant?.expected_month,5,rarePlant);
          assert.match(String(rarePlant?.expected_window_text||''),/May 2027/i);
          assert.match(String(rarePlant?.expected_window_text||''),/exact dates: TBD/i);

          const applicationRouteCleanup=rows.filter(row=>row.operational_action_source==='2027_APPLICATION_ROUTE_CLEANUP_V2');
          assert.equal(applicationRouteCleanup.length,6,'application route cleanup row count');

          const directReviewRoutes={
            '2027-LIFE-128-PRIMARY':'https://pci.jotform.com/form/261183948616163',
            '2027-LIFE-062-LEGACY-RESEARCH':'https://rpxfshbn.formester.com/f/aM5qyqLAq',
            '2027-HIST-122-PRIMARY':'https://www.eventeny.com/events/vendor/?id=50653',
            '2027-PROSPECT-PARKLAND-EVENT-PORTFOLIO-PUBWATCH':'https://www.cityofparkland.org/DocumentCenter/View/23574/2025-2026-Sponsorship-Application',
          };
          for(const [planId,url] of Object.entries(directReviewRoutes)){
            const row=byPlanId[planId];
            assert.ok(row,{missing_plan_id:planId});
            assert.equal(row.operational_action_code,'REVIEW_APPLICATION',row);
            assert.equal((row.source_refs||[])[0],url,row);
            assert.equal(row.operational_action_source,'2027_APPLICATION_ROUTE_CLEANUP_V2',row);
          }
          const martin=byPlanId['2027-LIFE-018-PRIMARY'];
          assert.equal(martin?.operational_action_code,'REVIEW_APPLICATION',martin);
          assert.equal(
            (martin?.source_refs||[])[0],
            'https://www.professionalshowmanagement.com/_files/ugd/bedf1d_d6b96d94104749f6af25084941733196.pdf',
            martin
          );
          assert.deepEqual(
            planningRows.filter(row=>row.operational_action_code==='REVIEW_APPLICATION').map(row=>row.plan_id).sort(),
            [
              '2027-HIST-122-PRIMARY',
              '2027-LIFE-018-PRIMARY',
              '2027-LIFE-062-LEGACY-RESEARCH',
              '2027-LIFE-128-PRIMARY',
              '2027-PROSPECT-PARKLAND-EVENT-PORTFOLIO-PUBWATCH',
            ].sort()
          );

          const carnaval=byPlanId['2027-PROSPECT-CARNAVAL-ON-MILE'];
          assert.equal(carnaval?.operational_action_code,'CONTACT_ORGANIZER',carnaval);
          assert.equal(carnaval?.operational_contact_email,'Nrroig@kiwanislittlehavana.org',carnaval);
          assert.equal((carnaval?.source_refs||[])[0],'https://carnavalmiami.com/sponsorship-opportunities/',carnaval);
          assert.match(String(carnaval?.next_action||''),/Create email draft/i);
          assert.match(String(carnaval?.operational_guard||''),/corporate sponsorship lane/i);

          const npb=byPlanId['2027-LPONLY-2025-038-NPB-HERITAGE'];
          assert.equal(npb?.operational_action_code,'MONITOR_RELEASE',npb);
          assert.equal((npb?.source_refs||[])[0],'https://www.village-npb.org/240/Heritage-Festival',npb);
          assert.match(String(npb?.next_action||''),/Monitor 2027 Business Expo application release/i);
          assert.match(String(npb?.operational_guard||''),/application is not yet open/i);

          const decisionRank={PURSUE:0,WATCH:1,RESEARCH_IDENTITY:2};
          const priorityRank={HIGH:0,MEDIUM:1,LOW:2};
          const planningDate=row=>{
            if(row.event_start)return String(row.event_start);
            if(row.estimated_start)return String(row.estimated_start);
            const m=Number(row.expected_month);
            if(Number.isInteger(m)&&m>=1&&m<=12)return `2027-${String(m).padStart(2,'0')}-15`;
            if(row.schedule_type==='ON_DEMAND')return '2027-12-30';
            return '9999-12-31';
          };
          const compare=(a,b)=>planningDate(a).localeCompare(planningDate(b))
            ||(decisionRank[a.plan_decision]??9)-(decisionRank[b.plan_decision]??9)
            ||(priorityRank[a.priority]??9)-(priorityRank[b.priority]??9)
            ||String(a.canonical_event||'').localeCompare(String(b.canonical_event||''))
            ||String(a.plan_id||'').localeCompare(String(b.plan_id||''));
          for(let i=1;i<rows.length;i++)assert.ok(compare(rows[i-1],rows[i])<=0,{i,previous:rows[i-1].plan_id,current:rows[i].plan_id});

          const note=row=>Boolean(String(row.conflict_notes||'').trim());
          const fixed=rows.filter(row=>row.schedule_type==='FIXED_EVENT'&&row.event_start);
          const fixedPairs=[];
          for(let i=0;i<fixed.length;i++)for(let j=i+1;j<fixed.length;j++){
            const a=fixed[i],b=fixed[j],ae=a.event_end||a.event_start,be=b.event_end||b.event_start;
            if(a.event_start<=be&&b.event_start<=ae)fixedPairs.push([a,b]);
          }
          assert.equal(fixedPairs.filter(([a,b])=>!note(a)||!note(b)).length,0,'uncontrolled fixed overlap');
          const fixedPursue=fixedPairs.filter(([a,b])=>a.plan_decision==='PURSUE'&&b.plan_decision==='PURSUE');
          assert.equal(fixedPursue.filter(([a,b])=>!note(a)||!note(b)).length,0,'uncontrolled fixed PURSUE overlap');

          const day=iso=>Math.floor(Date.parse(`${iso}T00:00:00Z`)/86400000);
          const window=row=>{
            if(row.schedule_type==='FIXED_EVENT'&&row.event_start)return {row,start:row.event_start,end:row.event_end||row.event_start,kind:'EXACT'};
            if(row.estimated_start&&row.estimated_end&&['HIGH','MEDIUM'].includes(row.estimate_confidence)
              && day(row.estimated_end)-day(row.estimated_start)<=6)
              return {row,start:row.estimated_start,end:row.estimated_end,kind:'ESTIMATE'};
            return null;
          };
          const windows=rows.map(window).filter(Boolean),estimatePursue=[];
          for(let i=0;i<windows.length;i++)for(let j=i+1;j<windows.length;j++){
            const a=windows[i],b=windows[j];
            if(a.start<=b.end&&b.start<=a.end&&a.row.plan_decision==='PURSUE'&&b.row.plan_decision==='PURSUE'&&(a.kind==='ESTIMATE'||b.kind==='ESTIMATE')) estimatePursue.push([a,b]);
          }
          assert.equal(estimatePursue.filter(([a,b])=>!note(a.row)||!note(b.row)).length,0,'uncontrolled estimate-driven PURSUE overlap');

          assert.equal(explicit.ok,true,explicit);
          assert.equal(explicit.version,3,explicit);
          assert.equal(explicit.requested_run_id,annual.run.id,explicit);
          assert.equal(explicit.run?.id,annual.run.id,explicit.run);
          assert.equal(explicit.published,true,explicit);
          assert.equal(explicit.publication?.run_id,annual.run.id,explicit.publication);
          assert.deepEqual(explicit.summary,annual.summary);

          assert.equal(history.ok,true,history);
          assert.equal(history.version,1,history);
          assert.equal(history.requested_run?.id,annual.run.id,history.requested_run);
          assert.equal(history.run?.id,annual.run.id,history.run);
          assert.equal(history.run?.status,'READY',history.run);
          assert.equal(Boolean(history.preview),false,history);
          const historyRows=history.rows||[];
          assert.ok(historyRows.length>0,'current publication has no historical audit ledger');
          assert.equal(historyRows.filter(row=>!Array.isArray(row.source_refs)||row.source_refs.length===0).length,0,'historical row missing source_refs');
          const direct=historyRows.filter(row=>/^DIRECT_R\d+_PROFILE$/.test(String(row.classification||''))).length;
          const active=historyRows.filter(row=>row.classification==='VERIFIED_CANONICAL_ROUTE_ACTIVE').length;
          const staged=historyRows.filter(row=>row.classification==='VERIFIED_CANONICAL_ROUTE_STAGED').length;
          const gaps=historyRows.length-direct-active-staged;
          assert.equal(Number(history.summary?.rows),historyRows.length,history.summary);
          assert.equal(Number(history.summary?.direct_profiles),direct,history.summary);
          assert.equal(Number(history.summary?.active_routes),active,history.summary);
          assert.equal(Number(history.summary?.staged_routes),staged,history.summary);
          assert.equal(Number(history.summary?.gap_dispositions),gaps,history.summary);

          console.log({
            published_run:annual.run.id,
            summary:computed,
            fixed_pairs:fixedPairs.length,
            fixed_pursue_pairs:fixedPursue.length,
            estimate_driven_pursue_pairs:estimatePursue.length,
            history_rows:historyRows.length,
          });
          console.log('Current published annual-plan + historical contract: PASS');
          NODE

  verify-ios-native:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify Apple toolchain
        run: |
          set -euo pipefail
          xcode_version="$(xcodebuild -version)"
          printf '%s\n' "$xcode_version"
          grep -Eq '^Xcode 26\.' <<<"$xcode_version"
          node --version
          python3 --version

      - name: Verify live native-origin CORS
        run: |
          set -euo pipefail
          for fn in shows-api shows-annual-plan-api shows-history-api; do
            headers="$(mktemp)"
            curl -fsS -D "$headers" -o /dev/null -X OPTIONS \
              "https://taxlrlfsobtnbasjcnuf.supabase.co/functions/v1/$fn" \
              -H 'Origin: capacitor://localhost' \
              -H 'Access-Control-Request-Method: POST' \
              -H 'Access-Control-Request-Headers: content-type'
            grep -iEq '^access-control-allow-origin: *capacitor://localhost\r?$' "$headers"
            rm -f "$headers"
          done

      - name: Validate web/native source before packaging
        run: |
          set -euo pipefail
          node --check public/app-core.js
          node --check public/app-annual-api.js
          node --check public/app-shows.js
          node --check public/app-annual-scope.js
          node --check public/app-control.js
          node --check public/app-bind.js
          node --check public/app-modals.js
          grep -q 'exact: "8.5.0"' ios/App/CapApp-SPM/Package.swift
          ! grep -Eq '"url"[[:space:]]*:' ios/App/App/capacitor.config.json
          ! grep -Eq 'server:[[:space:]]*\{[^}]*url' capacitor.config.ts

      - name: Build web bundle and native assets
        run: |
          set -euo pipefail
          npm ci
          npm run ios:prepare
          test -f ios/App/App/public/index.html
          test -f ios/App/App/public/privacy/index.html
          test -f ios/App/App/public/support/index.html
          test -f ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          grep -q 'researchNextStepSection' ios/App/App/public/app-shows.js
          grep -q 'Research follow-up' ios/App/App/public/app-shows.js
          grep -q 'Manager move' ios/App/App/public/app-shows.js
          grep -q 'Create email draft' ios/App/App/public/app-shows.js
          grep -q 'Create email draft' ios/App/App/public/app-modals.js
          grep -q 'Create call script' ios/App/App/public/app-shows.js
          grep -q 'Create call script' ios/App/App/public/app-modals.js
          grep -q 'function researchEmailDraft' ios/App/App/public/app-core.js
          grep -q 'function researchCallScript' ios/App/App/public/app-core.js
          grep -q 'function researchOutreachProfile' ios/App/App/public/app-core.js
          grep -q 'function researchStructuredAction' ios/App/App/public/app-shows.js
          grep -q 'operational_action_code' ios/App/App/public/app-shows.js
          grep -q 'Open application / apply' ios/App/App/public/app-shows.js
          grep -q 'operational_guard' ios/App/App/public/app-modals.js
          grep -q 'Open application / apply' ios/App/App/public/app-modals.js
          grep -q 'function annualPlanEmailDraft' ios/App/App/public/app-shows.js
          grep -q 'function annualPlanCallScript' ios/App/App/public/app-shows.js
