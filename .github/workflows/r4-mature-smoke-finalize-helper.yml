name: One-time R4 mature smoke finalize helper

on:
  push:
    branches:
      - release/r4-mature-smoke-finalize-20260910-2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-validated-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Build exact mature-smoke correction commit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/debug-paradise-shows-live.yml')
          s=p.read_text(encoding='utf-8')
          replacements=[
              ("assert run.get('id') == 'b922deb4-9416-4cf8-a218-e3e693b0ac85', run", "assert run.get('id') == 'b922deb4-9416-45f4-a467-9a1f6e317a6f', run"),
              ("grep -q '77 plan rows' /tmp/annual_plan.html", "grep -q '104 plan rows' /tmp/annual_plan.html"),
              ("grep -q 'Pursue 33' /tmp/annual_plan.html", "grep -q 'Pursue 35' /tmp/annual_plan.html"),
          ]
          for old,new in replacements:
              count=s.count(old)
              assert count==1, (old,count)
              assert new not in s, ('replacement already present',new)
              s=s.replace(old,new,1)
          for old,new in replacements:
              assert old not in s, old
              assert s.count(new)==1, (new,s.count(new))
          p.write_text(s,encoding='utf-8')
          print('Exact three-substitution guard: PASS')
          PY
          rm .github/workflows/r4-mature-smoke-finalize-helper.yml
          git config user.name 'Paradise Shows release helper'
          git config user.email '200838923+twiztd1166@users.noreply.github.com'
          git add -A
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" -eq 2
          git diff --cached --check
          git diff --cached --stat
          git diff --cached -- .github/workflows/debug-paradise-shows-live.yml
          git commit -m 'Fix final 2027 R4 mature smoke snapshots'
          echo "TARGET_COMMIT=$(git rev-parse HEAD)"
