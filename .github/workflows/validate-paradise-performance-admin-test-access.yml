name: Validate Paradise Performance admin test access

on:
  push:
    branches:
      - paradise-performance-web-interim-preview
    paths:
      - 'performance-admin-test.html'
      - 'performance/client/performance-admin-test-enrollment.mjs'
      - '.github/workflows/validate-paradise-performance-admin-test-access.yml'
  pull_request:
    branches:
      - paradise-performance-web-interim-preview
    paths:
      - 'performance-admin-test.html'
      - 'performance/client/performance-admin-test-enrollment.mjs'
      - '.github/workflows/validate-paradise-performance-admin-test-access.yml'

permissions:
  contents: read

concurrency:
  group: paradise-performance-admin-test-access-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-admin-test-access:
    name: Admin test enrollment controls
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript syntax check
        run: node --check performance/client/performance-admin-test-enrollment.mjs

      - name: Validate controlled admin test enrollment boundaries
        shell: bash
        run: |
          node <<'EOF'
          const fs = require('fs');
          const html = fs.readFileSync('performance-admin-test.html', 'utf8');
          const js = fs.readFileSync('performance/client/performance-admin-test-enrollment.mjs', 'utf8');

          const requireText = (source, text, label) => {
            if (!source.includes(text)) throw new Error(`Missing ${label}: ${text}`);
          };
          const reject = (source, pattern, label) => {
            if (pattern.test(source)) throw new Error(`Forbidden ${label}: ${pattern}`);
          };

          requireText(html, 'noindex,nofollow,noarchive', 'noindex control');
          requireText(html, 'CONTROLLED ADMIN TESTING ONLY · NOT EMPLOYEE ROLLOUT', 'testing-only boundary');
          requireText(html, 'designated active admin test profiles only', 'designated cohort boundary');
          requireText(html, 'performance-admin-test-enrollment.mjs', 'admin controller module');

          requireText(js, 'validateTrustedDeviceSession', 'trusted-session validation');
          requireText(js, "const AUTHORIZED_TEST_ROLE = 'admin';", 'admin-only role gate');
          requireText(js, 'AUTHORIZED_TEST_EMPLOYEE_IDS', 'designated test allowlist');
          requireText(js, 'a6eb5ecc-ca82-4b83-94f3-5a0a534e3f64', 'designated tester one');
          requireText(js, 'c10e9f21-e71e-4385-ab8b-855da0a506a3', 'designated tester two');
          requireText(js, "session.status !== 'READY'", 'READY fail-closed gate');
          requireText(js, '!AUTHORIZED_TEST_EMPLOYEE_ID_SET.has(session.employeeId)', 'issuer allowlist gate');
          requireText(js, 'mintEnrollment', 'existing protected mint helper');
          requireText(js, ".from('performance_employees')", 'employee directory read');
          requireText(js, ".in('id', AUTHORIZED_TEST_EMPLOYEE_IDS)", 'target allowlist query');
          requireText(js, ".eq('active', true)", 'active employee filter');
          requireText(js, ".eq('role', AUTHORIZED_TEST_ROLE)", 'admin target filter');
          requireText(js, 'scheduleExpiryClear', 'expiry cleanup');
          requireText(js, 'clearPlaintextCode', 'plaintext cleanup');
          requireText(js, 'No direct database fallback was attempted.', 'no-bypass error boundary');
          requireText(js, 'SUPABASE_PUBLISHABLE_KEY', 'publishable browser key');

          reject(js, /SERVICE_ROLE_KEY|service_role_key|SUPABASE_SERVICE_ROLE/i, 'service-role credential usage');
          reject(js, /SUPABASE_SECRET/i, 'secret key usage');
          reject(js, /performance_enrollment_tokens[\s\S]{0,180}\.(insert|update|delete|upsert)\s*\(/i, 'direct enrollment-token DML');
          reject(js, /(localStorage|sessionStorage)\.setItem\([^\n]*(token|code)/i, 'plaintext token persistence');

          console.log('Paradise Performance designated-admin test enrollment controls: PASS');
          EOF

      - name: Install isolated Chromium smoke runtime
        shell: bash
        run: |
          set -euo pipefail
          PWROOT="$RUNNER_TEMP/performance-admin-test-playwright"
          mkdir -p "$PWROOT"
          npm install --prefix "$PWROOT" --no-save --ignore-scripts --package-lock=false @playwright/test
          ln -s "$PWROOT/node_modules" node_modules
          ./node_modules/.bin/playwright install chromium

      - name: Start local preview server
        shell: bash
        run: |
          python3 -m http.server 4174 --bind 127.0.0.1 >/tmp/performance-admin-test-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4174/performance-admin-test.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/performance-admin-test-http.log
          exit 1

      - name: Verify unauthenticated browser fails closed
        shell: bash
        run: |
          cat > .performance-admin-test-smoke.mjs <<'EOF'
          import { chromium } from '@playwright/test';
          const browser = await chromium.launch();
          const context = await browser.newContext();
          const page = await context.newPage();
          const pageErrors = [];
          const consoleErrors = [];
          page.on('pageerror', error => pageErrors.push(String(error)));
          page.on('console', message => { if (message.type() === 'error') consoleErrors.push(message.text()); });
          await page.goto('http://127.0.0.1:4174/performance-admin-test.html', { waitUntil: 'networkidle', timeout: 30000 });
          await page.waitForFunction(() => document.querySelector('#adminTestStatus')?.textContent?.includes('requires one of the designated enrolled Paradise admin test browsers'), null, { timeout: 30000 });
          const result = await page.evaluate(() => ({
            status: document.querySelector('#adminTestStatus')?.textContent || '',
            formHidden: document.querySelector('#adminTestEnrollmentForm')?.hidden === true,
            robots: document.querySelector('meta[name="robots"]')?.content || '',
          }));
          if (!result.formHidden) throw new Error('Unauthorized enrollment form became visible');
          if (result.robots !== 'noindex,nofollow,noarchive') throw new Error(`Unexpected robots boundary: ${result.robots}`);
          if (pageErrors.length) throw new Error(`Page errors: ${pageErrors.join(' | ')}`);
          if (consoleErrors.length) throw new Error(`Console errors: ${consoleErrors.join(' | ')}`);
          console.log(JSON.stringify({ status: 'PASS', failClosed: true, noindex: true }));
          await browser.close();
          EOF
          node .performance-admin-test-smoke.mjs
