name: Validate Paradise University adversarial red team
on:
  push:
    branches: [agent/paradise-university-v1]
concurrency:
  group: paradise-university-red-team-validation
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  red-team:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate red-team static controls
        run: |
          node --check training-checks-v1.js
          node --check training-experience-v3.js
          node --check tests/training-red-team-v1.spec.js
          node --check scripts/validate-training-experience-v3.mjs
          node scripts/validate-training-experience-v3.mjs
          grep -q 'puLessonCompletionCurrent' training-checks-v1.js
          grep -q '2026.08.17-pu-progress-transfer-v2-hardened' training-experience-v3.js
          grep -q 'puValidateProgressTransfer' training-experience-v3.js
          grep -q 'trainingux5-experience3-redteam1' sw.js
          if grep -q '<iframe' training-player-v1.js; then echo 'Embedded training iframe reintroduced'; exit 1; fi
      - name: Reconfirm controlled field baseline
        run: node scripts/validate-field-baseline-v1.mjs
      - name: Prove training release isolation
        run: node scripts/validate-training-release-isolation.mjs
      - name: Install adversarial browser matrix
        shell: bash
        run: |
          PLAYWRIGHT_ROOT="$RUNNER_TEMP/pcm-red-team-playwright"
          mkdir -p "$PLAYWRIGHT_ROOT"
          printf '{"private":true,"type":"module"}\n' > "$PLAYWRIGHT_ROOT/package.json"
          npm install --prefix "$PLAYWRIGHT_ROOT" --no-save --ignore-scripts --package-lock=false @playwright/test
          ln -s "$PLAYWRIGHT_ROOT/node_modules" node_modules
          ./node_modules/.bin/playwright install --with-deps webkit chromium
      - name: Start isolated test server
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/pcm-red-team-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && break; sleep 1; done
      - name: Run adversarial browser matrix
        run: ./node_modules/.bin/playwright test tests/training-red-team-v1.spec.js --retries=0 --reporter=github
