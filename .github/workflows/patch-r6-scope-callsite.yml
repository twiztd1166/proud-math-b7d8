name: Patch R6 scoped annual-plan call site

on:
  push:
    branches:
      - hotfix/r6-scope-separate-renderer
    paths:
      - .github/workflows/patch-r6-scope-callsite.yml

permissions:
  contents: write

jobs:
  patch-callsite:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: hotfix/r6-scope-separate-renderer
          fetch-depth: 0
      - name: Replace exact PLAN2027 renderer call site
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('public/app-shows.js')
          text=path.read_text()
          old="if(state.showMode==='PLAN2027')return top+renderAnnualPlan();"
          new="if(state.showMode==='PLAN2027')return top+(typeof window.renderAnnualPlanScoped==='function'?window.renderAnnualPlanScoped():renderAnnualPlan());"
          count=text.count(old)
          assert count==1, f'Expected exactly one PLAN2027 call site, found {count}'
          path.write_text(text.replace(old,new,1))
          assert path.read_text().count(new)==1
          print('Guarded PLAN2027 call-site patch: PASS')
          PY
          git diff --check
          git diff -- public/app-shows.js
      - name: Commit guarded patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'twiztd1166'
          git config user.email '200838923+twiztd1166@users.noreply.github.com'
          git add public/app-shows.js
          git commit -m 'Route 2027 plan through separate scoped renderer'
          git push origin HEAD:hotfix/r6-scope-separate-renderer
