name: Validate canvass register
on:
  push:
    branches: [paradise-canvass-manager-public]
concurrency:
  group: paradise-canvass-manager-public-validation
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Rebuild and validate controlled register
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),zlib=require('zlib'),crypto=require('crypto');
          const baseline=JSON.parse(fs.readFileSync('control-baseline.json','utf8'));
          let obj;
          if(fs.existsSync('controlled-register-source.json')){
            obj=JSON.parse(fs.readFileSync('controlled-register-source.json','utf8'));
          }else{
            const parts=['payload00.txt','payload01.txt','payload02.txt','payload03a.txt','payload03b.txt','payload04a1.txt','payload04a2.txt','payload04b1.txt','payload04b2.txt','payload05a1.txt','payload05a2a.txt','payload05a2b1.txt','payload05a2b2.txt','payload05b1a11.txt','payload05b1a12.txt','payload05b1a21.txt','payload05b1a22.txt','payload05b1b11.txt','payload05b1b12a.txt','payload05b1b12b.txt','payload05b1b21.txt','payload05b1b22a.txt','payload05b1b22b.txt','payload05b2a11.txt','payload05b2a12a.txt'];
            let b64=parts.map(f=>fs.readFileSync(f,'utf8').trim()).join('');
            b64+=Buffer.from(fs.readFileSync('payload05tail.hex','utf8').trim(),'hex').toString('utf8');
            obj=JSON.parse(zlib.gunzipSync(Buffer.from(b64,'base64')).toString('utf8'));
            fs.writeFileSync('controlled-register-source.json',JSON.stringify(obj,null,2)+'\n');
          }
          if(!obj||!Array.isArray(obj.records)||!obj.meta)throw new Error('Controlled register structure invalid');
          const names=obj.records.map(r=>String(r.name||'').trim());
          if(names.some(n=>!n))throw new Error('Blank jurisdiction name');
          if(new Set(names).size!==names.length)throw new Error('Duplicate jurisdiction name');
          if(obj.records.some(r=>!['GO','NO-GO'].includes(r.release)))throw new Error('Unexpected release classification');
          const go=obj.records.filter(r=>r.release==='GO').length;
          const noGo=obj.records.filter(r=>r.release==='NO-GO').length;
          const stops=obj.records.filter(r=>r.release==='NO-GO').map(r=>r.name).sort();
          const expectedStops=[...baseline.noGoNames].sort();
          const sourceCoverage=obj.records.filter(r=>Array.isArray(r.sources)&&r.sources.length>0&&r.sources.every(u=>/^https?:\/\//i.test(String(u)))).length;
          if(obj.records.length!==baseline.records||go!==baseline.go||noGo!==baseline.noGo)throw new Error('Controlled count mismatch');
          if(JSON.stringify(stops)!==JSON.stringify(expectedStops))throw new Error('NO-GO baseline mismatch');
          if(baseline.requireSourceForEveryJurisdiction&&sourceCoverage!==obj.records.length)throw new Error('Source coverage mismatch');
          if(obj.meta.snapshotDate!==baseline.snapshot)throw new Error('Snapshot baseline mismatch');
          const canonical=JSON.stringify(obj);
          const hash=crypto.createHash('sha256').update(canonical).digest('hex');
          const manifest={schemaVersion:1,snapshot:obj.meta.snapshotDate,records:obj.records.length,go,noGo,noGoNames:stops,sourceCoverage,sha256:hash};
          fs.writeFileSync('plain-data.js','window.PCM_DATA='+canonical+';\n');
          fs.writeFileSync('register-manifest.json',JSON.stringify(manifest,null,2)+'\n');
          console.log(manifest);
          NODE
      - name: Validate app, PWA and production bundle
        shell: bash
        run: |
          node --check core-v2.js
          node --check lookup-v2.js
          node --check browse-v3.js
          node --check release-v2a.js
          node --check history-v2.js
          node --check release-v2b.js
          node --check pwa-v3.js
          node --check boot-v2.js
          node --check sw.js
          node --check tests/mobile-regression.spec.js
          node --check tests/offline-regression.spec.js
          node --check canvass-worker.js
          node --check scripts/build-canvass-site.mjs
          grep -q 'manifest.webmanifest' index.html
          grep -q 'pwa-v3.css' index.html
          grep -q 'browse-v3.js' index.html
          grep -q 'pwa-v3.js' index.html
          grep -q 'plain-data.js' index.html
          grep -q 'icon-192.png' manifest.webmanifest
          grep -q 'icon-512.png' manifest.webmanifest
          grep -q 'plain-data.js' sw.js
          grep -q 'browse-v3.js' sw.js
          grep -q 'canvass.paradiseexteriors.com' wrangler.canvass.jsonc
          test -f icon-192.png
          test -f icon-512.png
          test -f control-baseline.json
          test -f register-manifest.json
          if grep -Eq 'central-sync|central-config|central-style' index.html; then echo 'Dormant central sync exposed'; exit 1; fi
          node scripts/build-canvass-site.mjs
          test -f canvass-dist/index.html
          test -f canvass-dist/plain-data.js
          test -f canvass-dist/sw.js
      - name: Install WebKit test runtime
        shell: bash
        run: |
          npm install --no-save --ignore-scripts @playwright/test
          npx playwright install --with-deps webkit
      - name: Run iPhone WebKit and cached-network outage regression
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/pcm-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && break; sleep 1; done
          npx playwright test tests/mobile-regression.spec.js --project=webkit-iphone
          npx playwright test tests/offline-regression.spec.js --project=webkit-iphone --retries=0
      - name: Publish validated snapshot metadata
        shell: bash
        run: |
          REMOTE_SHA="$(git ls-remote origin refs/heads/paradise-canvass-manager-public | cut -f1)"
          if [ "$REMOTE_SHA" != "$GITHUB_SHA" ]; then
            echo "A newer commit exists; this validated run will not overwrite latest.json."
            exit 0
          fi
          node <<'NODE'
          const fs=require('fs');
          const text=fs.readFileSync('pwa-v3.js','utf8');
          const m=text.match(/PCM_BUILD_VERSION='([^']+)'/);if(!m)throw new Error('Build version missing');
          const manifest=JSON.parse(fs.readFileSync('register-manifest.json','utf8'));
          const sha=process.env.GITHUB_SHA;
          const meta={version:m[1],sha,snapshot:manifest.snapshot,datasetSha256:manifest.sha256,records:manifest.records,go:manifest.go,noGo:manifest.noGo,url:`https://rawcdn.githack.com/twiztd1166/proud-math-b7d8/${sha}/index.html`,validated:true,publishedAt:new Date().toISOString()};
          fs.writeFileSync('latest.json',JSON.stringify(meta,null,2)+'\n');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add controlled-register-source.json plain-data.js register-manifest.json latest.json
          if git diff --cached --quiet; then
            echo 'Validated artifacts unchanged'
          else
            git commit -m 'Publish validated canvass app metadata'
            git push origin HEAD:paradise-canvass-manager-public
          fi
