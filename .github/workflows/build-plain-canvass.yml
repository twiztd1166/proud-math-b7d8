name: Validate canvass register
on:
  push:
    branches: [paradise-canvass-manager-public]
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: paradise-canvass-manager-public
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Rebuild and validate controlled register
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'), zlib=require('zlib');
          const parts=[
            'payload00.txt','payload01.txt','payload02.txt','payload03a.txt','payload03b.txt',
            'payload04a1.txt','payload04a2.txt','payload04b1.txt','payload04b2.txt',
            'payload05a1.txt','payload05a2a.txt','payload05a2b1.txt','payload05a2b2.txt',
            'payload05b1a11.txt','payload05b1a12.txt','payload05b1a21.txt','payload05b1a22.txt',
            'payload05b1b11.txt','payload05b1b12a.txt','payload05b1b12b.txt','payload05b1b21.txt','payload05b1b22a.txt','payload05b1b22b.txt',
            'payload05b2a11.txt','payload05b2a12a.txt'
          ];
          let b64=parts.map(f=>fs.readFileSync(f,'utf8').trim()).join('');
          b64 += Buffer.from(fs.readFileSync('payload05tail.hex','utf8').trim(),'hex').toString('utf8');
          const obj=JSON.parse(zlib.gunzipSync(Buffer.from(b64,'base64')).toString('utf8'));
          if(obj.records.length!==78||obj.meta.goCount!==76||obj.meta.noGoCount!==2) throw new Error('Control mismatch');
          const stops=obj.records.filter(r=>r.release==='NO-GO').map(r=>r.name).sort();
          if(JSON.stringify(stops)!==JSON.stringify(['Punta Gorda','Tarpon Springs'])) throw new Error('NO-GO mismatch');
          if(obj.records.some(r=>!Array.isArray(r.sources)||r.sources.length<1)) throw new Error('Source coverage mismatch');
          fs.writeFileSync('plain-data.js','window.PCM_DATA='+JSON.stringify(obj)+';\n');
          console.log({records:obj.records.length,go:obj.meta.goCount,noGo:obj.meta.noGoCount,sourceCoverage:obj.records.length,stops});
          NODE
      - name: Validate mobile app modules
        shell: bash
        run: |
          node --check core-v2.js
          node --check lookup-v2.js
          node --check release-v2a.js
          node --check release-v2b.js
          node --check boot-v2.js
          grep -q 'plain-data.js' index.html
          grep -q 'core-v2.js' index.html
          grep -q 'lookup-v2.js' index.html
          grep -q 'release-v2a.js' index.html
          grep -q 'release-v2b.js' index.html
          grep -q 'boot-v2.js' index.html
          grep -q 'style-v2.css' index.html
      - name: Commit validated snapshot if changed
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plain-data.js
          if git diff --cached --quiet; then
            echo 'Validated snapshot unchanged'
          else
            git commit -m 'Refresh validated canvass snapshot'
            git push origin HEAD:paradise-canvass-manager-public
          fi
