name: Validate Paradise Performance web preview

on:
  push:
    branches: [paradise-performance-web-interim-preview]
    paths:
      - 'index.html'
      - 'first-admin-bootstrap.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'performance-web.css'
      - 'PREVIEW_CONTROL.txt'
      - 'performance/client/**'
      - 'performance/shared/**'
      - '.github/workflows/validate-paradise-performance-web-preview.yml'
  pull_request:
    branches: [paradise-performance-web-interim-preview]
    paths:
      - 'PREVIEW_SMOKE_TRIGGER.txt'
      - 'index.html'
      - 'first-admin-bootstrap.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'performance-web.css'
      - 'PREVIEW_CONTROL.txt'
      - 'performance/client/**'
      - 'performance/shared/**'
      - '.github/workflows/validate-paradise-performance-web-preview.yml'

permissions:
  contents: read

concurrency:
  group: paradise-performance-web-preview-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  smoke:
    name: ${{ matrix.browser }} preview + live GPS smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit, chromium]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated Playwright runtime
        shell: bash
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          set -euo pipefail
          PWROOT="$RUNNER_TEMP/performance-preview-playwright"
          mkdir -p "$PWROOT"
          printf '{"private":true,"type":"module"}\n' > "$PWROOT/package.json"
          timeout --signal=TERM --kill-after=30s 5m npm install --prefix "$PWROOT" --no-save --ignore-scripts --package-lock=false @playwright/test
          ln -s "$PWROOT/node_modules" node_modules
          PW='./node_modules/.bin/playwright'
          if "$PW" install-deps --dry-run "$BROWSER" >/tmp/pw-deps.log 2>&1; then
            timeout --signal=TERM --kill-after=30s 12m "$PW" install "$BROWSER"
          else
            cat /tmp/pw-deps.log
            timeout --signal=TERM --kill-after=30s 12m "$PW" install --with-deps "$BROWSER"
          fi
      - name: Start preview server
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/performance-preview-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/performance-preview-http.log
          exit 1
      - name: Run local app and live foreground GPS smoke
        shell: bash
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          cat > .performance-preview-smoke.mjs <<'EOF'
          import { webkit, chromium } from '@playwright/test';
          const browserType = process.env.BROWSER === 'chromium' ? chromium : webkit;
          const browser = await browserType.launch();
          const context = await browser.newContext({
            viewport: { width: 390, height: 844 },
            geolocation: { latitude: 26.35, longitude: -80.09 },
            permissions: ['geolocation'],
          });
          const page = await context.newPage();
          const pageErrors = [];
          const consoleErrors = [];
          const badLocalResponses = [];
          page.on('pageerror', error => pageErrors.push(String(error)));
          page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });
          page.on('response', response => {
            const u = new URL(response.url());
            if (u.hostname === '127.0.0.1' && response.status() >= 400) badLocalResponses.push(`${response.status()} ${u.pathname}`);
          });
          await page.goto('http://127.0.0.1:4173/index.html', { waitUntil: 'networkidle', timeout: 60000 });
          await page.waitForSelector('#nPerf', { timeout: 30000 });
          if (await page.title() !== 'Paradise Performance — Web Interim') throw new Error(`Unexpected title: ${await page.title()}`);
          const meta = await page.evaluate(() => window.PCM_DATA?.meta || null);
          if (!meta || meta.recordCount !== 78 || meta.goCount !== 76 || meta.noGoCount !== 2) throw new Error(`Field baseline mismatch: ${JSON.stringify(meta)}`);
          await page.click('#nTrain');
          await page.waitForTimeout(250);
          const trainingText = await page.locator('#main').innerText();
          if (!/(Continue Training|Practice|Career Path|Videos & Audio|My Progress)/i.test(trainingText)) throw new Error(`Training did not render expected navigation: ${trainingText.slice(0,400)}`);
          await page.click('#nPerf');
          await page.waitForSelector('#performanceWebEnrollForm', { timeout: 30000 });
          const performanceText = await page.locator('#main').innerText();
          if (!/LIVE FOREGROUND GPS/i.test(performanceText) || !/locked-screen\/background/i.test(performanceText) || !/one-time manager code/i.test(performanceText)) throw new Error(`Performance boundary missing: ${performanceText.slice(0,700)}`);
          const tracker = await page.evaluate(async () => {
            const { BrowserForegroundLocationBridge } = await import('./performance/client/performance-web-location.mjs');
            const writes = [];
            let counter = 0;
            const bridge = new BrowserForegroundLocationBridge({
              onQueuedLocation: async write => writes.push(write),
              uuid: () => `44444444-4444-4444-8444-${String(++counter).padStart(12, '0')}`,
            });
            const state = await bridge.startShift({
              shiftId: '11111111-1111-4111-8111-111111111111',
              employeeId: '22222222-2222-4222-8222-222222222222',
              deviceId: '33333333-3333-4333-8333-333333333333',
              initiatedByUser: true,
            });
            await new Promise(resolve => setTimeout(resolve, 400));
            const live = bridge.getState();
            await bridge.stopShift({ shiftId: '11111111-1111-4111-8111-111111111111' });
            bridge.destroy();
            return { state, live, writes: writes.map(write => write.payload?.source) };
          });
          if (!tracker.live.continuousForegroundTracking) throw new Error(`watchPosition not active: ${JSON.stringify(tracker)}`);
          if (tracker.live.continuousBackgroundTracking !== false) throw new Error('Browser must never claim continuous background tracking');
          if (!tracker.writes.includes('web-foreground-sample')) throw new Error(`Initial foreground sample missing: ${JSON.stringify(tracker.writes)}`);
          if (badLocalResponses.length) throw new Error(`Local asset failures: ${badLocalResponses.join(', ')}`);
          if (pageErrors.length) throw new Error(`Page errors: ${pageErrors.join(' | ')}`);
          if (consoleErrors.length) throw new Error(`Console errors: ${consoleErrors.join(' | ')}`);
          console.log(JSON.stringify({status:'PASS',browser:process.env.BROWSER,records:78,go:76,noGo:2,continuousForegroundTracking:true,continuousBackgroundTracking:false,wakeLock:tracker.live.screenWakeLock,locationMode:'CONTINUOUS_FOREGROUND_VISIBLE_ONLY'}));
          await browser.close();
          EOF
          node ./.performance-preview-smoke.mjs
          rm -f .performance-preview-smoke.mjs
      - name: Verify immutable HTTPS delivery and first-admin boundary
        shell: bash
        env:
          BROWSER: ${{ matrix.browser }}
          LIVE_APP_URL: https://rawcdn.githack.com/${{ github.repository }}/${{ github.event.pull_request.head.sha || github.sha }}/index.html
          LIVE_ADMIN_URL: https://rawcdn.githack.com/${{ github.repository }}/${{ github.event.pull_request.head.sha || github.sha }}/first-admin-bootstrap.html
        run: |
          cat > .performance-live-smoke.mjs <<'EOF'
          import { webkit, chromium } from '@playwright/test';
          const browserType = process.env.BROWSER === 'chromium' ? chromium : webkit;
          const browser = await browserType.launch();
          const context = await browser.newContext({ viewport: { width: 390, height: 844 } });
          await context.addCookies([{ name: '__Http-phish', value: '1', domain: 'rawcdn.githack.com', path: '/', secure: true }]);
          async function cleanPage(url) {
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', error => errors.push(String(error)));
            page.on('console', msg => { if (msg.type() === 'error') errors.push(msg.text()); });
            const response = await page.goto(url, { waitUntil: 'networkidle', timeout: 60000 });
            if (!response || response.status() >= 400) throw new Error(`HTTPS navigation failed ${response?.status()}`);
            return { page, errors };
          }
          const app = await cleanPage(process.env.LIVE_APP_URL);
          await app.page.waitForSelector('#nPerf', { timeout: 30000 });
          await app.page.click('#nPerf');
          await app.page.waitForSelector('#performanceWebEnrollForm', { timeout: 30000 });
          const text = await app.page.locator('#main').innerText();
          if (!/LIVE FOREGROUND GPS/i.test(text) || !/one-time manager code/i.test(text)) throw new Error(`Live app v2 boundary missing: ${text.slice(0,700)}`);
          if (app.errors.length) throw new Error(`Live app errors: ${app.errors.join(' | ')}`);
          const admin = await cleanPage(process.env.LIVE_ADMIN_URL);
          await admin.page.waitForSelector('#firstAdminBootstrapForm', { timeout: 30000 });
          if (await admin.page.locator('#firstAdminEmail').inputValue() !== '' || await admin.page.locator('#firstAdminProof').inputValue() !== '') throw new Error('First-admin credentials must not be prefilled');
          if (admin.errors.length) throw new Error(`Live admin errors: ${admin.errors.join(' | ')}`);
          console.log(JSON.stringify({status:'PASS',browser:process.env.BROWSER,liveApp:process.env.LIVE_APP_URL,liveAdmin:process.env.LIVE_ADMIN_URL,locationMode:'CONTINUOUS_FOREGROUND_VISIBLE_ONLY'}));
          await browser.close();
          EOF
          node ./.performance-live-smoke.mjs
          rm -f .performance-live-smoke.mjs
