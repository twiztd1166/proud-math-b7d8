name: Validate Paradise Performance web preview

on:
  push:
    branches: [paradise-performance-web-interim-preview]
    paths:
      - 'index.html'
      - 'first-admin-bootstrap.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'performance-web.css'
      - 'PREVIEW_CONTROL.txt'
      - 'performance/client/**'
      - 'performance/shared/**'
      - '.github/workflows/validate-paradise-performance-web-preview.yml'
  pull_request:
    branches: [paradise-performance-web-interim-preview]
    paths:
      - 'PREVIEW_SMOKE_TRIGGER.txt'
      - 'index.html'
      - 'first-admin-bootstrap.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'performance-web.css'
      - 'performance/client/**'
      - 'performance/shared/**'
      - '.github/workflows/validate-paradise-performance-web-preview.yml'

permissions:
  contents: read

concurrency:
  group: paradise-performance-web-preview-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  smoke:
    name: WebKit preview smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated Playwright runtime
        shell: bash
        run: |
          set -euo pipefail
          PWROOT="$RUNNER_TEMP/performance-preview-playwright"
          mkdir -p "$PWROOT"
          printf '{"private":true,"type":"module"}\n' > "$PWROOT/package.json"
          timeout --signal=TERM --kill-after=30s 5m npm install --prefix "$PWROOT" --no-save --ignore-scripts --package-lock=false @playwright/test
          ln -s "$PWROOT/node_modules" node_modules
          PW='./node_modules/.bin/playwright'
          if "$PW" install-deps --dry-run webkit >/tmp/pw-deps.log 2>&1; then
            timeout --signal=TERM --kill-after=30s 12m "$PW" install webkit
          else
            cat /tmp/pw-deps.log
            timeout --signal=TERM --kill-after=30s 12m "$PW" install --with-deps webkit
          fi
      - name: Start preview server
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/performance-preview-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/performance-preview-http.log
          exit 1
      - name: Run source-direct iPhone/WebKit smoke
        shell: bash
        run: |
          cat > .performance-preview-smoke.mjs <<'EOF'
          import { webkit } from '@playwright/test';
          const browser = await webkit.launch();
          const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
          const pageErrors = [];
          const consoleErrors = [];
          const badLocalResponses = [];
          page.on('pageerror', error => pageErrors.push(String(error)));
          page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });
          page.on('response', response => {
            const u = new URL(response.url());
            if (u.hostname === '127.0.0.1' && response.status() >= 400) badLocalResponses.push(`${response.status()} ${u.pathname}`);
          });
          await page.goto('http://127.0.0.1:4173/index.html', { waitUntil: 'networkidle', timeout: 60000 });
          await page.waitForSelector('#nPerf', { timeout: 30000 });
          if (await page.title() !== 'Paradise Performance — Web Interim') throw new Error(`Unexpected title: ${await page.title()}`);
          const meta = await page.evaluate(() => window.PCM_DATA?.meta || null);
          if (!meta || meta.recordCount !== 78 || meta.goCount !== 76 || meta.noGoCount !== 2) throw new Error(`Field baseline mismatch: ${JSON.stringify(meta)}`);
          await page.click('#nTrain');
          await page.waitForTimeout(400);
          const trainingText = await page.locator('#main').innerText();
          if (!/(Continue Training|Practice|Career Path|Videos & Audio|My Progress)/i.test(trainingText)) throw new Error(`Training did not render expected navigation: ${trainingText.slice(0,400)}`);
          await page.click('#nPerf');
          await page.waitForSelector('#performanceWebEnrollForm', { timeout: 30000 });
          const performanceText = await page.locator('#main').innerText();
          if (!/WEB INTERIM/.test(performanceText) || !/foreground\/sample-only/i.test(performanceText) || !/one-time manager code/i.test(performanceText)) throw new Error(`Performance enrollment boundary missing: ${performanceText.slice(0,600)}`);
          if (badLocalResponses.length) throw new Error(`Local asset failures: ${badLocalResponses.join(', ')}`);
          if (pageErrors.length) throw new Error(`Page errors: ${pageErrors.join(' | ')}`);
          if (consoleErrors.length) throw new Error(`Console errors: ${consoleErrors.join(' | ')}`);
          console.log(JSON.stringify({status:'PASS',title:await page.title(),records:meta.recordCount,go:meta.goCount,noGo:meta.noGoCount,performanceEnrollmentBoundary:true,locationMode:'FOREGROUND_SAMPLE_ONLY'}));
          await browser.close();
          EOF
          node ./.performance-preview-smoke.mjs
          rm -f .performance-preview-smoke.mjs
      - name: Verify first-admin bootstrap locally and on immutable HTTPS head
        shell: bash
        env:
          LIVE_URL: https://rawcdn.githack.com/${{ github.repository }}/${{ github.event.pull_request.head.sha || github.sha }}/first-admin-bootstrap.html
        run: |
          cat > .first-admin-preview-smoke.mjs <<'EOF'
          import { webkit } from '@playwright/test';

          async function verify(page, url, label) {
            const pageErrors = [];
            const consoleErrors = [];
            const badResponses = [];
            const provisioningRequests = [];
            page.on('pageerror', error => pageErrors.push(String(error)));
            page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });
            page.on('response', response => {
              if (response.status() >= 400) badResponses.push(`${response.status()} ${response.url()}`);
            });
            page.on('request', request => {
              if (request.url().includes('/functions/v1/performance-first-manager-bootstrap-provision')) provisioningRequests.push(request.url());
            });
            const response = await page.goto(url, { waitUntil: 'networkidle', timeout: 60000 });
            if (!response || response.status() >= 400) throw new Error(`${label} navigation failed: ${response?.status() ?? 'NO_RESPONSE'}`);
            await page.waitForSelector('#firstAdminBootstrapForm', { timeout: 30000 });
            if (await page.title() !== 'Paradise Performance — First Admin Test') throw new Error(`${label} unexpected title: ${await page.title()}`);
            if (await page.locator('#firstAdminEmail').inputValue() !== '') throw new Error(`${label} email field must not be prefilled`);
            if (await page.locator('#firstAdminProof').inputValue() !== '') throw new Error(`${label} proof field must not be prefilled`);
            await page.evaluate(() => {
              const form = document.querySelector('#firstAdminBootstrapForm');
              if (!form) throw new Error('First-admin bootstrap form missing');
              form.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));
            });
            await page.waitForFunction(() => /Enter the authorized email and the one-time proof/i.test(document.querySelector('#firstAdminBootstrapStatus')?.textContent || ''), null, { timeout: 10000 });
            if (provisioningRequests.length) throw new Error(`${label} made a provisioning request without credentials`);
            if (badResponses.length) throw new Error(`${label} response failures: ${badResponses.join(' | ')}`);
            if (pageErrors.length) throw new Error(`${label} page errors: ${pageErrors.join(' | ')}`);
            if (consoleErrors.length) throw new Error(`${label} console errors: ${consoleErrors.join(' | ')}`);
            return {label,title:await page.title(),form:true,moduleListener:true,provisioningRequests:0};
          }

          const browser = await webkit.launch();
          const context = await browser.newContext({ viewport: { width: 390, height: 844 } });
          await context.addCookies([{ name: '__Http-phish', value: '1', domain: 'rawcdn.githack.com', path: '/', secure: true }]);
          const local = await verify(await context.newPage(), 'http://127.0.0.1:4173/first-admin-bootstrap.html', 'LOCAL');
          const live = await verify(await context.newPage(), process.env.LIVE_URL, 'LIVE_HTTPS');
          console.log(JSON.stringify({status:'PASS',local,live,liveUrl:process.env.LIVE_URL}));
          await browser.close();
          EOF
          node ./.first-admin-preview-smoke.mjs
          rm -f .first-admin-preview-smoke.mjs
