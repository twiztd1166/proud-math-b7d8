name: Validate Paradise Performance web KPIs and pace

on:
  pull_request:
    branches: [paradise-performance-web-interim-preview]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'performance-kpis.css'
      - 'performance/client/performance-web-knock-clock.mjs'
      - 'performance/client/performance-web-knock-clock-ui.mjs'
      - 'performance/client/performance-web-kpis.mjs'
      - 'performance/client/performance-web-kpi-ui.mjs'
      - 'performance/client/performance-sync.mjs'
      - 'performance/client/performance-operational-sync.mjs'
      - 'performance/shared/performance-events.mjs'
      - 'performance/shared/performance-math.mjs'
      - 'performance/tests/performance-web-knock-clock.test.mjs'
      - 'performance/tests/performance-web-kpis.test.mjs'
      - '.github/workflows/validate-paradise-performance-web-kpis.yml'

permissions:
  contents: read

jobs:
  contract:
    name: Web Knock Clock + KPI + fail-closed pace contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check KPI and Knock Clock modules
        run: |
          node --check performance/client/performance-web-knock-clock.mjs
          node --check performance/client/performance-web-knock-clock-ui.mjs
          node --check performance/client/performance-web-kpis.mjs
          node --check performance/client/performance-web-kpi-ui.mjs
      - name: Run KPI and Knock Clock unit contracts
        run: node --test performance/tests/performance-web-knock-clock.test.mjs performance/tests/performance-web-kpis.test.mjs performance/tests/performance-math.test.mjs
      - name: Verify measured surfaces, pace boundaries, and governance controls
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'START KNOCKING' performance/client/performance-web-knock-clock-ui.mjs
          grep -q 'STOP KNOCKING' performance/client/performance-web-knock-clock-ui.mjs
          grep -q 'KNOCK_STARTED' performance/shared/performance-events.mjs
          grep -q 'KNOCK_STOPPED' performance/shared/performance-events.mjs
          grep -q 'DOORS / KNOCK HR' performance/client/performance-web-kpi-ui.mjs
          grep -q 'CONVERSATIONS / KNOCK HR' performance/client/performance-web-kpi-ui.mjs
          grep -q 'APPOINTMENTS / KNOCK HR' performance/client/performance-web-kpi-ui.mjs
          grep -q 'CONVERSATION RATE' performance/client/performance-web-kpi-ui.mjs
          grep -q 'APPOINTMENT RATE' performance/client/performance-web-kpi-ui.mjs
          grep -q 'DOORS PACE' performance/client/performance-web-kpi-ui.mjs
          grep -q 'APPOINTMENT PACE' performance/client/performance-web-kpi-ui.mjs
          grep -q 'GOAL NOT CONFIGURED' performance/client/performance-web-kpi-ui.mjs
          grep -q "from('performance_kpi_standard_versions')" performance/client/performance-web-kpi-ui.mjs
          grep -q "select('version_label,applies_to_role,applies_to_office,applies_to_team,effective_from,effective_to,metric_key,minimum')" performance/client/performance-web-kpi-ui.mjs
          grep -q 'multiple applicable standards fail closed' performance/client/performance-web-kpis.mjs
          grep -q 'volume pace requires both an explicit daily goal and explicit planned work hours' performance/client/performance-web-kpis.mjs
          grep -q 'performance-web-knock-clock-ui.mjs' index.html
          grep -q 'performance-web-kpi-ui.mjs' index.html
          grep -q 'performance/client/performance-web-knock-clock.mjs' sw.js
          grep -q 'performance/client/performance-web-knock-clock-ui.mjs' sw.js
          if grep -Eq '\.(insert|update|upsert|delete)\(' performance/client/performance-web-kpi-ui.mjs; then
            echo 'Pace UI introduced a write path' >&2
            exit 1
          fi
          if grep -Eq "from\('performance_period_snapshots'\)|from\('performance_commissions'\)|from\('performance_pay_plan_versions'\)" performance/client/performance-web-kpi-ui.mjs; then
            echo 'Pace UI queried snapshots, commissions, or pay plans' >&2
            exit 1
          fi
          if grep -Eqi 'ahead of pace|behind pace|slightly behind|slightly ahead|leaderboard rank|bonus earned|commission earned|pay earned' performance/client/performance-web-kpi-ui.mjs performance/client/performance-web-kpis.mjs; then
            echo 'Pace slice introduced an unapproved band, rank, or compensation claim' >&2
            exit 1
          fi
          if grep -Eq 'above_standard|aboveStandard' performance/client/performance-web-kpi-ui.mjs; then
            echo 'Pace UI consumed above-standard semantics before approval' >&2
            exit 1
          fi
          if grep -Eq 'plannedWorkHours[[:space:]]*(\?\?|\|\|)[[:space:]]*[0-9]' performance/client/performance-web-kpis.mjs; then
            echo 'Pace runtime silently defaulted planned work hours' >&2
            exit 1
          fi
          echo 'PASS: explicit Knock Clock + measured KPI math + read-only fail-closed pace present without embedded targets, bands, rank, or pay logic'
