name: Validate Paradise Performance web interim

on:
  push:
    branches:
      - agent/paradise-performance-web-interim-v1
      - paradise-performance-web-interim-preview
    paths:
      - 'index.html'
      - 'sw.js'
      - 'performance-web.css'
      - 'performance/client/performance-web-*'
      - 'performance/tests/performance-web-interim.test.mjs'
      - 'scripts/validate-paradise-performance-web-interim.mjs'
      - 'docs/PARADISE_PERFORMANCE_WEB_INTERIM_V1.md'
      - '.github/workflows/validate-paradise-performance-web.yml'
  pull_request:
    branches:
      - paradise-performance-web-interim-preview
    paths:
      - 'index.html'
      - 'sw.js'
      - 'performance-web.css'
      - 'performance/client/performance-web-*'
      - 'performance/tests/performance-web-interim.test.mjs'
      - 'scripts/validate-paradise-performance-web-interim.mjs'
      - 'docs/PARADISE_PERFORMANCE_WEB_INTERIM_V1.md'
      - '.github/workflows/validate-paradise-performance-web.yml'

permissions:
  contents: read

concurrency:
  group: paradise-performance-web-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

env:
  SUPABASE_JS_VERSION: '2.112.3'

jobs:
  web-interim:
    name: Web interim source and controls
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install repository dependencies
        run: npm ci

      - name: Install pinned web runtime dependency
        run: >-
          npm install --no-save --package-lock=false
          @supabase/supabase-js@${SUPABASE_JS_VERSION}

      - name: Validate web interim source controls
        run: node scripts/validate-paradise-performance-web-interim.mjs

      - name: Run web interim contract tests
        run: node --test performance/tests/performance-web-interim.test.mjs

      - name: Verify dedicated preview branch surface
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Paradise Performance — Web Interim' index.html
          grep -q 'id="nPerf"' index.html
          grep -q 'performance/client/performance-web-app.mjs' index.html
          grep -q 'performance/client/performance-web-location.mjs' sw.js
          grep -q 'performance-web.css' index.html
          grep -q 'LIVE FOREGROUND GPS' performance/client/performance-web-app.mjs
          grep -q 'watchPosition' performance/client/performance-web-location.mjs
          grep -q 'wakeLock' performance/client/performance-web-location.mjs
          grep -q 'continuousBackgroundTracking: false' performance/client/performance-web-location.mjs
          for x in '"goCount":76' '"noGoCount":2' '"recordCount":78'; do grep -q "$x" plain-data.js; done
          if grep -ERq 'sb_secret_[A-Za-z0-9_-]{20,}|ACCESS_BACKGROUND_LOCATION' index.html performance/client/performance-web-*.mjs; then
            echo 'Dedicated web preview contains prohibited privileged/background material' >&2
            exit 1
          fi
          echo 'PASS: dedicated Performance web preview source is continuous-foreground, background-fail-closed, and preserves 78 / 76 / 2 field authority'
