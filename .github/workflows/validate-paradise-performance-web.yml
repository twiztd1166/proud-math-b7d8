name: Validate Paradise Performance web interim

on:
  push:
    branches:
      - agent/paradise-performance-web-interim-v1
    paths:
      - 'performance/client/performance-web-*'
      - 'performance/tests/performance-web-interim.test.mjs'
      - 'scripts/build-performance-web-site.mjs'
      - 'scripts/validate-paradise-performance-web-interim.mjs'
      - 'docs/PARADISE_PERFORMANCE_WEB_INTERIM_V1.md'
      - '.github/workflows/validate-paradise-performance-web.yml'
  pull_request:
    paths:
      - 'performance/client/performance-web-*'
      - 'performance/tests/performance-web-interim.test.mjs'
      - 'scripts/build-performance-web-site.mjs'
      - 'scripts/validate-paradise-performance-web-interim.mjs'
      - 'docs/PARADISE_PERFORMANCE_WEB_INTERIM_V1.md'
      - '.github/workflows/validate-paradise-performance-web.yml'

permissions:
  contents: read

concurrency:
  group: paradise-performance-web-${{ github.ref }}
  cancel-in-progress: true

env:
  SUPABASE_JS_VERSION: '2.112.3'
  ESBUILD_VERSION: '0.28.2'

jobs:
  web-interim:
    name: Web interim build and controls
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install repository dependencies
        run: npm ci

      - name: Install pinned web runtime build dependencies
        run: >-
          npm install --no-save --package-lock=false
          @supabase/supabase-js@${SUPABASE_JS_VERSION}
          esbuild@${ESBUILD_VERSION}

      - name: Validate web interim source controls
        run: node scripts/validate-paradise-performance-web-interim.mjs

      - name: Run web interim contract tests
        run: node --test performance/tests/performance-web-interim.test.mjs

      - name: Build controlled Canvass and University base
        run: node scripts/build-canvass-site.mjs

      - name: Build isolated Performance web interim
        run: node scripts/build-performance-web-site.mjs

      - name: Validate built web interim
        run: node scripts/validate-paradise-performance-web-interim.mjs --built

      - name: Re-run controlled Canvass build after web build
        run: node scripts/build-canvass-site.mjs

      - name: Confirm web build never mutates the public base
        run: >-
          node -e "const fs=require('fs');const i=fs.readFileSync('canvass-dist/index.html','utf8');
          if(i.includes('performance-web-app.js')||i.includes('id=\"nPerf\"'))process.exit(1);
          const d=fs.readFileSync('canvass-dist/plain-data.js','utf8');
          for(const x of ['\"goCount\":76','\"noGoCount\":2','\"recordCount\":78'])if(!d.includes(x))process.exit(1);
          console.log('Public Canvass/University base remains isolated at 78 / 76 / 2');"