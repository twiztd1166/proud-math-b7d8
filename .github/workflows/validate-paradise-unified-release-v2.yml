name: Validate Paradise unified release v2

on:
  push:
    branches: [paradise-canvass-manager-public]
  workflow_dispatch:

concurrency:
  group: paradise-unified-release-v2-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate-and-publish:
    name: Paradise unified exact-SHA release
    if: github.actor != 'github-actions[bot]' && github.ref_name == 'paradise-canvass-manager-public'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact public SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply controlled register payload
        run: node scripts/apply-controlled-update.mjs

      - name: Rebuild and validate controlled register
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const baseline=JSON.parse(fs.readFileSync('control-baseline.json','utf8'));
          const obj=JSON.parse(fs.readFileSync('controlled-register-source.json','utf8'));
          if(!obj||!Array.isArray(obj.records)||!obj.meta)throw new Error('Controlled register structure invalid');
          const go=obj.records.filter(r=>r.release==='GO').length,noGo=obj.records.filter(r=>r.release==='NO-GO').length;
          const stops=obj.records.filter(r=>r.release==='NO-GO').map(r=>r.name).sort();
          const sourceCoverage=obj.records.filter(r=>Array.isArray(r.sources)&&r.sources.length>0&&r.sources.every(u=>/^https?:\/\//i.test(String(u)))).length;
          if(obj.records.length!==baseline.records||go!==baseline.go||noGo!==baseline.noGo)throw new Error('Controlled count mismatch');
          if(JSON.stringify(stops)!==JSON.stringify([...baseline.noGoNames].sort()))throw new Error('NO-GO baseline mismatch');
          if(sourceCoverage!==78||obj.meta.snapshotDate!=='2026-08-14')throw new Error('Controlled source/snapshot mismatch');
          const missingScripts=obj.records.filter(r=>!String(r.script||'').trim()||!String(r.challenge||'').trim()).map(r=>r.name);
          if(missingScripts.length)throw new Error(`Controlled permit/challenge response missing: ${missingScripts.join(', ')}`);
          const byName=Object.fromEntries(obj.records.map(r=>[r.name,r]));
          if(byName['Boca Raton']?.hangerMode!=='HANG ON KNOB/HANDLE — SECURE REMOVABLE')throw new Error('Boca knob correction missing');
          if(byName['Miami Gardens']?.hangerMode!=='NON-AFFIXED ONLY')throw new Error('Miami Gardens placement drift');
          if(byName['New Port Richey']?.hangerMode!=='DO NOT DISTRIBUTE'||byName['New Port Richey']?.courtesyMode!=='HANG ON KNOB/HANDLE — SECURE REMOVABLE')throw new Error('New Port Richey placement drift');
          if(byName['Tarpon Springs']?.hangerMode!=='NO FRONT-ENTRY DISTRIBUTION'||byName['Tarpon Springs']?.courtesyMode!=='HANG ON KNOB/HANDLE — SECURE REMOVABLE')throw new Error('Tarpon Springs placement drift');
          const canonical=JSON.stringify(obj),hash=crypto.createHash('sha256').update(canonical).digest('hex');
          const expected='a98b8badf4c3df616fb091eb32ff85f70682f226e4fcd55591f3784b37abe200';
          if(hash!==expected)throw new Error(`Unexpected controlled dataset hash: ${hash}`);
          const manifest={schemaVersion:1,snapshot:obj.meta.snapshotDate,records:obj.records.length,go,noGo,noGoNames:stops,sourceCoverage,criticalFieldCoverage:obj.records.length,scriptCoverage:obj.records.length,sha256:hash};
          fs.writeFileSync('plain-data.js','window.PCM_DATA='+canonical+';\n');
          fs.writeFileSync('register-manifest.json',JSON.stringify(manifest,null,2)+'\n');
          let p=fs.readFileSync('provenance-v3-2.js','utf8');
          p=p.replace(/appVersion:'[^']+'/,"appVersion:'2026.08.14-v3.12'").replace(/snapshot:'[^']+'/,`snapshot:'${manifest.snapshot}'`).replace(/datasetSha256:'[^']+'/,`datasetSha256:'${manifest.sha256}'`).replace(/records:\d+/,`records:${manifest.records}`).replace(/go:\d+/,`go:${manifest.go}`).replace(/noGo:\d+/,`noGo:${manifest.noGo}`);
          fs.writeFileSync('provenance-v3-2.js',p);
          NODE

      - name: Generate and validate code-only change report
        shell: bash
        run: |
          node scripts/change-control-report.mjs
          node <<'NODE'
          const fs=require('fs');const r=JSON.parse(fs.readFileSync('change-control-report.json','utf8'));
          if(r.datasetChanged!==false)throw new Error('v3.12 must not change controlled dataset');
          if(r.jurisdictionChangeCount!==0)throw new Error(`Unexpected jurisdiction data changes: ${r.jurisdictionChangeCount}`);
          if((r.classificationChanges||[]).length!==0)throw new Error('Canvass classification drift detected');
          NODE

      - name: Validate static field and University release controls
        shell: bash
        run: |
          for f in scripts/validate-training-model-v1.mjs scripts/validate-practice-model-v2.mjs scripts/validate-field-baseline-v1.mjs scripts/validate-training-hardening.mjs scripts/validate-training-reconciliation.mjs scripts/validate-deep-audit-controls.mjs scripts/validate-training-experience-v2.mjs scripts/validate-training-experience-v3.mjs scripts/validate-training-release-isolation.mjs scripts/validate-release-workflow-controls.mjs scripts/build-canvass-site.mjs; do node --check "$f"; done
          node scripts/validate-training-model-v1.mjs
          node scripts/validate-practice-model-v2.mjs
          node scripts/validate-training-hardening.mjs
          node scripts/validate-training-reconciliation.mjs
          node scripts/validate-deep-audit-controls.mjs
          node scripts/validate-training-experience-v2.mjs
          node scripts/validate-training-experience-v3.mjs
          node scripts/validate-release-workflow-controls.mjs
          node scripts/validate-field-baseline-v1.mjs
          node scripts/validate-training-release-isolation.mjs
          node --check provenance-v3-2.js
          node --check field-v37.js
          node --check pwa-v3.js
          node --check sw.js
          grep -q "appVersion:'2026.08.14-v3.12'" provenance-v3-2.js
          grep -q "datasetSha256:'a98b8badf4c3df616fb091eb32ff85f70682f226e4fcd55591f3784b37abe200'" provenance-v3-2.js
          grep -q 'records.length!==78' boot-v2.js
          grep -q 'db.meta.goCount!==76' boot-v2.js
          grep -q 'db.meta.noGoCount!==2' boot-v2.js
          if grep -Eqi 'manager-assigned|assigned training|due date' training-experience-v3.js training-ux-polish-v1.js; then echo 'Manager-assigned training reintroduced'; exit 1; fi
          if grep -q '<iframe' training-player-v1.js; then echo 'Embedded training iframe reintroduced'; exit 1; fi

      - name: Build static production bundle
        run: |
          node scripts/build-canvass-site.mjs
          test -f canvass-dist/index.html
          test -f canvass-dist/field-v37.js
          test -f canvass-dist/sw.js
          test -f canvass-dist/training-experience-v3.js

      - name: Install isolated Playwright runtime
        shell: bash
        run: |
          PLAYWRIGHT_ROOT="$RUNNER_TEMP/pcm-unified-release-playwright"
          rm -rf "$PLAYWRIGHT_ROOT" node_modules
          mkdir -p "$PLAYWRIGHT_ROOT"
          printf '{"private":true,"type":"module"}\n' > "$PLAYWRIGHT_ROOT/package.json"
          npm install --prefix "$PLAYWRIGHT_ROOT" --no-save --ignore-scripts --package-lock=false @playwright/test@1.62.1
          ln -s "$PLAYWRIGHT_ROOT/node_modules" node_modules
          timeout --signal=TERM 10m ./node_modules/.bin/playwright install webkit chromium

      - name: Start isolated test server
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/pcm-unified-release-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && break; sleep 1; done

      - name: Run iPhone field, offline, University and UX regressions
        run: >-
          ./node_modules/.bin/playwright test
          tests/mobile-regression.spec.js
          tests/offline-regression.spec.js
          tests/training-experience-v2.spec.js
          tests/training-experience-v3.spec.js
          tests/training-smoke.spec.js
          tests/currentness-smoke.spec.js
          tests/readiness-smoke.spec.js
          tests/practice-smoke.spec.js
          tests/checks-smoke.spec.js
          tests/more-search-smoke.spec.js
          tests/media-library-smoke.spec.js
          tests/player-progress-smoke.spec.js
          tests/manager-home-smoke.spec.js
          tests/lesson-flow-acceptance.spec.js
          tests/release-readiness-smoke.spec.js
          tests/sales-closing-smoke.spec.js
          tests/deep-audit-regression.spec.js
          tests/training-ux-polish.spec.js
          --project=webkit-iphone --retries=0 --reporter=github

      - name: Run device matrix regression
        run: ./node_modules/.bin/playwright test tests/matrix-smoke.spec.js --retries=0 --reporter=github

      - name: Run adversarial browser matrix
        run: ./node_modules/.bin/playwright test tests/training-red-team-v1.spec.js tests/service-worker-hardening-v1.spec.js tests/progress-transfer-recovery-v1.spec.js --retries=0 --reporter=github

      - name: Publish validated snapshot artifacts and metadata
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_SHA="$(git ls-remote origin refs/heads/paradise-canvass-manager-public | cut -f1)"
          if [ "$REMOTE_SHA" != "$GITHUB_SHA" ]; then echo 'A newer public commit exists; not publishing this run.'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add controlled-register-source.json plain-data.js register-manifest.json change-control-report.json provenance-v3-2.js
          if git diff --cached --quiet; then
            VALIDATED_SHA="$GITHUB_SHA"
          else
            git commit -m 'Publish validated canvass app artifacts'
            git push origin HEAD:paradise-canvass-manager-public
            VALIDATED_SHA="$(git rev-parse HEAD)"
          fi
          VALIDATED_SHA="$VALIDATED_SHA" node <<'NODE'
          const fs=require('fs');
          const p=fs.readFileSync('provenance-v3-2.js','utf8');
          const version=p.match(/appVersion:'([^']+)'/)[1];
          const manifest=JSON.parse(fs.readFileSync('register-manifest.json','utf8'));
          const changes=JSON.parse(fs.readFileSync('change-control-report.json','utf8'));
          const sha=process.env.VALIDATED_SHA;
          const meta={version,sha,snapshot:manifest.snapshot,datasetSha256:manifest.sha256,records:manifest.records,go:manifest.go,noGo:manifest.noGo,changeControl:{datasetChanged:changes.datasetChanged,jurisdictionChangeCount:changes.jurisdictionChangeCount,classificationChanges:changes.classificationChanges.length},url:`https://rawcdn.githack.com/twiztd1166/proud-math-b7d8/${sha}/index.html`,validated:true,publishedAt:new Date().toISOString()};
          fs.writeFileSync('latest.json',JSON.stringify(meta,null,2)+'\n');
          NODE
          git add latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish validated canvass app metadata'
            git push origin HEAD:paradise-canvass-manager-public
          fi
          git push origin "$VALIDATED_SHA:refs/heads/paradise-canvass-manager-validated"
