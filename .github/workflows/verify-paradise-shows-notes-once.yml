name: Paradise Shows notes one-time verifier

on:
  push:
    branches:
      - paradise-shows-public

permissions:
  contents: read

jobs:
  verify-notes:
    if: contains(github.event.head_commit.message, 'Add one-time show notes verifier')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API: https://taxlrlfsobtnbasjcnuf.supabase.co/functions/v1/shows-api
      MFC_ID: MFC-004
    steps:
      - uses: actions/checkout@v4
      - name: Verify notes UI is present
        shell: bash
        run: |
          grep -q "Manager notes" public/app-modals.js
          grep -q "listShowNotes" public/app-modals.js
          grep -q "addShowNote" public/app-modals.js
          grep -q "Shared show notes" public/app.css
      - name: Add timestamped note through production API
        shell: bash
        run: |
          marker="[SYSTEM TEST ${GITHUB_RUN_ID}] timestamp/order validation"
          printf '%s' "$marker" > /tmp/marker.txt
          python3 - <<'PY'
          import json, os, urllib.request, pathlib
          api=os.environ['API']
          payload=json.dumps({'action':'addShowNote','mfcId':os.environ['MFC_ID'],'note':pathlib.Path('/tmp/marker.txt').read_text()}).encode()
          req=urllib.request.Request(api,data=payload,method='POST',headers={'Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=30) as r:
              data=json.load(r)
          assert data.get('ok') is True, data
          note=data.get('note') or {}
          assert note.get('created_at'), note
          assert note.get('id') is not None, note
          pathlib.Path('/tmp/created.json').write_text(json.dumps(note))
          print('addShowNote: PASS', note['id'], note['created_at'])
          PY
      - name: Verify newest-first retrieval
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, pathlib
          api=os.environ['API']
          payload=json.dumps({'action':'listShowNotes','mfcId':os.environ['MFC_ID']}).encode()
          req=urllib.request.Request(api,data=payload,method='POST',headers={'Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=30) as r:
              data=json.load(r)
          assert data.get('ok') is True, data
          notes=data.get('notes') or []
          created=json.loads(pathlib.Path('/tmp/created.json').read_text())
          assert any(n.get('id')==created.get('id') for n in notes), (created, notes[:5])
          keys=[(str(n.get('created_at') or ''), int(n.get('id') or 0)) for n in notes]
          assert keys==sorted(keys, reverse=True), keys[:10]
          print('listShowNotes newest-first: PASS', len(notes))
          PY