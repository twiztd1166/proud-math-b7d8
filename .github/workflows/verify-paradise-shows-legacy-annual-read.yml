name: Paradise Shows legacy annual compatibility verifier

on:
  push:
    branches:
      - paradise-shows-public
  pull_request:
    branches:
      - paradise-shows-public
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-legacy-annual-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SITE: https://paradise-shows-public.proud-math-b7d8.pages.dev
      ANNUAL_API: https://taxlrlfsobtnbasjcnuf.supabase.co/functions/v1/shows-annual-plan-api
      HISTORY_API: https://taxlrlfsobtnbasjcnuf.supabase.co/functions/v1/shows-history-api
      SHOWS_API: https://taxlrlfsobtnbasjcnuf.supabase.co/functions/v1/shows-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify canonical browser annual endpoint
        shell: bash
        run: |
          set -euo pipefail
          node --check public/app-annual-api.js
          grep -q 'functions/v1/shows-annual-plan-api' public/app-annual-api.js
          if grep -q 'functions/v1/shows-api' public/app-annual-api.js; then
            echo '::error::Annual browser adapter must not use the general operating API.'
            exit 1
          fi
          if grep -q 'functions/v1/shows-history-api' public/app-annual-api.js; then
            echo '::error::Annual browser adapter must not use the historical compatibility API.'
            exit 1
          fi
          echo 'Canonical annual browser endpoint: PASS'

      - name: Verify all annual read paths follow current publication
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsS -o /tmp/canonical.json \
            -X POST "$ANNUAL_API" -H "Origin: $SITE" -H 'Content-Type: application/json' \
            --data '{"action":"annualPlan","year":2027}'
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsS -o /tmp/history-compat.json \
            -X POST "$HISTORY_API" -H "Origin: $SITE" -H 'Content-Type: application/json' \
            --data '{"action":"annualPlan","year":2027}'
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsS -o /tmp/shows-compat.json \
            -X POST "$SHOWS_API" -H "Origin: $SITE" -H 'Content-Type: application/json' \
            --data '{"action":"annualPlan","year":2027}'
          node <<'NODE'
          const fs=require('fs'),assert=require('assert');
          const canonical=JSON.parse(fs.readFileSync('/tmp/canonical.json','utf8'));
          const history=JSON.parse(fs.readFileSync('/tmp/history-compat.json','utf8'));
          const shows=JSON.parse(fs.readFileSync('/tmp/shows-compat.json','utf8'));

          assert.equal(canonical.ok,true,canonical);
          assert.equal(canonical.version,3,canonical);
          assert.equal(canonical.published,true,canonical);
          assert.ok(canonical.publication?.run_id,canonical.publication);
          assert.equal(canonical.run?.id,canonical.publication.run_id,canonical);
          assert.equal(canonical.run?.status,'READY',canonical.run);

          const rows=canonical.rows||[];
          assert.equal(rows.length,Number(canonical.run?.row_count),canonical.run);
          const core={
            rows:rows.length,
            profiles:new Set(rows.map(row=>row.profile_id)).size,
            pursue:rows.filter(row=>row.plan_decision==='PURSUE').length,
            watch:rows.filter(row=>row.plan_decision==='WATCH').length,
            research:rows.filter(row=>row.plan_decision==='RESEARCH_IDENTITY').length,
            exact:rows.filter(row=>row.event_start).length,
            expected:rows.filter(row=>!row.event_start&&row.expected_month!=null).length,
            conflicts:rows.filter(row=>String(row.conflict_notes||'').trim()).length,
          };
          assert.deepEqual({
            rows:canonical.summary?.rows,profiles:canonical.summary?.profiles,pursue:canonical.summary?.pursue,
            watch:canonical.summary?.watch,research:canonical.summary?.research,exact:canonical.summary?.exact,
            expected:canonical.summary?.expected,conflicts:canonical.summary?.conflicts,
          },core);

          for(const [label,x,version] of [['history',history,2],['shows',shows,1]]){
            assert.equal(x.ok,true,{label,x});
            assert.equal(x.version,version,{label,x});
            assert.equal(x.run?.id,canonical.run.id,{label,run:x.run,canonical:canonical.run});
            assert.equal(x.run?.status,'READY',{label,run:x.run});
            assert.equal(Number(x.run?.row_count),rows.length,{label,run:x.run});
            assert.deepEqual({
              rows:x.summary?.rows,profiles:x.summary?.profiles,pursue:x.summary?.pursue,
              watch:x.summary?.watch,research:x.summary?.research,exact:x.summary?.exact,
              expected:x.summary?.expected,conflicts:x.summary?.conflicts,
            },core,{label,summary:x.summary,core});
            const compatRows=x.rows||[];
            assert.equal(compatRows.length,rows.length,{label});
            const fields=['plan_id','profile_id','plan_decision','priority','event_start','event_end','expected_month','estimated_start','estimated_end','conflict_notes'];
            const normalize=list=>list.map(row=>Object.fromEntries(fields.map(k=>[k,row?.[k]??null]))).sort((a,b)=>String(a.plan_id).localeCompare(String(b.plan_id)));
            assert.deepEqual(normalize(compatRows),normalize(rows),{label});
          }

          console.log({published_run:canonical.run.id,canonical_version:canonical.version,history_version:history.version,shows_version:shows.version,summary:core});
          console.log('All annual compatibility paths follow current publication: PASS');
          NODE
