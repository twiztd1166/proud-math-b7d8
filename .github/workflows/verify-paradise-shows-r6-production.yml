name: Paradise Shows R6 production scope verifier

on:
  push:
    branches:
      - paradise-shows-public
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-r6-production-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SITE: https://paradise-shows-public.proud-math-b7d8.pages.dev
      API: https://taxlrlfsobtnbasjcnuf.supabase.co/functions/v1/shows-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Wait for R6 scope asset and page wiring
        shell: bash
        run: |
          set -euo pipefail
          expected="$(sha256sum public/app-annual-scope.js | awk '{print $1}')"
          for attempt in $(seq 1 36); do
            scope_url="$SITE/app-annual-scope.js?release=${GITHUB_SHA}"
            page_url="$SITE/?release=${GITHUB_SHA}"
            if curl -fsS -H 'Cache-Control: no-cache' "$scope_url" -o /tmp/app-annual-scope.js \
              && curl -fsS -H 'Cache-Control: no-cache' "$page_url" -o /tmp/index.html; then
              actual="$(sha256sum /tmp/app-annual-scope.js | awk '{print $1}')"
              if [[ "$expected" == "$actual" ]] && grep -q 'app-annual-scope.js' /tmp/index.html; then
                echo 'R6 production scope asset/wiring: PASS'
                exit 0
              fi
            fi
            echo "Attempt $attempt: R6 scope deployment not converged"
            sleep 5
          done
          echo '::error::Stable site did not converge to the R6 scope controller.'
          exit 1

      - name: Verify deployed classifier against live annual plan
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsS -o /tmp/annual.json \
            -X POST "$API" -H "Origin: $SITE" -H 'Content-Type: application/json' \
            --data '{"action":"annualPlan","year":2027}'
          node <<'NODE'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const annual=JSON.parse(fs.readFileSync('/tmp/annual.json','utf8'));
          assert.equal(annual.ok,true);
          assert([104,107].includes(annual.summary.rows),annual.summary);
          const source=fs.readFileSync('/tmp/app-annual-scope.js','utf8');
          const sandbox={
            state:{annualPlan:{rows:[],summary:{},loaded:true,run:{id:'test'},filter:'ALL'},search:''},
            renderAnnualPlan(){return '<div>base</div>'},render(){},esc(v){return String(v??'')},
            document:{addEventListener(){}},window:{},console,
          };
          vm.createContext(sandbox);vm.runInContext(source,sandbox);
          const t=sandbox.window.__PARADISE_ANNUAL_SCOPE_TEST__;
          const counts=Object.fromEntries(t.ANNUAL_SCOPE_KEYS.map(k=>[k,t.annualScopeRows(k,annual.rows).length]));
          assert.equal(counts.WEST_COAST_FLORIDA,11,counts);
          assert.equal(counts.B2B,1,counts);
          assert.equal(counts.CENTRAL_FLORIDA,0,counts);
          assert.equal(counts.NORTHERN_FLORIDA,0,counts);
          assert.equal(counts.PANHANDLE_FLORIDA,0,counts);
          assert.equal(counts.EAST_COAST_FLORIDA,annual.summary.rows===107?95:92,counts);
          console.log({run:annual.run?.id,rows:annual.summary.rows,scope_counts:counts});
          console.log('R6 live scope classification: PASS');
          NODE
