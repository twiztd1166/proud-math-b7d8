name: Paradise Shows annual-plan production scope verifier

on:
  push:
    branches:
      - paradise-shows-public
  pull_request:
    branches:
      - paradise-shows-public
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-production-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SITE: https://paradise-shows-public.proud-math-b7d8.pages.dev
      ANNUAL_API: https://taxlrlfsobtnbasjcnuf.supabase.co/functions/v1/shows-annual-plan-api
      HISTORY_API: https://taxlrlfsobtnbasjcnuf.supabase.co/functions/v1/shows-history-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify scope controller syntax and revision-neutral semantics
        shell: bash
        run: |
          set -euo pipefail
          node --check public/app-annual-scope.js
          grep -q "DIRECT_PLAN_PROFILE" public/app-annual-scope.js
          grep -q "DIRECT_R\\d+_PROFILE" public/app-annual-scope.js
          grep -q "estimated_start" public/app-annual-scope.js
          if grep -q "HISTORY_FILTER_KEYS=.*DIRECT_R8_PROFILE" public/app-annual-scope.js; then
            echo '::error::Historical filter is revision-specific.'
            exit 1
          fi
          echo 'Revision-neutral scope source: PASS'

      - name: Wait for annual scope asset and page wiring
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          expected="$(sha256sum public/app-annual-scope.js | awk '{print $1}')"
          for attempt in $(seq 1 36); do
            scope_url="$SITE/app-annual-scope.js?release=${GITHUB_SHA}"
            page_url="$SITE/?release=${GITHUB_SHA}"
            if curl -fsS -H 'Cache-Control: no-cache' "$scope_url" -o /tmp/app-annual-scope.js \
              && curl -fsS -H 'Cache-Control: no-cache' "$page_url" -o /tmp/index.html; then
              actual="$(sha256sum /tmp/app-annual-scope.js | awk '{print $1}')"
              if [[ "$expected" == "$actual" ]] && grep -q 'app-annual-scope.js' /tmp/index.html; then
                echo 'Annual-plan production scope asset/wiring: PASS'
                exit 0
              fi
            fi
            echo "Attempt $attempt: annual scope deployment not converged"
            sleep 5
          done
          echo '::error::Stable site did not converge to the annual scope controller.'
          exit 1

      - name: Verify current published classifier and historical coverage
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsS -o /tmp/annual.json \
            -X POST "$ANNUAL_API" -H "Origin: $SITE" -H 'Content-Type: application/json' \
            --data '{"action":"annualPlan","year":2027}'
          CURRENT_RUN="$(jq -er '.run.id' /tmp/annual.json)"
          history_payload="$(jq -nc --arg runId "$CURRENT_RUN" '{year:2027,runId:$runId,allowLatestAuditPreview:true}')"
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsS -o /tmp/history.json \
            -X POST "$HISTORY_API" -H "Origin: $SITE" -H 'Content-Type: application/json' --data "$history_payload"
          node <<'NODE'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const annual=JSON.parse(fs.readFileSync('/tmp/annual.json','utf8'));
          const history=JSON.parse(fs.readFileSync('/tmp/history.json','utf8'));
          assert.equal(annual.ok,true,annual);
          assert.equal(annual.version,3,annual);
          assert.equal(annual.published,true,annual);
          assert.ok(annual.publication?.run_id,annual.publication);
          assert.equal(annual.run?.id,annual.publication.run_id,annual);
          assert.equal(annual.run?.status,'READY',annual.run);
          assert.equal(history.ok,true,history);
          assert.equal(history.run?.id,annual.run.id,history.run);
          assert.equal(Boolean(history.preview),false,history);

          const source=fs.readFileSync('public/app-annual-scope.js','utf8');
          const runId=annual.run.id;
          const sandbox={
            state:{annualPlan:{year:2027,rows:[],summary:{},loaded:true,run:{id:runId},filter:'ALL'},search:'',tab:'shows',showMode:'PLAN2027'},
            annualPlanMonthKey(){return 'legacy';},
            renderAnnualPlan(){return '<div>base</div>'},render(){},esc(v){return String(v??'')},money(v){return '$'+String(v??'')},
            document:{addEventListener(){}},window:{},console,
          };
          vm.createContext(sandbox);vm.runInContext(source,sandbox);
          const t=sandbox.window.__PARADISE_ANNUAL_SCOPE_TEST__;
          assert(t,'scope test surface unavailable');
          assert.equal(sandbox.annualPlanMonthKey({estimated_start:'2027-06-04'}),'2027-06-04');
          assert.equal(sandbox.annualPlanMonthKey({expected_month:8}),'2027-08-15');

          const rows=annual.rows||[];
          const counts=Object.fromEntries(t.ANNUAL_SCOPE_KEYS.map(k=>[k,t.annualScopeRows(k,rows).length]));
          assert.equal(Object.values(counts).reduce((a,b)=>a+b,0),rows.length,counts);
          for(const row of rows){
            const matches=t.ANNUAL_SCOPE_KEYS.filter(k=>t.annualScopeRows(k,[row]).length===1);
            assert.equal(matches.length,1,{plan_id:row.plan_id,matches});
          }

          const eastRows=t.annualScopeRows('EAST_COAST_FLORIDA',rows);
          const east=t.annualScopeSummary(eastRows);
          assert.equal(east.rows,eastRows.length,east);
          assert.equal(east.profiles,new Set(eastRows.map(row=>row.profile_id)).size,east);
          assert.equal(east.pursue,eastRows.filter(row=>row.plan_decision==='PURSUE').length,east);
          assert.equal(east.watch,eastRows.filter(row=>row.plan_decision==='WATCH').length,east);
          assert.equal(east.research,eastRows.filter(row=>row.plan_decision==='RESEARCH_IDENTITY').length,east);

          const historyRows=history.rows||[];
          const historyCounts=t.historicalCoverageCounts(historyRows);
          assert.equal(historyCounts.ALL,historyRows.length,historyCounts);
          assert.equal(historyCounts.DIRECT_PLAN_PROFILE,Number(history.summary?.direct_profiles),historyCounts);
          assert.equal(historyCounts.VERIFIED_ROUTE,Number(history.summary?.active_routes)+Number(history.summary?.staged_routes),historyCounts);
          assert.equal(historyCounts.B2B_SEPARATE,Number(history.summary?.b2b_rows),historyCounts);

          sandbox.state.annualPlan={...annual,year:2027,loaded:true,filter:'ALL',scope:'EAST_COAST_FLORIDA'};
          sandbox.state.annualProfileAudit={
            rows:historyRows,summary:history.summary,run:history.run,requestedRun:history.requested_run,
            requestedRunId:runId,preview:false,previewSource:null,view:'HISTORY',filter:'CONSUMER',
            loaded:true,loading:false,error:null
          };
          const html=sandbox.window.renderAnnualPlanScoped();
          assert(html.includes('East Coast Historical Coverage'));
          const direct=Number(history.summary?.direct_profiles)||0;
          const active=Number(history.summary?.active_routes)||0;
          const staged=Number(history.summary?.staged_routes)||0;
          const gaps=Number(history.summary?.gap_dispositions)||0;
          assert(html.includes(`Coverage equation: ${direct} direct + ${active} active verified routes + ${staged} staged verified routes + ${gaps} gap dispositions = ${historyRows.length} East Coast identities.`));

          console.log({run:runId,scope_counts:counts,east_summary:east,history_counts:historyCounts});
          console.log('Current published annual scope + historical coverage: PASS');
          NODE
