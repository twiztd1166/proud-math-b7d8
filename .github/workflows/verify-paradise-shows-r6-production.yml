name: Paradise Shows annual-plan production scope verifier

on:
  push:
    branches:
      - paradise-shows-public
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-production-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SITE: https://paradise-shows-public.proud-math-b7d8.pages.dev
      API: https://taxlrlfsobtnbasjcnuf.supabase.co/functions/v1/shows-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Wait for annual scope asset and page wiring
        shell: bash
        run: |
          set -euo pipefail
          expected="$(sha256sum public/app-annual-scope.js | awk '{print $1}')"
          for attempt in $(seq 1 36); do
            scope_url="$SITE/app-annual-scope.js?release=${GITHUB_SHA}"
            page_url="$SITE/?release=${GITHUB_SHA}"
            if curl -fsS -H 'Cache-Control: no-cache' "$scope_url" -o /tmp/app-annual-scope.js \
              && curl -fsS -H 'Cache-Control: no-cache' "$page_url" -o /tmp/index.html; then
              actual="$(sha256sum /tmp/app-annual-scope.js | awk '{print $1}')"
              if [[ "$expected" == "$actual" ]] && grep -q 'app-annual-scope.js' /tmp/index.html; then
                echo 'Annual-plan production scope asset/wiring: PASS'
                exit 0
              fi
            fi
            echo "Attempt $attempt: annual scope deployment not converged"
            sleep 5
          done
          echo '::error::Stable site did not converge to the annual scope controller.'
          exit 1

      - name: Verify deployed classifier against live annual plan
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsS -o /tmp/annual.json \
            -X POST "$API" -H "Origin: $SITE" -H 'Content-Type: application/json' \
            --data '{"action":"annualPlan","year":2027}'
          node <<'NODE'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const annual=JSON.parse(fs.readFileSync('/tmp/annual.json','utf8'));
          assert.equal(annual.ok,true);
          const expectedByRun={
            '0294bac9-5400-4f31-9a13-fc7897b4ddfd':{rows:104,profiles:100,pursue:35,watch:69,exact:37,expectedMonth:43,conflicts:28,east:92,eastProfiles:89,eastPursue:30,eastWatch:62},
            '893343f8-8347-4c63-bfce-9eff4b351667':{rows:107,profiles:103,pursue:35,watch:72,exact:42,expectedMonth:42,conflicts:29,east:95,eastProfiles:92,eastPursue:30,eastWatch:65},
            '910320e9-5942-4cb6-aa3e-5203bb1fb3e2':{rows:112,profiles:108,pursue:37,watch:75,exact:44,expectedMonth:45,conflicts:31,east:100,eastProfiles:97,eastPursue:32,eastWatch:68},
            '6570ebf8-7b5f-4314-a65d-030100f644a3':{rows:121,profiles:116,pursue:37,watch:84,exact:54,expectedMonth:44,conflicts:43,east:109,eastProfiles:105,eastPursue:32,eastWatch:77},
          };
          const run=annual.run||{};
          const expected=expectedByRun[run.id];
          assert(expected,{run,summary:annual.summary});
          assert.equal(run.status,'READY',run);
          assert.equal(run.row_count,expected.rows,run);
          assert.equal(annual.summary.rows,expected.rows,annual.summary);
          assert.equal(annual.summary.profiles,expected.profiles,annual.summary);
          assert.equal(annual.summary.pursue,expected.pursue,annual.summary);
          assert.equal(annual.summary.watch,expected.watch,annual.summary);
          assert.equal(annual.summary.research,0,annual.summary);
          assert.equal(annual.summary.exact,expected.exact,annual.summary);
          assert.equal(annual.summary.expected,expected.expectedMonth,annual.summary);
          assert.equal(annual.summary.conflicts,expected.conflicts,annual.summary);
          const source=fs.readFileSync('/tmp/app-annual-scope.js','utf8');
          const sandbox={
            state:{annualPlan:{rows:[],summary:{},loaded:true,run:{id:'test'},filter:'ALL'},search:''},
            renderAnnualPlan(){return '<div>base</div>'},render(){},esc(v){return String(v??'')},
            document:{addEventListener(){}},window:{},console,
          };
          vm.createContext(sandbox);vm.runInContext(source,sandbox);
          const t=sandbox.window.__PARADISE_ANNUAL_SCOPE_TEST__;
          const counts=Object.fromEntries(t.ANNUAL_SCOPE_KEYS.map(k=>[k,t.annualScopeRows(k,annual.rows).length]));
          assert.equal(counts.WEST_COAST_FLORIDA,11,counts);
          assert.equal(counts.B2B,1,counts);
          assert.equal(counts.CENTRAL_FLORIDA,0,counts);
          assert.equal(counts.NORTHERN_FLORIDA,0,counts);
          assert.equal(counts.PANHANDLE_FLORIDA,0,counts);
          assert.equal(counts.EAST_COAST_FLORIDA,expected.east,counts);
          const eastSummary=t.annualScopeSummary(t.annualScopeRows('EAST_COAST_FLORIDA',annual.rows));
          assert.equal(eastSummary.rows,expected.east,eastSummary);
          assert.equal(eastSummary.profiles,expected.eastProfiles,eastSummary);
          assert.equal(eastSummary.pursue,expected.eastPursue,eastSummary);
          assert.equal(eastSummary.watch,expected.eastWatch,eastSummary);
          if(run.id==='910320e9-5942-4cb6-aa3e-5203bb1fb3e2'){
            const required=new Set([
              '2027-HIST-059-PRIMARY','2027-HIST-109-PRIMARY','2027-HIST-111-PRIMARY',
              '2027-HIST-122-PRIMARY','2027-HIST-210-PRIMARY',
            ]);
            for(const row of annual.rows||[]){
              if(required.has(row.plan_id)){
                assert.equal(t.annualScopeKey(row),'EAST_COAST_FLORIDA',row);
                required.delete(row.plan_id);
              }
            }
            assert.equal(required.size,0,{missing:[...required]});
          }
          if(run.id==='6570ebf8-7b5f-4314-a65d-030100f644a3'){
            const rows=Object.fromEntries((annual.rows||[]).map(row=>[row.plan_id,row]));
            const added=[
              '2027-HIST-055-PRIMARY','2027-HIST-079-PRIMARY','2027-HIST-105-PRIMARY',
              '2027-HIST-110-PRIMARY','2027-HIST-118-PRIMARY','2027-HIST-152-PRIMARY',
              '2027-HIST-240-PRIMARY','2027-HIST-431-PRIMARY','2027-LIFE-009-APR',
            ];
            for(const planId of added){
              assert(rows[planId],{missing:planId});
              assert.equal(t.annualScopeKey(rows[planId]),'EAST_COAST_FLORIDA',rows[planId]);
            }
            assert.equal(rows['2027-HIST-240-PRIMARY'].event_start,'2027-01-15');
            assert.equal(rows['2027-HIST-240-PRIMARY'].event_end,'2027-01-18');
            assert.equal(Number(rows['2027-HIST-240-PRIMARY'].budget_min),1750);
            assert.equal(Number(rows['2027-HIST-240-PRIMARY'].budget_max),1750);
            assert.equal(rows['2027-HIST-055-PRIMARY'].event_start,'2027-02-20');
            assert.equal(rows['2027-HIST-055-PRIMARY'].event_end,'2027-02-21');
            assert.equal(rows['2027-LIFE-009-APR'].event_start,'2027-04-10');
            assert.equal(rows['2027-LIFE-009-APR'].event_end,'2027-04-11');
            assert.equal(rows['2027-HIST-431-PRIMARY'].event_start,'2027-05-01');
            assert.equal(rows['2027-HIST-152-PRIMARY'].event_start,'2027-06-18');
            assert.equal(rows['2027-HIST-152-PRIMARY'].event_end,'2027-06-20');
            assert.equal(rows['2027-HIST-152-PRIMARY'].date_confidence,'CURRENT_SAME_NAME_SUCCESSOR_IDENTITY_UNVERIFIED');
            assert.equal(rows['2027-HIST-079-PRIMARY'].event_start,'2027-07-04');
            const sebastian=rows['2027-HIST-098-PRIMARY'];
            assert(sebastian,{'missing':'2027-HIST-098-PRIMARY'});
            assert.equal(sebastian.event_start,'2027-09-11');
            assert.equal(sebastian.cost_status,'KNOWN_VERIFIED');
            assert.equal(Number(sebastian.budget_min),500);
            assert.equal(Number(sebastian.budget_max),500);
            assert.equal(rows['2027-HIST-105-PRIMARY'].event_start,'2027-10-02');
            assert.equal(rows['2027-HIST-105-PRIMARY'].cost_status,'PACKAGE_COVERED_BY_HIST-098');
            assert.equal(rows['2027-HIST-110-PRIMARY'].event_start,'2027-10-29');
            assert.equal(rows['2027-HIST-110-PRIMARY'].cost_status,'PACKAGE_COVERED_BY_HIST-098');
            assert.equal(rows['2027-HIST-118-PRIMARY'].event_start,'2027-12-04');
            assert.equal(rows['2027-HIST-118-PRIMARY'].cost_status,'PACKAGE_COVERED_BY_HIST-098');
          }
          console.log({run:run.id,rows:annual.summary.rows,scope_counts:counts,east_summary:eastSummary});
          console.log('Live annual scope classification: PASS');
          NODE
