name: Deploy Paradise Shows to GitHub Pages

on:
  push:
    branches:
      - paradise-shows-public
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: paradise-shows-github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build static Paradise Shows site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          cp public/app.css site/
          cp public/app-core.js site/
          cp public/app-annual-api.js site/
          cp public/app-shows.js site/
          cp public/app-annual-scope.js site/
          cp public/app-control.js site/
          cp public/app-bind.js site/
          cp public/app-modals.js site/
          cp public/icon.svg site/
          node <<'NODE'
          const fs=require('fs');
          let html=fs.readFileSync('src/pages/index.astro','utf8');
          html=html.replace(/^---[\s\S]*?---\s*/,'').replaceAll(' is:inline','').replaceAll('="/','="./');
          fs.writeFileSync('site/index.html',html);

          const manifest=JSON.parse(fs.readFileSync('public/manifest.webmanifest','utf8'));
          manifest.id='./';
          manifest.start_url='./';
          manifest.scope='./';
          manifest.icons=(manifest.icons||[]).map(x=>({...x,src:String(x.src||'').replace(/^\//,'./')}));
          fs.writeFileSync('site/manifest.webmanifest',JSON.stringify(manifest));

          let sw=fs.readFileSync('public/sw.js','utf8')
            .replace(/paradise-shows-public-v\d+/,'paradise-shows-pages-v1')
            .replaceAll("['/","['./")
            .replaceAll(",'/",",'./");
          fs.writeFileSync('site/sw.js',sw);

          let control=fs.readFileSync('site/app-control.js','utf8')
            .replaceAll('href="/support"','href="./"')
            .replaceAll('href="/privacy"','href="./"');
          fs.writeFileSync('site/app-control.js',control);
          NODE
          touch site/.nojekyll
          grep -q 'Manager notes' site/app-modals.js
          grep -q 'profileNoteAddBtn' site/app-modals.js
          grep -q '<title>Paradise Shows</title>' site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
