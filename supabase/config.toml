# Paradise Performance v1 — non-production Edge Function auth configuration.
# Current Supabase publishable/secret keys are not JWTs. All three functions therefore
# disable legacy platform JWT verification and authorize inside the handler instead.
# Mint/revoke validate the caller's user access JWT with auth.getUser() plus current
# Performance enrollment/role checks. Redeem uses the high-entropy one-time QR credential.

[functions.performance-enrollment-mint]
verify_jwt = false

[functions.performance-enrollment-redeem]
verify_jwt = false

[functions.performance-device-revoke]
verify_jwt = false
