# Paradise Performance v1 — non-production Edge Function auth configuration.
# Mint and revoke are called only by signed-in Performance managers/admins: the platform
# verifies the user session JWT first, then the handler independently validates auth.getUser()
# plus the current Performance employee/role mapping. Enrollment redemption intentionally
# has no prior user JWT; its short-lived high-entropy one-time QR token is the credential.
# Store-review mint is called only by a signed-in reusable marketplace-review gate account.
# That account has no Performance actor identity; the handler validates auth.getUser() plus
# admin-controlled review app_metadata and can mint only the configured synthetic canvasser.
# First-manager bootstrap mint is a one-time initialization path only. It requires a temporary
# Auth user created through a supported Supabase Dashboard/Auth Admin route with exact
# administrator-controlled bootstrap app_metadata. The handler rejects synthetic review IDs,
# refuses to run once a privileged Performance actor exists, and disables the temporary Auth
# identity before returning the ordinary short-lived trusted-device enrollment token.

[functions.performance-enrollment-mint]
verify_jwt = true

[functions.performance-enrollment-redeem]
verify_jwt = false

[functions.performance-device-revoke]
verify_jwt = true

[functions.performance-review-enrollment-mint]
verify_jwt = true

[functions.performance-first-manager-bootstrap-mint]
verify_jwt = true
