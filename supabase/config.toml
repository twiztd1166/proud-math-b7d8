# Paradise Performance v1 — non-production Edge Function auth configuration.
# Manager operations require a valid user JWT at the platform and handler layers.
# Enrollment redemption intentionally accepts no prior user JWT because the high-entropy,
# short-lived, single-use QR token is the enrollment credential.

[functions.performance-enrollment-mint]
verify_jwt = true

[functions.performance-enrollment-redeem]
verify_jwt = false

[functions.performance-device-revoke]
verify_jwt = true
